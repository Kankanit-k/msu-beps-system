    shell: true,
    caveat: false,
    html: "<div class=\"page\">\n\n  <div class=\"bm-note\">\n    <span>ℹ️</span>\n    <span>หน้านี้เก็บ<b>ตัวบัญชี</b> (<code style=\"font-family:'Manrope',monospace\">erp_account</code>)\n      ส่วนการกำหนดว่าบัญชีนั้นเป็น TFC หรือ TVC อยู่ที่\n      <a href=\"W14-account-rules.html\" style=\"color:var(--navy)\">W14 กติกาผังบัญชี</a>\n      — แยกกันเพราะ<b>บัญชีหนึ่งใบมีกติกาได้หลายช่วงปี</b> และกติกาต้องผ่านการอนุมัติ ส่วนตัวบัญชีมาจาก ERP</span>\n  </div>\n\n  <div class=\"kpis\">\n    <div class=\"kpi cn\"><div class=\"kpi-label\">บัญชีที่มีผลในปีที่เลือก</div><div class=\"kpi-val num\" style=\"color:var(--navy2)\" id=\"k-n\">—</div><div class=\"kpi-unit\" id=\"k-n-s\">คีย์ผสม 4 ระดับ</div></div>\n    <div class=\"kpi cg\"><div class=\"kpi-label\">ผูกกติกา TFC/TVC แล้ว</div><div class=\"kpi-val num\" style=\"color:var(--green2)\" id=\"k-rule\">—</div><div class=\"kpi-unit\">บัญชี · พร้อมเข้าการคำนวณ</div></div>\n    <div class=\"kpi cr\"><div class=\"kpi-label\">ยังไม่มีกติกา</div><div class=\"kpi-val num\" style=\"color:var(--red2)\" id=\"k-norule\">—</div><div class=\"kpi-unit\" id=\"k-norule-s\">บัญชี · เงินจะถูกพักไว้</div></div>\n    <div class=\"kpi co\"><div class=\"kpi-label\">ยอดเงินที่ครอบคลุม</div><div class=\"kpi-val num\" style=\"color:var(--gold)\" id=\"k-amt\">—</div><div class=\"kpi-unit\" id=\"k-amt-s\">ล้านบาท</div></div>\n  </div>\n\n  <div class=\"card\" style=\"margin-bottom:16px;background:var(--bg2)\">\n    <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ทำไมคีย์ต้องเป็น 4 ระดับ</div>\n      <div class=\"card-sub\">พิสูจน์จากข้อมูลจริง — <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">MAPPING.md</code> หัวข้อ 2</div></div></div>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px\">\n      <span class=\"flow-step done\">แผนงาน<br><code style=\"font-family:'Manrope',monospace;font-size:10px\">plan_code</code></span>\n      <span class=\"flow-arrow\">+</span>\n      <span class=\"flow-step done\">หมวดงบประมาณ<br><code style=\"font-family:'Manrope',monospace;font-size:10px\">budget_category_code</code></span>\n      <span class=\"flow-arrow\">+</span>\n      <span class=\"flow-step done\">หมวดรายจ่าย<br><code style=\"font-family:'Manrope',monospace;font-size:10px\">expenditure_category_code</code></span>\n      <span class=\"flow-arrow\">+</span>\n      <span class=\"flow-step done\">หมวดย่อย<br><code style=\"font-family:'Manrope',monospace;font-size:10px\">subcategory_code</code></span>\n      <span class=\"flow-arrow\">=</span>\n      <span class=\"flow-step now\">1 บัญชี</span>\n    </div>\n    <div class=\"sub-note\" style=\"margin:0\">\n      รหัสหมวดรายจ่ายเดียวกันเป็นคนละบัญชีได้เมื่ออยู่คนละแผนงาน — ดู\n      <code style=\"font-family:'Manrope',monospace\">800:80001 เงินอุดหนุน</code> สองแถวในตาราง\n      แผนงาน <b>2</b> เป็นเงินอุดหนุนทั่วไป (ยังไม่จำแนก) ส่วนแผนงาน <b>3</b> เป็นเงินอุดหนุนโครงการวิจัย (คงที่)\n      · <b>ถ้าตั้งคีย์ด้วยรหัสหมวดอย่างเดียวจะจำแนกผิดทั้งก้อน</b>\n    </div>\n  </div>\n\n  <div class=\"toolbar\">\n    <span class=\"bm-lbl\">ปีงบประมาณที่ดู:</span>\n    <select class=\"inp\" style=\"width:auto\" id=\"f-year\">\n      <option>2568</option><option>2569</option><option>2570</option>\n    </select>\n    <div class=\"seg\" id=\"f-rule\">\n      <button class=\"on\" data-f=\"all\">ทั้งหมด</button>\n      <button data-f=\"has\">มีกติกาแล้ว</button>\n      <button data-f=\"none\">ยังไม่มีกติกา</button>\n    </div>\n    <div class=\"be-search-wrap\" style=\"max-width:240px\">\n      <span class=\"be-search-ic\">🔍</span>\n      <input type=\"text\" id=\"f-q\" class=\"be-search\" placeholder=\"ค้นหารหัส / ชื่อบัญชี...\">\n    </div>\n    <span class=\"grow\"></span>\n    <span class=\"pill\" id=\"cnt\">—</span>\n    <button class=\"btn\">⬆ นำเข้าผังบัญชีจาก Excel</button>\n    <button class=\"btn primary\">+ เพิ่มบัญชี</button>\n  </div>\n\n  <div class=\"grid\" style=\"grid-template-columns:1.7fr 1fr\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n        <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ผังบัญชี</div>\n        <div class=\"card-sub\">คลิกแถวเพื่อดูรายละเอียดและกติกาที่ผูกอยู่ · ตัวอย่าง 11 บัญชีจากทั้งหมด 412 บัญชี</div>\n      </div>\n      <div style=\"max-height:520px;overflow:auto\">\n        <table class=\"tbl dense\">\n          <thead><tr>\n            <th class=\"num\" style=\"width:44px\">แผน</th>\n            <th class=\"num\" style=\"width:44px\">งบ</th>\n            <th class=\"num\" style=\"width:56px\">รายจ่าย</th>\n            <th class=\"num\" style=\"width:62px\">ย่อย</th>\n            <th>ชื่อบัญชี</th>\n            <th class=\"num\" style=\"width:80px\">ยอด (ลบ.)</th>\n            <th style=\"width:72px\">ช่วงปี</th>\n            <th style=\"width:118px\">กติกา TFC/TVC</th>\n          </tr></thead>\n          <tbody id=\"acc-tb\"></tbody>\n        </table>\n      </div>\n    </div>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div class=\"card\" id=\"detail\"></div>\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--red2)\"></span>เกิดอะไรขึ้นถ้าบัญชีไม่มีกติกา</div></div></div>\n        <div style=\"display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)\">\n          <div style=\"font-size:14px\">1️⃣</div>\n          <div><div style=\"font-size:12px;font-weight:600\">ระบบไม่เดาแทน</div>\n            <div class=\"rule-desc\">รายการถูกจัดเป็น <code style=\"font-family:'Manrope',monospace\">UNCLASSIFIED</code> ไม่ใช่เดาว่าเป็น FIXED</div></div>\n        </div>\n        <div style=\"display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)\">\n          <div style=\"font-size:14px\">2️⃣</div>\n          <div><div style=\"font-size:12px;font-weight:600\">เงินถูกพักไว้ที่หน่วยงาน</div>\n            <div class=\"rule-desc\">ไม่ปันลงหลักสูตร — ยอดรวมไม่หาย แต่ไม่เข้าไปในต้นทุนรายหลักสูตร</div></div>\n        </div>\n        <div style=\"display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)\">\n          <div style=\"font-size:14px\">3️⃣</div>\n          <div><div style=\"font-size:12px;font-weight:600\">ติดธงไปที่รายการค้างตรวจ</div>\n            <div class=\"rule-desc\">ปรากฏที่ <a href=\"W13-exceptions.html\">W13</a> พร้อมมูลค่าและผู้รับผิดชอบ</div></div>\n        </div>\n        <div style=\"display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;padding:10px 0\">\n          <div style=\"font-size:14px\">4️⃣</div>\n          <div><div style=\"font-size:12px;font-weight:600\">ตรวจยอดยังผ่าน</div>\n            <div class=\"rule-desc\">เพราะเงินไม่หาย — <b>นี่คือเหตุผลที่ต้องดู W13 คู่กับ W12 เสมอ</b></div></div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>จุดที่ต้องระวังในหน้านี้</h3>\n    <ul>\n      <li class=\"crit\"><b>ห้ามแก้รหัสของบัญชีที่คำนวณไปแล้ว</b> — ต้นทุนในรอบคำนวณเก่าอ้างบัญชีนี้อยู่ ถ้าเปลี่ยนรหัสจะตามกลับไม่ได้ว่าเงินก้อนนั้นมาจากไหน</li>\n      <li class=\"warn\"><b>บัญชียกเลิกให้ตั้ง <code style=\"font-family:'Manrope',monospace\">valid_to</code> ไม่ใช่ลบทิ้ง</b> — รายงานปีเก่ายังต้องอ่านชื่อบัญชีได้</li>\n      <li class=\"warn\"><b>บัญชีใหม่ต้องผูกกติกาที่ W14 ก่อนรอบคำนวณถัดไป</b> ไม่งั้นเงินก้อนนั้นจะไม่เข้าต้นทุนรายหลักสูตรทั้งปี</li>\n      <li class=\"info\"><b>ค่าเสื่อมราคาไม่มีรหัสผังบัญชี</b> จึงไม่อยู่ในตารางนี้ — กำหนดประเภทผ่านค่าตั้ง <code style=\"font-family:'Manrope',monospace\">depreciation_behavior</code> ที่ <a href=\"W15-settings.html\">W15</a></li>\n      <li class=\"ok\">ผังบัญชีปกติมาจาก ERP ผ่านการนำเข้า (<a href=\"W9-cost-data.html\">W9</a>) หน้านี้ใช้แก้รายกรณีและเพิ่มบัญชีที่ ERP ยังไม่ส่งมา</li>\n    </ul>\n  </div>\n\n</div>\n",
    init: function () {



let year = 2568, fRule = 'all', fQ = '', sel = 0;

const keyOf = a => `${a.plan} · ${a.bud} · ${a.exp} · ${a.sub}`;
const inYear = (a, y) => y >= +a.from && (a.to === null || y <= +a.to);
/* กติกาที่ผูกกับบัญชีนี้ — อ่านจากชุดเดียวกับ W14 ไม่ให้สองหน้าขัดกัน */
const rulesOf = a => ACCOUNTS.filter(x => x.key === (a.ruleKey || '␀'));

function visible() {
  return ERP_ACCOUNTS.map((a, i) => ({ a, i }))
    .filter(x => inYear(x.a, year))
    .filter(x => fRule === 'all' || (fRule === 'has' ? !!x.a.ruleKey : !x.a.ruleKey))
    .filter(x => !fQ || (keyOf(x.a) + x.a.name).toLowerCase().includes(fQ));
}

function renderKPI() {
  const live = ERP_ACCOUNTS.filter(a => inYear(a, year));
  const withRule = live.filter(a => a.ruleKey);
  const without = live.filter(a => !a.ruleKey);
  document.getElementById('k-n').textContent = fmtN(live.length);
  document.getElementById('k-n-s').textContent = `คีย์ผสม 4 ระดับ · มีผลปีงบ ${year}`;
  document.getElementById('k-rule').textContent = fmtN(withRule.length);
  document.getElementById('k-norule').textContent = fmtN(without.length);
  document.getElementById('k-norule-s').textContent =
    `บัญชี · ${fmtM(without.reduce((s, a) => s + a.amount, 0))} ลบ. จะถูกพักไว้`;
  document.getElementById('k-amt').textContent = fmtM(live.reduce((s, a) => s + a.amount, 0));
  document.getElementById('k-amt-s').textContent = `ล้านบาท · ปีงบประมาณ ${year}`;
}

function renderTable() {
  const rows = visible();
  document.getElementById('acc-tb').innerHTML = rows.map(({ a, i }) => {
    const r = rulesOf(a)[0];
    const cur = r ? r.rules.find(v => year >= v.from && (v.to === null || year <= v.to)) : null;
    const b = cur ? BEH[cur.beh] : null;
    return `<tr data-i="${i}" class="${i === sel ? 'sel' : ''}" style="cursor:pointer;${a.to ? 'opacity:.6' : ''}">
      <td class="num"><code style="font-family:'Manrope',monospace;font-size:10.5px;color:var(--navy)">${a.plan}</code></td>
      <td class="num"><code style="font-family:'Manrope',monospace;font-size:10.5px">${a.bud}</code></td>
      <td class="num"><code style="font-family:'Manrope',monospace;font-size:10.5px">${a.exp}</code></td>
      <td class="num"><code style="font-family:'Manrope',monospace;font-size:10.5px">${a.sub}</code></td>
      <td class="wrap"><b>${a.name}</b>${a.note ? `<div class="muted">${a.note}</div>` : ''}</td>
      <td class="num">${a.amount ? fmtM(a.amount) : '<span class="muted">—</span>'}</td>
      <td class="muted" style="font-size:10.5px">${a.from} – ${a.to === null ? 'ปัจจุบัน' : a.to}</td>
      <td>${b
        ? `<span class="chip ${b.c}">${b.l}</span>`
        : '<span class="flag flag-unc">ยังไม่มีกติกา</span>'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--text4);padding:26px">— ไม่พบบัญชีที่ตรงกับตัวกรอง —</td></tr>`;

  document.getElementById('cnt').textContent = `${rows.length} จาก ${ERP_ACCOUNTS.length} บัญชี`;
  document.querySelectorAll('#acc-tb tr[data-i]').forEach(tr => {
    tr.onclick = () => { sel = +tr.dataset.i; renderTable(); renderDetail(); };
  });
}

function renderDetail() {
  const a = ERP_ACCOUNTS[sel];
  const r = rulesOf(a)[0];
  const cur = r ? r.rules.find(v => year >= v.from && (v.to === null || year <= v.to)) : null;
  const retired = a.to !== null;

  document.getElementById('detail').innerHTML = `
    <div class="card-head"><div>
      <div class="card-title"><span class="dot" style="background:var(--navy2)"></span>${a.name}</div>
      <div class="card-sub"><code style="font-family:'Manrope',monospace">${keyOf(a)}</code></div>
    </div>${retired
      ? '<span class="st st-fail"><span class="st-dot"></span>ยกเลิกแล้ว</span>'
      : '<span class="st st-appr"><span class="st-dot"></span>ใช้งาน</span>'}</div>

    <div class="form-grid" style="margin-bottom:14px">
      <div class="field"><label>แผนงาน</label><input class="inp" value="${a.plan}"></div>
      <div class="field"><label>หมวดงบประมาณ</label><input class="inp" value="${a.bud}"></div>
      <div class="field"><label>หมวดรายจ่าย</label><input class="inp" value="${a.exp}"></div>
      <div class="field"><label>หมวดรายจ่ายย่อย</label><input class="inp" value="${a.sub}"></div>
    </div>
    <div class="field" style="margin-bottom:14px">
      <label>ชื่อบัญชี</label><input class="inp" value="${a.name}">
      <div class="hint">ทั้ง 4 รหัสรวมกันเป็น UNIQUE key คู่กับ <code style="font-family:'Manrope',monospace">valid_from</code>
        — แก้รหัสของบัญชีที่คำนวณไปแล้วไม่ได้</div>
    </div>
    <div class="form-grid" style="margin-bottom:14px">
      <div class="field"><label>เริ่มมีผล (ปีงบ)</label><input class="inp" value="${a.from}"></div>
      <div class="field"><label>สิ้นสุด (เว้นว่าง = ยังใช้อยู่)</label>
        <input class="inp" value="${a.to || ''}" placeholder="—"></div>
    </div>

    <div class="rule-row" style="border-top:1px solid var(--border);padding-top:12px">
      <div><div class="rule-name">กติกา TFC/TVC ในปีงบ ${year}</div>
        <div class="rule-desc">${cur
          ? (cur.note || 'ไม่มีหมายเหตุ') + ' · ปันส่วน' + METHOD[cur.m]
          : '<b style="color:var(--red)">ยังไม่มีกติกา</b> — เงินจะถูกพักไว้ที่หน่วยงานและติดธง UNCLASSIFIED'}</div></div>
      ${cur ? `<span class="chip ${BEH[cur.beh].c}">${BEH[cur.beh].l}</span>` : '<span class="flag flag-unc">ไม่มี</span>'}
    </div>
    <div class="rule-row">
      <div><div class="rule-name">จำนวนช่วงปีของกติกา</div>
        <div class="rule-desc">${r
          ? `บัญชีนี้มีกติกา ${r.rules.length} ช่วงปี — เปลี่ยนประเภทตามปีได้`
          : 'ยังไม่เคยตั้งกติกาให้บัญชีนี้'}</div></div>
      <span class="chip ${r ? 'chip-n' : 'chip-r'} num">${r ? r.rules.length : 0}</span>
    </div>

    <div class="toolbar" style="margin:16px 0 0;padding-top:14px;border-top:1px solid var(--border)">
      <button class="btn">💾 บันทึก</button>
      <a class="btn ${a.ruleKey ? '' : 'primary'}" href="W14-account-rules.html">
        ${a.ruleKey ? '⚖ ดูกติกาที่ W14' : '+ ตั้งกติกา TFC/TVC ที่ W14'}</a>
      ${retired
        ? '<button class="btn ok">▶ เปิดใช้อีกครั้ง</button>'
        : '<button class="btn danger">⏹ ยกเลิกบัญชี (ตั้ง valid_to)</button>'}
    </div>`;
}

function renderAllW19() { renderKPI(); renderTable(); renderDetail(); }

document.getElementById('f-year').onchange = e => { year = +e.target.value; renderAllW19(); };
document.querySelectorAll('#f-rule button').forEach(b => b.onclick = () => {
  fRule = b.dataset.f;
  document.querySelectorAll('#f-rule button').forEach(x => x.classList.toggle('on', x === b));
  renderTable();
});
document.getElementById('f-q').oninput = e => { fQ = e.target.value.trim().toLowerCase(); renderTable(); };

renderAllW19();


    },
  },

  'W8-tuition': {
    w: "W8",
    title: "ค่าธรรมเนียมการศึกษา",
    bm: false,
    run: true,
    shell: true,
    caveat: false,

"btn\">⬆ นำเข้าจาก Excel</button>\n    <button class=\"btn primary\">+ เพิ่มอัตราใหม่</button>\n  </div>\n\n  <div class=\"grid\" style=\"grid-template-columns:1.75fr 1fr\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n        <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ตารางอัตราค่าธรรมเนียม</div>\n        <div class=\"card-sub\">คลิกแถวเพื่อดูประวัติการเสนอและอนุมัติ · <span id=\"row-count\"></span></div>\n      </div>\n      <div style=\"max-height:560px;overflow:auto\">\n        <table class=\"tbl dense\">\n          <thead><tr>\n            <th>คณะ / หลักสูตร</th><th>ระดับ</th><th>ภาค · สัญชาติ</th>\n            <th class=\"num\">อัตรา (บ./ปี)</th><th class=\"num\">เทียบปีก่อน</th><th>สถานะ</th>\n          </tr></thead>\n          <tbody id=\"fee-tb\"></tbody>\n        </table>\n      </div>\n    </div>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div class=\"card\" id=\"detail\"></div>\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--gold2)\"></span>ประวัติการเสนอ / อนุมัติ</div>\n          <div class=\"card-sub\">ตาราง <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">fee_approval_log</code></div></div></div>\n        <div class=\"log\" id=\"fee-log\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>ทำไมหน้านี้ถึงต้องมี</h3>\n    <ul>\n      <li class=\"crit\"><b>prototype เดิมไม่มีหน้านี้</b> เพราะค่าธรรมเนียมถูก fix มาในไฟล์ Excel แล้ว ระบบจริงต้องมีที่ให้กรอกและอนุมัติ</li>\n      <li class=\"warn\">อัตราที่ยังไม่อนุมัติ <b>ห้ามเข้าไปในการคำนวณ</b> — ถ้าปล่อยผ่านจะได้ TR ที่ยังไม่มีใครรับรอง แล้วผู้บริหารเอาไปตัดสินใจ</li>\n      <li class=\"info\">คนที่เสนออัตราและคนที่อนุมัติ<b>ต้องเป็นคนละคน</b> ปุ่มอนุมัติจะถูกปิดถ้าผู้ใช้ปัจจุบันเป็นผู้เสนอเอง</li>\n     init: function () {



let sel = 0, fStatus = 'all', fQ = '';

function visible() {
  return FEES.map((f, i) => ({ ...f, i }))
    .filter(f => fStatus === 'all' || f.status === fStatus)
    .filter(f => !fQ || (f.fac + f.prog + f.lvl).toLowerCase().includes(fQ));
}

function renderTable() {
  const rows = visible();
  document.getElementById('fee-tb').innerHTML = rows.map(f => {
    const s = FEE_STATUS[f.status];
    const d = f.prev == null ? null : f.rate - f.prev;
    const delta = d === null ? '<span class="muted">ใหม่</span>'
      : d === 0 ? '<span class="muted">เท่าเดิม</span>'
      : `<span class="${d > 0 ? 'neg' : 'pos'}" style="font-weight:700">${d > 0 ? '+' : '−'}${fmtN(Math.abs(d))}</span>
         <span class="muted">(${d > 0 ? '+' : '−'}${(Math.abs(d) / f.prev * 100).toFixed(1)}%)</span>`;
    return `<tr data-i="${f.i}" class="${f.i === sel ? 'sel' : ''}" style="cursor:pointer">
      <td class="wrap"><b>${f.prog}</b><div class="muted">${f.fac}</div></td>
      <td class="muted">${f.lvl}</td>
      <td class="muted">${f.st}</td>
      <td class="num" style="font-weight:700">${fmtN(f.rate)}</td>
      <td class="num">${delta}</td>
      <td><span class="st ${s.c}"><span class="st-dot"></span>${s.l}</span></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--text4);padding:26px">— ไม่พบรายการที่ตรงกับตัวกรอง —</td></tr>`;

  document.getElementById('row-count').textContent = `แสดง ${rows.length} จาก ${FEES.length} รายการ`;
  document.querySelectorAll('#fee-tb tr[data-i]').forEach(tr => {
    tr.onclick = () => { sel = +tr.dataset.i; renderTable(); renderDetail(); };
  });
}

function renderDetail() {
  const f = FEES[sel], s = FEE_STATUS[f.status];
  const pending = f.status === 'PENDING_APPROVAL';
  document.getElementById('detail').innerHTML = `
    <div class="card-head"><div>
      <div class="card-title"><span class="dot" style="background:var(--navy2)"></span>${f.prog}</div>
      <div class="card-sub">${f.fac} · ${f.lvl} · ${f.st}</div>
    </div><span class="st ${s.c}"><span class="st-dot"></span>${s.l}</span></div>

    <div class="mini-stats" style="margin-bottom:14px">
      <div class="mini-stat"><div class="l">อัตราที่เสนอ</div>
        <div class="v" style="color:var(--navy)">${fmtN(f.rate)}</div><div class="s">บาท/ปี</div></div>
      <div class="mini-stat"><div class="l">อัตราปีก่อน</div>
        <div class="v" style="color:var(--text3)">${f.prev == null ? '—' : fmtN(f.prev)}</div>
        <div class="s">${f.prev == null ? 'หลักสูตรใหม่' : 'บาท/ปี'}</div></div>
    </div>

    <div class="rule-row" style="border-top:1px solid var(--border);padding-top:12px">
      <div><div class="rule-name">ช่วงปีที่มีผล</div>
        <div class="rule-desc">ปีการศึกษา 2568 เป็นต้นไป · ตัวเลขปี 2567 ไม่เปลี่ยนตาม</div></div>
      <span class="chip chip-n num">2568 →</span>
    </div>
    <div class="rule-row">
      <div><div class="rule-name">ผู้อนุมัติ</div>
        <div class="rule-desc">${f.by ? f.by + ' · ' + f.at : 'ยังไม่มีผู้อนุมัติ'}</div></div>
      <span class="chip ${f.by ? 'chip-g' : 'chip-o'}">${f.by ? 'ครบ' : 'รอ'}</span>
    </div>
    <div class="rule-row">
      <div><div class="rule-name">ผลต่อการคำนวณ</div>
        <div class="rule-desc">${f.status === 'APPROVED'
          ? 'ถูกนำไปคำนวณ TR ของหลักสูตรนี้ในรอบคำนวณถัดไป'
          : 'ยังไม่ถูกนำไปคำนวณ — หลักสูตรนี้จะติดธง NO_FEE'}</div></div>
      <span class="chip ${f.status === 'APPROVED' ? 'chip-g' : 'chip-r'}">${f.status === 'APPROVED' ? 'ใช้งาน' : 'ยังไม่ใช้'}</span>
    </div>

    <div class="toolbar" style="margin:16px 0 0;padding-top:14px;border-top:1px solid var(--border)">
      <button class="btn">✎ แก้ไขร่าง</button>
      <button class="btn ${pending ? '' : 'off'}" ${pending ? '' : 'disabled'}>📤 เสนออนุมัติ</button>
      <button class="btn ${pending ? 'ok' : 'off'}" ${pending ? '' : 'disabled'}
        title="${pending ? 'ผู้อนุมัติต้องไม่ใช่ผู้เสนอ' : 'ต้องอยู่ที่สถานะรออนุมัติก่อน'}">✓ อนุมัติ</button>
    </div>
    ${pending ? `<div class="sub-note" style="margin:10px 0 0;color:var(--gold)">
      ⚠ ผู้ใช้ปัจจุบันมีสิทธิ์ผู้อนุมัติ และไม่ใช่ผู้เสนอรายการนี้ จึงกดอนุมัติได้</div>` : ''}`;
}

function renderLog() {
  document.getElementById('fee-log').innerHTML = FEE_LOG.map(l =>
    `<div class="log-item"><div class="log-time">${l.t}</div>
       <div class="log-ic">${l.ic}</div><div class="log-body">${l.h}</div></div>`).join('');
}

/* KPI */
const cnt = s => FEES.filter(f => f.status === s).length;
document.getElementById('k-appr').textContent = fmtN(cnt('APPROVED'));
document.getElementById('k-pend').textContent = fmtN(cnt('PENDING_APPROVAL'));
document.getElementById('k-draft').textContent = fmtN(cnt('DRAFT'));

/* ตัวกรอง */
document.querySelectorAll('#f-status button').forEach(b => b.onclick = () => {
  fStatus = b.dataset.s;
  document.querySelectorAll('#f-status button').forEach(x => x.classList.toggle('on', x === b));
  renderTable();
});
document.getElementById('f-q').oninput = e => { fQ = e.target.value.trim().toLowerCase(); renderTable(); };

renderTable(); renderDetail(); renderLog();


    },
  },

ass=\"sub-note\" style=\"margin:12px 0 0\">\n          ระบบจะ<b>ตรวจก่อนบันทึกเสมอ</b> — ตรวจหัวคอลัมน์ ตรวจว่าหน่วยงานมีอยู่จริง\n          ตรวจว่ายอดรวมตรงกับหน้าสรุปของไฟล์ ถ้าไม่ผ่านจะไม่เขียนลงฐานข้อมูลแม้แต่แถวเดียว\n        </div>\n      </div>\n\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ประวัติการนำเข้า</div>\n          <div class=\"card-sub\">ตาราง <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">import_batch</code></div></div></div>\n        <div class=\"log\">\n          <div class=\"log-item\"><div class=\"log-time\">11 ก.ค. 2569<br>03:20</div><div class=\"log-ic\">✅</div>\n            <div class=\"log-body\">ซิงก์อัตโนมัติ — งบประมาณ 18,432 แถว · ค่าเสื่อมครุภัณฑ์ 9,841 แถว · <b>ผ่านการตรวจทั้งหมด</b></div></div>\n          <div class=\"log-item\"><div class=\"log-time\">20 พ.ค. 2569<br>11:47</div><div class=\"log-ic\">📄</div>\n            <div class=\"log-body\"><b>นายอัครินทร์ บุพผา</b> นำเข้าผังบัญชี 4 ระดับ 412 แถว จากไฟล์ <code style=\"font-family:'Manrope',monospace\">coa_2568.xlsx</code></div></div>\n          <div class=\"log-item\"><div class=\"log-time\">18 พ.ค. 2569<br>16:02</div><div class=\"log-ic\">❌</div>\n            <div class=\"log-body\">นำเข้าไม่สำเร็จ — พบหน่วยงาน 3 ชื่อที่ไม่ตรงกับทะเบียนหน่วยงาน <b>ไม่บันทึกทั้งไฟล์</b></div></div>\n          <div class=\"log-item\"><div class=\"log-time\">14 ส.ค. 2568<br>09:20</div><div class=\"log-ic\">📦</div>\n            <div class=\"log-body\">นำเข้าชุดข้อมูลปีงบ 2567 ครบทุกแหล่ง — ใช้เป็นฐานเทียบข้ามปี</div></div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>สิ่งที่เปลี่ยนจากแบบร่างเดิม</h3>\n    <ul>\n      <li class=\"info\">เดิม W9 รวมการตั้งค่า TFC/TVC ไว้ด้วย — <b>ย้ายไป W14</b> เพราะกติกาต้องมีช่วงปีที่มีผลและต้องอนุมัติ ไม่ใช่ช่องติ๊กในหน้านำเข้า</li>\n      <li class=\"info\">ปุ่ม \"คำนวณผลใหม่ทั้งระบบ\" <b>ย้ายไป W11     html: "<div class=\"page\">\n\n  <div class=\"bm-note\">\n    <span>ℹ️</span>\n    <span>กติกาผูกกับ <b>คีย์ผสม 4 ระดับ</b> (แผนงาน · หมวดงบ · หมวดรายจ่าย · หมวดย่อย) ไม่ใช่รหัสหมวดรายจ่ายอย่างเดียว\n      เพราะรหัสเดียวกันเป็นคนละประเภทได้เมื่ออยู่คนละแผนงาน — ดู <code style=\"font-family:'Manrope',monospace\">800:เงินอุดหนุน</code> สองแถวในตาราง\n      · ทุกกติกามี<b>ช่วงปีที่มีผล</b> เปลี่ยนปีใหม่แล้วตัวเลขปีเก่าไม่เปลี่ยนตาม</span>\n  </div>\n\n  <div class=\"kpis\">\n    <div class=\"kpi cn\"><div class=\"kpi-label\">ต้นทุนคงที่ (TFC)</div><div class=\"kpi-val num\" style=\"color:var(--navy2)\" id=\"k-f\">—</div><div class=\"kpi-unit\" id=\"k-f-s\">ล้านบาท</div></div>\n    <div class=\"kpi co\"><div class=\"kpi-label\">ต้นทุนผันแปร (TVC)</div><div class=\"kpi-val num\" style=\"color:var(--gold)\" id=\"k-v\">—</div><div class=\"kpi-unit\" id=\"k-v-s\">ล้านบาท</div></div>\n    <div class=\"kpi cg\"><div class=\"kpi-label\">กติกาที่มีผลในปีที่เลือก</div><div class=\"kpi-val num\" style=\"color:var(--green2)\" id=\"k-n\">—</div><div class=\"kpi-unit\">คีย์ผสม · จากผังบัญชี 412 รายการ</div></div>\n    <div class=\"kpi cr\"><div class=\"kpi-label\">ยังไม่จำแนก</div><div class=\"kpi-val num\" style=\"color:var(--red2)\" id=\"k-u\">—</div><div class=\"kpi-unit\" id=\"k-u-s\">รายการ</div></div>\n  </div>\n\n  <div class=\"toolbar\">\n    <span class=\"bm-lbl\">ปีการศึกษาที่ดู:</span>\n    <select class=\"inp\" style=\"width:auto\" id=\"f-year\">\n      <option>2568</option><option>2569</option><option>2570</option><option>2571</option><option>2572</option>\n    </select>\n    <div class=\"seg\" id=\"f-beh\">\n      <button class=\"on\" data-f=\"all\">ทั้งหมด</button>\n      <button data-f=\"MIXED\">แบ่งสัดส่วน</button>\n      <button data-f=\"UNCLASSIFIED\">ยังไม่จำแนก</button>\n    </div>\n    <span class=\"grow\"></span>\n    <button class=\"btn\">+ เพิ่มกติกา</button>\n  </div>\n\n  <div class=\"grid\" style=\"grid-template-columns:1.7fr 1fr\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n        <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>กติกาที่มีผลในปีการศึกษา <span class=\"num\" id=\"yr-lbl\">2568</span></div>\n        <div class=\"card-sub\">คลิกแถวเพื่อดูไทม์ไลน์รายปีของบัญชีเดียวกัน · <span id=\"cnt\"></span></div>\n      </div>\n      <div style=\"max-height:560px;overflow:auto\">\n        <table class=\"tbl dense\">\n          <thead><tr>\n            <th style=\"width:132px\">คีย์ผสม 4 ระดับ</th><th>ชื่อบัญชี</th>\n            <th class=\"num\" style=\"width:92px\">ยอด (ลบ.)</th>\n            <th style=\"width:110px\">ประเภท</th><th class=\"num\" style=\"width:80px\">F : V</th>\n            <th style=\"width:120px\">วิธีปันส่วน</th>\n          </tr></thead>\n          <tbody id=\"rule-tb\"></tbody>\n        </table>\n      </div>\n    </div>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div class=\"card\" id=\"detail\"></div>\n      <div class=\"card\" id=\"timeline\"></div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>จุดที่ถ้าตั้งผิดจะทำให้ตัวเลขทั้งระบบผิด</h3>\n    <ul>\n      <li class=\"crit\"><b>คีย์ผสม 4 ระดับ ไม่ใช่รหัสหมวดเดียว</b> — <code style=\"font-family:'Manrope',monospace\">80001 เงินอุดหนุน</code> ในแผนงานจัดการศึกษาเป็นคนละประเภทกับในแผนงานวิจัย ถ้าตั้งด้วยรหัสหมวดอย่างเดียวจะจำแนกผิดทั้งก้อน</li>\n      <li class=\"warn\"><b>กติกาเจาะจงหน่วยงานมาก่อนกติกากลางเสมอ</b> — ค่าวัสดุการศึกษาของคณะแพทยศาสตร์ตั้ง 15:85 ทับกติกากลาง 35:65</li>\n      <li class=\"warn\"><b>UNCLASSIFIED ไม่ใช่ค่าว่าง</b> — เป็นสถานะที่ตั้งใจ ระบบจะพักเงินไว้ที่หน่วยงานและติดธงไปที่ <a href=\"W13-exceptions.html\">รายการค้างตรวจ</a> ไม่เดาแทน</li>\n      <li class=\"info\"><b>ค่าเสื่อมราคาไม่มีรหัสผังบัญชี</b> จึงหากติกาปกติไม่เจอ — กำหนดผ่านค่าตั้ง <code style=\"font-family:'Manrope',monospace\">depreciation_behavior</code> ที่ <a href=\"W15-settings.html\">W15</a> แทน</li>\n      <li class=\"ok\">การแก้กติกาต้องผ่านการอนุมัติ และ run ที่คำนวณไปแล้วจะ<b>ล็อกเวอร์ชันกติกาไว้</b> คำนวณซ้ำได้ตัวเลขเดิมเป๊ะ</li>\n    </ul>\n  </div>\n\n</div>\n",
    init: function () {



let year = 2568, fBeh = 'all', sel = 0;

/* กติกาที่มีผลในปีที่เลือก */
const ruleAt = (a, y) => a.rules.find(r => y >= r.from && (r.to === null || y <= r.to)) || null;

function visible() {
  return ACCOUNTS.map((a, i) => ({ a, i, r: ruleAt(a, year) }))
    .filter(x => x.r)
    .filter(x => fBeh === 'all' || x.r.beh === fBeh);
}

function renderKPI() {
  document.getElementById('k-f').textContent = fmtM(RAW.UNI.TFC);

  document.getElementById('k-v').textContent = fmtM(RAW.UNI.TVC);
  document.getElementById('k-v-s').textContent = 'ล้านบาท · ' + (RAW.UNI.TVC / RAW.UNI.TC * 100).toFixed(1) + '% ของต้นทุนรวม';

  const withRule = ACCOUNTS.filter(a => ruleAt(a, year));
  const unc = withRule.filter(a => ruleAt(a, year).beh === 'UNCLASSIFIED');
  document.getElementById('k-n').textContent = fmtN(withRule.length);
  document.getElementById('k-u').textContent = fmtN(unc.length);
  document.getElementById('k-u-s').textContent =
    'รายการ · ' + fmtM(unc.reduce((s, a) => s + a.amount, 0)) + ' ลบ. พักไว้ที่หน่วยงาน';
}

 เสนออนุมัติการเปลี่ยนแปลง</button>\n        <button class=\"btn off\" id=\"btn-reset\" disabled>↺ ย้อนกลับ</button>\n        <span class=\"grow\"></span>\n        <span class=\"sub-note\" style=\"margin:0\" id=\"dirty\">ยังไม่มีการเปลี่ยนแปลง</span>\n      </div>\n    </div>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div class=\"card\" id=\"impact\"></div>\n\n      <div class=\"card\">\n        <div class=\"card-head\"><div>\n          <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--gold2)\"></span>ประวัติการเปลี่ยนค่าตั้ง</div>\n          <div class=\"card-sub\">ตอบได้ว่าตัวเลขปีไหนคำนวณด้วยกติกาใด</div></div></div>\n        <div class=\"log\" id=\"set-log\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>ทำไมค่าตั้งต้องมีเวอร์ชันรายปี</h3>\n    <ul>\n      <li class=\"crit\">ถ้าไม่มีหน้านี้ นโยบายจะกลับไป<b>ฝังในโค้ด</b> และ<b>เทียบตัวเลขข้ามปีไม่ได้</b> เพราะไม่รู้ว่าแต่ละปีคำนวณด้วยกติกาใด</li>\n      <li class=\"warn\">ค่าที่ติดป้าย <b>กระทบตัวเลข</b> เปลี่ยนแล้วต้องสร้างรอบคำนวณใหม่ที่ <a href=\"W11-allocation-run.html\">W11</a> — ตัวเลขเก่าจะไม่เปลี่ยนตามเอง</li>\n      <li class=\"info\"><code style=\"font-family:'Manrope',monospace\">qstar_primary_method</code> ต่างกันถึง <b>5,441 คน</b> ในระดับมหาวิทยาลัย — ไม่ใช่รายละเอียดปลีกย่อย แต่เป็นเรื่องที่ต้องมีมติ</li>\n      <li class=\"ok\">ระบบ<b>คำนวณเก็บไว้ทั้ง 2 วิธีเสมอ</b> ค่าตั้งนี้เลือกแค่ว่าตัวไหนเป็นตัวหลักในรายงาน จึงสลับได้โดยไม่ต้องคำนวณใหม่</li>\n    </ul>\n  </div>\n\n</div>\n",
    init: function () {



const draft = {};                                   // key → ค่าที่แก้แต่ยังไม่เสนออนุมัติ
const valOf = s => draft[s.key] ?? s.cur ?? s.def;  // ค่าที่ใช้อยู่จริง
let sel = SETTINGS[0].key, fGrp = 'all';

function renderList() {
  const groups = ['calculation', 'allocation', 'presentation']
    .filter(g => fGrp === 'all' || fGrp === g);

  document.getElementById('set-list').innerHTML = groups.map(g => {
    const items = SETTINGS.filter(s => s.grp === g);
    if (!items.length) return '';
    return `<div class="hub-grp" style="margin:14px 0 6px">${GRP_LABEL[g]}</div>` + items.map(s => {
      const v = valOf(s);
      const dirty = draft[s.key] !== undefined && draft[s.key] !== (s.cur ?? s.def);
      const ctrl = s.type === 'enum'
        ? `<select class="inp" style="width:auto;min-width:190px" data-k="${s.key}">
             ${s.opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`
        : `<input class="inp" style="width:110px;text-align:right" data-k="${s.key}" value="${v}">`;
      return `<div class="rule-row ${s.key === sel ? '' : ''}" data-sel="${s.key}"
          style="cursor:pointer;${s.key === sel ? 'background:var(--navy4);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px' : ''}">
        <div>
          <div class="rule-name">${s.name}
            <span class="rule-key">${s.key}</span>
            ${s.affects ? '<span class="chip chip-o" style="margin-left:6px">⚡ กระทบตัวเลข</span>' : ''}
            ${dirty ? '<span class="chip chip-g" style="margin-left:6px">แก้แล้ว</span>' : ''}</div>
          <div class="rule-desc">${s.desc}</div>
          <div class="rule-desc" style="margin-top:5px">
            ${s.cur == null
              ? `<span class="muted">ยังไม่ตั้งทับ · ใช้ค่าเริ่มต้น <b class="num" style="color:var(--navy)">${s.def}</b></span>`
              : `<span class="diff"><span class="from">${s.def}</span> → <span class="to">${s.cur}</span></span>`}
            ${dirty ? `<span class="diff" style="margin-left:10px">แก้เป็น <span class="to">${draft[s.key]}</span></span>` : ''}
          </div>
        </div>
        <div onclick="event.stopPropagation()">${ctrl}</div>
      </div>`;
    }).join('');
  }).join('');

  document.querySelectorAll('[data-sel]').forEach(r => r.onclick = () => { sel = r.dataset.sel; renderList(); renderImpact(); });
  document.querySelectorAll('#set-list [data-k]').forEach(inp => {
    inp.onchange = () => {
      const s = SETTINGS.find(x => x.key === inp.dataset.k);
      draft[s.key] = inp.value;
      sel = s.key;
      renderList(); renderImpact(); renderDirty();
    };
  });
}

function renderImpact() {
  const s = SETTINGS.find(x => x.key === sel);
  const v = valOf(s);
  const rows = s.type === 'enum'
    ? s.opts.map(o => [o, s.impact[o]])
    : [[v, s.impact['*']]];

  document.getElementById('impact').innerHTML = `
    <div class="card-head"><div>
      <div class="card-title"><span class="dot" style="background:var(--gold2)"></span>ผลกระทบถ้าเปลี่ยนค่านี้</div>
      <div class="card-sub">${s.name} · ประเมินจากข้อมูลปีการศึกษา 2568 · 230 หลักสูตร</div></div>
      ${s.affects ? '<span class="chip chip-o">⚡ ต้องคำนวณใหม่</span>' : '<span class="chip chip-g">ไม่ต้องคำนวณใหม่</span>'}</div>

          border-radius:9px;padding:11px 14px;margin-bottom:9px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
          <code style="font-family:'Manrope',monospace;font-size:11px;font-weight:700;color:var(--navy)">${o}</code>
          ${o === v ? '<span class="st st-appr" style="font-size:9px">ค่าที่ใช้อยู่</span>' : ''}
        </div>
        <div style="font-size:11.5px;color:var(--text2);line-height:1.7">${txt}</div>
      </div>`).join('')}
    ${s.affects ? `<div class="sub-note" style="margin:4px 0 0;color:var(--gold)">
      ⚡ เปลี่ยนค่านี้แล้ว ตัวเลขในหน้า W1–W5 <b>จะยังไม่เปลี่ยน</b> จนกว่าจะสร้างและอนุมัติรอบคำนวณใหม่ที่
      <a href="W11-allocation-run.html" style="color:var(--gold);font-weight:700">W11</a></div>` : ''}`;
}

function renderDirty() {
  const n = Object.keys(draft).filter(k => {
    const s = SETTINGS.find(x => x.key === k);
    return draft[k] !== (s.cur ?? s.def);
  }).length;
  const d = document.getElementById('dirty');
  const bs = document.getElementById('btn-submit'), br = document.getElementById('btn-reset');
  if (n) {
    d.innerHTML = `<b style="color:var(--navy2)">แก้ไข ${n} ค่า</b> — ยังไม่มีผลจนกว่าจะผ่านการอนุมัติ`;
    bs.classList.remove('off'); bs.disabled = false;
    br.classList.remove('off'); br.disabled = false;
  } else {
    d.textContent = 'ยังไม่มีการเปลี่ยนแปลง';
    bs.classList.add('off'); bs.disabled = true;
    br.classList.add('off'); br.disabled = true;
  }
}

document.getElementById('btn-reset').onclick = () => {
  Object.keys(draft).forEach(k => delete draft[k]);
  renderList(); renderImpact(); renderDirty();
};

document.querySelectorAll('#f-grp button').forEach(b => b.onclick = () => {
  fGrp = b.dataset.g;
  document.querySelectorAll('#f-grp button').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});

document.getElementById('set-log').innerHTML = SETTING_LOG.map(l =>
  `<div class="log-item"><div class="log-time">${l.t}</div>
     <div class="log-ic">${l.ic}</div><div class="log-body">${l.h}</div></div>`).join('');

renderList(); renderImpact(); renderDirty();

  },

าจอ</b> — <code style=\"font-family:'Manrope',monospace\">faculty_officer</code> ที่ผูกกับคณะวิศวฯ ต้องดึงข้อมูลคณะอื่นไม่ได้แม้จะแก้ URL เอง</li>\n      <li class=\"warn\"><b>เปลี่ยนสิทธิ์ไม่ย้อนหลัง</b> — รายการที่เคยอนุมัติไปแล้วยังคงชื่อผู้อนุมัติเดิม แม้คนนั้นจะถูกถอนสิทธิ์ภายหลัง</li>\n      <li class=\"info\"><b>ระบบไม่เก็บรหัสผ่านเอง</b> — ยืนยันตัวตนผ่าน MSU Account (SSO) ตารางนี้เก็บแค่บทบาทและขอบเขต</li>\n      <li class=\"ok\"><b>บัญชีที่ไม่เข้าใช้เกิน 180 วันถูกระงับอัตโนมัติ</b> — ปลดล็อกได้โดยผู้ดูแลระบบ ไม่ลบทิ้งเพราะยังต้องอ้างในประวัติการอนุมัติ</li>\n    </ul>\n  </div>\n\n</div>\n",

    ${runBar}${bmBar}
    <a class="tb-user" href="#W0-login" title="กดเพื่อไปหน้าเข้าสู่ระบบ (W0)">
      <span class="tb-avatar">ผ</span>
      <span><b>ผศ.ดร.ปิยภัทร บุษบาบดินทร์</b><br><span class="tb-role">ผู้ดูข้อมูล · เปลี่ยนผู้ใช้</span></span>
    </a>
  </div>`;
}

/* ---------- router ---------- */
let current = null;

function show(key) {
  const s = SCREENS[key] || SCREENS[KEYS[0]];
  key = SCREENS[key] ? key : KEYS[0];

  /* ล้างกราฟของหน้าเดิม ไม่งั้น Chart.js จะอ้าง canvas ที่ถูกถอดออกไปแล้ว */
  Object.keys(charts).forEach(id => {
    try { charts[id].destroy(); } catch (e) {}
    delete charts[id];
  });

  document.body.classList.toggle('full-page', !s.shell);

  /* sidebar สร้างใหม่เมื่อเปลี่ยนหน้า เพื่ออัปเดตเมนูที่ active */
  const old = document.getElementById('sidebar');
  if (old) old.remove();
  if (s.shell) document.body.insertAdjacentHTML('afterbegin', sidebarHtml(key));

  HOST.innerHTML = '';
  const bar = document.getElementById('topbar');
  if (bar) bar.remove();
  if (s.shell) MAIN.insertAdjacentHTML('afterbegin', topbarHtml(s));

  HOST.innerHTML = s.html;
  if (s.caveat) {
    const pg = HOST.querySelector('.page');
    if (pg) pg.insertAdjacentHTML('afterbegin', dataCaveat());
  }
  if (RAW.__sample && s.shell) {
    const pg = HOST.querySelector('.page');
    if (pg) pg.insertAdjacentHTML('afterbegin', sampleBanner());
  }

  window.renderPage = null;
  try {
    s.init();
  } catch (e) {
    console.error('หน้า ' + key + ' ทำงานผิดพลาด:', e);
  }

  /* ปุ่มสลับฐานรายได้ต้องผูกใหม่ทุกครั้งเพราะ topbar ถูกสร้างใหม่ */
  document.querySelectorAll('.bm-opt[data-bm]').forEach(b => {
    b.onclick = () => {
      BM = b.dataset.bm;
      show(key);
    };
  });
  document.querySelectorAll('.sb-group').forEach(g => {
    g.onclick = () => g.parentElement.classList.toggle('open');
  });
  refreshTopbar();

  current = key;
  document.title = 'MSU-BEPS · ' + (s.w ? s.w + ' ' : '') + s.title;
  window.scrollTo(0, 0);
}

addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || KEYS[0]);
</script>
