/* ── page-scenario-faculty.js ── */
/* ==========================================================================
   MSU-BEPS — W6 คำนวณจุดคุ้มทุนรายคณะ (Scenario)
   ยกมาจาก prototype v8-1 โดยไม่แก้สูตร · ต้องโหลดหลัง core.js
   ========================================================================== */

/* ============ SELF-CALC (รายคณะ / รายหลักสูตร) + PDF ============ */
const MM=(v,d=2)=>(Number(v)/1e6).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const CEILq=x=>Math.ceil(x-1e-9);
const modeLbl=()=>BM==='in'?'รวมเงินแผ่นดิน':'ไม่รวมเงินแผ่นดิน';
const FAC_DATA=(()=>{const o={};RAW.FACS.forEach(f=>{o[f.name]={Q:f.Q,TR:f.TR,TFC:f.TFC,TVC:f.TVC,TC:f.TC,st:f.st,own:f.own,Rin:f.Rin,Rex:f.Rex,AVC:f.AVC,Qin:f.Qin,Qex:f.Qex};});return o;})();
const PG_DATA=(()=>{const m={};RAW.PROGS.forEach(p=>{if(!m[p.fac])m[p.fac]={faculty:p.fac,programs:[]};m[p.fac].programs.push({program:p.prog,level:p.lvl,degree:p.deg,Q:p.Q,TR:p.TR,TFC:p.TFC,TVC:p.TVC,TC:p.TC,st:p.st,own:p.own,Rin:p.Rin,Rex:p.Rex,AVC:p.AVC,Qin:p.Qin,Qex:p.Qex});});return Object.values(m);})();
const TFC_PRESETS=['100:เงินเดือน','210:ค่าจ้างประจำ','220:ค่าจ้างชั่วคราว','230:ค่าตอบแทนพนักงานราชการ','300:ค่าตอบแทน','400:ค่าใช้สอย','500:ค่าวัสดุ','600:ค่าครุภัณฑ์','800:เงินอุดหนุน','900:รายจ่ายอื่น','ค่าเสื่อมราคา'];
const TVC_PRESETS=['300:ค่าตอบแทน','400:ค่าใช้สอย','410:ค่าสาธารณูปโภค','500:ค่าวัสดุ','600:ค่าครุภัณฑ์','800:เงินอุดหนุน','900:รายจ่ายอื่น','ค่าธรรมเนียมศึกษาทั่วไป','ค่าธรรมเนียมรายการหลัก (รายหัวนิสิต)','หักสมทบมหาวิทยาลัย (รายหัวนิสิต)'];
let inpList=[],_lastInp=null,pgHist=[],pgChart=null;

function initInpFac(){
  const sel=document.getElementById('inp-fac-sel');if(!sel||sel.options.length>1)return;
  RAW.FACS.forEach(f=>{const o=document.createElement('option');o.value=f.name;o.textContent=f.name;sel.appendChild(o);});
  sel.onchange=onInpFacChange;
  ['inp-q','inp-st','inp-own'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('input',updatePre);});
}
function onInpFacChange(){
  const v=document.getElementById('inp-fac-sel').value, badge=document.getElementById('inp-fac-badge');
  const setV=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val;};
  if(!v||!FAC_DATA[v]){badge.style.display='none';return;}
  const d=FAC_DATA[v];
  setV('inp-q',d.Q);setV('inp-st',Math.round(d.st));setV('inp-own',Math.round(d.own));setV('inp-tr',Math.round(d.TR));setV('inp-name',v);
  const t=document.getElementById('tfc-items');t.innerHTML='';addRow('tfc-items','TFC','ต้นทุนคงที่รวม (TFC)',Math.round(d.TFC));
  const c=document.getElementById('tvc-items');c.innerHTML='';addRow('tvc-items','TVC','ต้นทุนผันแปรรวม (TVC)',Math.round(d.TVC));
  badge.style.display='';
  badge.innerHTML=`✓ ดึงจากระบบ — Q = ${fmtN(d.Q)} คน · แผ่นดิน ${fmtB(d.st)} + รายได้ ${fmtB(d.own)} = TR ${fmtB(d.TR)} บ. · TFC ${fmtB(d.TFC)} · TVC ${fmtB(d.TVC)} บ. | <b>Q* ระบบ:</b> รวมแผ่นดิน ${d.Qin?fmtN(d.Qin):'—'} คน · ไม่รวม ${d.Qex?fmtN(d.Qex)+' คน':'ไม่มี (CM≤0)'}`;
  updateSums();
}
function buildCostOpts(type,sel){
  const presets=type==='TFC'?TFC_PRESETS:TVC_PRESETS;
  let o='<option value="">-- เลือกรายการ --</option>';
  presets.forEach(l=>{o+=`<option value="${l}" ${l===sel?'selected':''}>${l}</option>`;});
  o+='<option value="__custom__">— กรอกเอง —</option>';return o;
}
function onCostSelChange(sel){
  const row=sel.closest('.cost-row');if(!row)return;
  const custom=row.querySelector('.cost-custom');
  if(sel.value==='__custom__'){custom.style.display='';custom.focus();}else{custom.style.display='none';}
  updateSums();
}
function addRow(containerId,type,label='',val=''){
  const d=document.createElement('div');d.className='cost-row';
  d.innerHTML=`<select class="cost-sel" onchange="onCostSelChange(this)">${buildCostOpts(type,label)}</select>
    <input type="text" class="cost-custom" placeholder="ชื่อรายการ (กรอกเอง)" oninput="updateSums()">
    <input type="number" value="${val||''}" placeholder="0" class="cost-amt" oninput="updateSums()">
    <button class="btn-del" onclick="this.closest('.cost-row').remove();updateSums()" title="ลบ">×</button>`;
  document.getElementById(containerId).appendChild(d);updateSums();
}
function getSum(id){let s=0;document.querySelectorAll('#'+id+' input[type=number]').forEach(i=>s+=parseFloat(i.value)||0);return s;}
function updateSums(){
  const ts=getSum('tfc-items'),vs=getSum('tvc-items');
  const a=document.getElementById('tfc-sum'),b=document.getElementById('tvc-sum');
  if(a)a.textContent=fmtB(ts);if(b)b.textContent=fmtB(vs);updatePre();
}
function updatePre(){
  const num=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const Q=num('inp-q'),ST=num('inp-st'),OWN=num('inp-own'),TR=ST+OWN;
  const trH=document.getElementById('inp-tr');if(trH)trH.value=TR;
  const TFC=getSum('tfc-items'),TVC=getSum('tvc-items'),TC=TFC+TVC,AVC=Q>0?TVC/Q:0;
  const f=v=>v>0?fmtB(v):'—',set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('pre-q',Q>0?fmtN(Q):'—');set('pre-tr',f(TR));set('pre-tc',f(TC));set('pre-tfc',f(TFC));set('pre-tvc',f(TVC));
  set('pre-avc',f(AVC));set('pre-rin',f(Q>0?TR/Q:0));set('pre-rex',f(Q>0?OWN/Q:0));
}
function calcInp(){
  const num=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const name=document.getElementById('inp-fac-sel').value||document.getElementById('inp-name').value||'ไม่ระบุชื่อ';
  const Q=num('inp-q'),ST=num('inp-st'),OWN=num('inp-own'),TR=ST+OWN;
  const TFC=getSum('tfc-items'),TVC=getSum('tvc-items'),TC=TFC+TVC,AVC=Q>0?TVC/Q:0;
  if(Q<=0||TR<=0||TC<=0){document.getElementById('inp-result').innerHTML='<div class="ins" style="margin:0;border-left-color:var(--gold2)"><b>⚠ กรุณากรอก จำนวนนิสิต, งบประมาณ และต้นทุน ให้ครบก่อนคำนวณ</b></div>';document.getElementById('btn-save').style.display='none';return;}
  const calc=rev=>{const R=Q>0?rev/Q:0,CM=R-AVC;const Qs=CM>0?CEILq(TFC/CM):(R>0?CEILq(TC/R):null);return {R,CM,Qs,full:CM<=0,profit:rev-TC,isOk:Qs?Q>=Qs:false};};
  const A=calc(TR),B=calc(OWN);
  _lastInp={name,Q,ST,OWN,TR,TFC,TVC,TC,AVC,A,B};
  const box=(t,c,m)=>`<div style="border:1.5px solid ${c};border-radius:10px;padding:12px 14px;background:${m.isOk?'var(--green3)':'var(--red3)'}">
    <div style="font-size:10px;font-weight:800;color:${c};text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px">${t}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11.5px">
      <div>R/หัว: <b>${fmtB(m.R)}</b></div><div>CM/หัว: <b style="color:${m.CM>0?'var(--green)':'var(--red)'}">${fmtB(m.CM)}</b></div>
      <div>Q*: <b style="color:var(--red)">${m.Qs?fmtN(m.Qs)+' คน':'—'}</b>${m.full?' <span style="font-size:8px;font-weight:800;padding:1px 4px;border-radius:6px;background:var(--gold4);color:var(--gold)">TC/R</span>':''}</div>
      <div>ส่วนเกิน: <b style="color:${m.profit>=0?'var(--green)':'var(--red)'}">${m.profit>=0?'+':'−'}${MM(Math.abs(m.profit),2)} ล.</b></div></div>
    <div style="margin-top:8px;font-size:11px;font-weight:700;color:${m.isOk?'var(--green)':'var(--red)'}">${!m.Qs?'⚠ คำนวณไม่ได้':(m.full?'⚠ CM≤0 · ใช้ TC/R · ':'')+(m.isOk?'✓ เกินจุดคุ้มทุน +'+fmtN(Q-m.Qs)+' คน':'⚠ ขาดอีก '+fmtN(m.Qs-Q)+' คน')}</div></div>`;
  document.getElementById('inp-result').innerHTML=`<div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px">${name}</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:11px">นิสิต ${fmtN(Q)} คน · TFC ${MM(TFC,2)} ล. · TVC ${MM(TVC,2)} ล. · AVC ${fmtB(AVC)} บ./คน</div>
    <div style="display:flex;flex-direction:column;gap:9px">${box('กรณีรวมเงินแผ่นดิน','var(--navy2)',A)}${box('กรณีไม่รวมเงินแผ่นดิน','var(--gold)',B)}</div>`;
  document.getElementById('btn-save').style.display='block';
}
function saveInp(){if(!_lastInp)return;inpList.push({..._lastInp});renderInpList();}
function renderInpList(){
  const el=document.getElementById('inp-saved');if(!el)return;
  if(!inpList.length){el.innerHTML='<div style="padding:16px;text-align:center;color:var(--text4);font-size:12px">ยังไม่มีรายการ</div>';return;}
  el.innerHTML='<div style="overflow-x:auto"><table class="tbl" style="min-width:720px"><thead><tr><th>#</th><th>ชื่อ</th><th class="num">Q</th><th class="num">TFC(ล.)</th><th class="num">AVC/หัว</th><th class="num">Q* รวมแผ่นดิน</th><th class="num">Q* ไม่รวม</th><th class="num">สถานะ</th></tr></thead><tbody>'
    +inpList.map((f,i)=>{const A=f.A||{},B=f.B||{},okA=A.Qs&&f.Q>=A.Qs,okB=B.Qs&&f.Q>=B.Qs;
      return `<tr><td>${i+1}</td><td style="font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.name}">${f.name}</td><td class="num">${fmtN(f.Q)}</td><td class="num">${MM(f.TFC,2)}</td><td class="num" style="color:var(--gold)">${fmtB(f.AVC)}</td><td class="num ${okA?'pos':'neg'}">${A.Qs?fmtN(A.Qs):'—'}</td><td class="num ${okB?'pos':'neg'}">${B.Qs?fmtN(B.Qs):'—'}</td><td style="text-align:right"><span class="st-badge ${okA?'st-ok':'st-loss'}" style="display:inline-block">${okA?'✓ คุ้ม':'⚠ ไม่คุ้ม'}</span></td></tr>`;}).join('')
    +'</tbody></table></div>';
}
// ---- program self-calc ----
/* ---- เริ่มทำงาน ---- */
window.renderPage = ()=>{updatePre();renderInpList();};
initInpFac();
renderInpList();
updatePre();

      try { window.addRow = addRow; } catch (e) {}
      try { window.calcInp = calcInp; } catch (e) {}
      try { window.saveInp = saveInp; } catch (e) {}
    },
  },

  'W7-scenario-program': {
    w: "W7",
    title: "คำนวณจุดคุ้มทุนรายหลักสูตร",

ange()\"><option value=\"\">-- เลือกหลักสูตร --</option></select></div>\n        <div id=\"pg-new-name-wrap\" style=\"display:none\"><label class=\"inp-label\">✎ ชื่อหลักสูตร (กรอกเอง)</label><input id=\"pg-name-new\" class=\"inp\" type=\"text\" placeholder=\"เช่น วิทยาการปัญญาประดิษฐ์\"></div>\n        <div id=\"pg-new-fac-wrap\" style=\"display:none\"><label class=\"inp-label\">🏫 สังกัดคณะ (กรอกเอง)</label><input id=\"pg-fac-new\" class=\"inp\" type=\"text\" placeholder=\"เช่น คณะวิทยาศาสตร์\"></div>\n      </div>\n      <div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px\">\n        <div style=\"font-size:10px;font-weight:700;color:var(--navy2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px\">📊 ข้อมูลตัวเลข <span id=\"pg-autofill-badge\" style=\"display:none;font-size:9px;padding:2px 8px;border-radius:12px;background:var(--green3);color:var(--green);margin-left:8px;font-weight:700\">✓ ดึงจากระบบ</span></div>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:10px\">\n          <div><label class=\"inp-label\">จำนวนนิสิต (Q)</label><input id=\"pg-q\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n          <div><label class=\"inp-label\">งบเงินแผ่นดิน</label><input id=\"pg-st\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n          <div><label class=\"inp-label\">งบเงินรายได้</label><input id=\"pg-own\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n          <div><label class=\"inp-label\">TFC รวม</label><input id=\"pg-tfc\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n          <div><label class=\"inp-label\">TVC รวม</label><input id=\"pg-tvc\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n        </div>\n        <input id=\"pg-tr\" type=\"hidden\" value=\"\">\n        <div id=\"pg-ref-note\" style=\"display:none;margin-top:10px;font-size:11px;color:var(--text3);background:#fff;padding:8px 12px;border-radius:8px;border:1px solid var(--border);line-height:1.8\"></div>\n      </div>\n      <button class=\"btn-primary\" onclick=\"calcPg()\" style=\"max-width:240px\">▶ คำนวณจุดคุ้มทุน</button>\n    </div>\n    <div id=\"pg-result\" style=\"display:none\">\n      <div class=\"g2\" style=\"margin-bottom:16px\">\n        <div class=\"card\" id=\"pg-result-card\"></div>\n        <div class=\"card\">\n          <div class=\"card-head\"><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>กราฟจุดคุ้มทุน</div></div>\n          <div class=\"leg-row\"><div class=\"leg\"><span class=\"leg-sq\" style=\"background:#6d4cff\"></span>TR</div><div class=\"leg\"><span class=\"leg-sq\" style=\"background:#ff4c51\"></span>TC</div><div class=\"leg\"><span class=\"leg-sq\" style=\"background:#ffb400\"></span>TFC</div></div>\n          <div class=\"ch\" style=\"height:280px\"><canvas id=\"pg-chart\"></canvas></div>\n        </div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-head\"><div class=\"card-title\"><span class=\"dot\" style=\"background:#ffb400\"></span>ประวัติการคำนวณ</div><button onclick=\"pgHist=[];renderPgHist()\" style=\"font-size:10px;padding:4px 12px;border:1px solid var(--red3);background:var(--red3);color:var(--red2);border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600\">ล้าง</button></div>\n        <div id=\"pg-hist-body\"></div>\n      </div>\n    </div>\n  </div>\n<!-- PDF Overlay -->\n  <div id=\"pdf-overlay\" onclick=\"if(event.target===this)closePdfReport()\">\n    <button onclick=\"closePdfReport()\" style=\"position:fixed;top:16px;right:24px;z-index:10002;background:rgba(255,255,255,.9);color:#334155;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);font-weight:700\" title=\"ปิด\">×</button>\n    <div id=\"pdf-report\"></div>\n    <div style=\"position:fixed;bottom:24px;right:24px;z-index:10001;display:flex;gap:10px\">\n      <button class=\"pdf-print-btn\" id=\"btn-dl-pdf\" onclick=\"downloadReport()\" style=\"background:#56ca00\">⬇ ดาวน์โหลด PDF</button>\n      <button class=\"pdf-print-btn\" onclick=\"printPdfReport()\" style=\"background:#6d4cff\">🖨 พิมพ์ / บันทึก PDF</button>\n      <button class=\"pdf-print-btn\" onclick=\"closePdfReport()\" style=\"background:#6f6880;padding:11px 18px;box-shadow:none\">× ปิด</button>\n    </div>\n  </div>",

/* ── page-scenario-program.js ── */
/* ==========================================================================
   MSU-BEPS — W7 คำนวณจุดคุ้มทุนรายหลักสูตร (Scenario) + รายงาน PDF

/* ============ SELF-CALC (รายคณะ / รายหลักสูตร) + PDF ============ */
const MM=(v,d=2)=>(Number(v)/1e6).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const CEILq=x=>Math.ceil(x-1e-9);
const modeLbl=()=>BM==='in'?'รวมเงินแผ่นดิน':'ไม่รวมเงินแผ่นดิน';
const FAC_DATA=(()=>{const o={};RAW.FACS.forEach(f=>{o[f.name]={Q:f.Q,TR:f.TR,TFC:f.TFC,TVC:f.TVC,TC:f.TC,st:f.st,own:f.own,Rin:f.Rin,Rex:f.Rex,AVC:f.AVC,Qin:f.Qin,Qex:f.Qex};});return o;})();
const PG_DATA=(()=>{const m={};RAW.PROGS.forEach(p=>{if(!m[p.fac])m[p.fac]={faculty:p.fac,programs:[]};m[p.fac].programs.push({program:p.prog,level:p.lvl,degree:p.deg,Q:p.Q,TR:p.TR,TFC:p.TFC,TVC:p.TVC,TC:p.TC,st:p.st,own:p.own,Rin:p.Rin,Rex:p.Rex,AVC:p.AVC,Qin:p.Qin,Qex:p.Qex});});return Object.values(m);})();
const TFC_PRESETS=['100:เงินเดือน','210:ค่าจ้างประจำ','220:ค่าจ้างชั่วคราว','230:ค่าตอบแทนพนักงานราชการ','300:ค่าตอบแทน','400:ค่าใช้สอย','500:ค่าวัสดุ','600:ค่าครุภัณฑ์','800:เงินอุดหนุน','900:รายจ่ายอื่น','ค่าเสื่อมราคา'];
const TVC_PRESETS=['300:ค่าตอบแทน','400:ค่าใช้สอย','410:ค่าสาธารณูปโภค','500:ค่าวัสดุ','600:ค่าครุภัณฑ์','800:เงินอุดหนุน','900:รายจ่ายอื่น','ค่าธรรมเนียมศึกษาทั่วไป','ค่าธรรมเนียมรายการหลัก (รายหัวนิสิต)','หักสมทบมหาวิทยาลัย (รายหัวนิสิต)'];
let inpList=[],_lastInp=null,pgHist=[],pgChart=null;

let _pgInit=false;
function initPgDropdowns(){if(_pgInit)return;_pgInit=true;const fs=document.getElementById('pg-fac');if(!fs)return;PG_DATA.forEach(g=>{const o=document.createElement('option');o.value=g.faculty;o.textContent=g.faculty;fs.appendChild(o);});}
function onPgTypeChange(){
  initPgDropdowns();const isNew=document.getElementById('pg-type').value==='new';
  document.getElementById('pg-old-fac-wrap').style.display=isNew?'none':'';
  document.getElementById('pg-old-prog-wrap').style.display=isNew?'none':'';
  document.getElementById('pg-new-name-wrap').style.display=isNew?'':'none';
  document.getElementById('pg-new-fac-wrap').style.display=isNew?'':'none';
  ['pg-q','pg-st','pg-own','pg-tfc','pg-tvc','pg-tr'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('pg-autofill-badge').style.display='none';
  document.getElementById('pg-ref-note').style.display='none';
  if(!isNew){document.getElementById('pg-fac').value='';document.getElementById('pg-name-sel').innerHTML='<option value="">-- เลือกหลักสูตร --</option>';}
}
function onFacChange(){
  initPgDropdowns();const fv=document.getElementById('pg-fac').value,ps=document.getElementById('pg-name-sel');
  ps.innerHTML='<option value="">-- เลือกหลักสูตร --</option>';
  ['pg-q','pg-st','pg-own','pg-tfc','pg-tvc','pg-tr'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('pg-autofill-badge').style.display='none';document.getElementById('pg-ref-note').style.display='none';
  if(!fv)return;const g=PG_DATA.find(x=>x.faculty===fv);if(!g)return;
  g.programs.forEach(p=>{const o=document.createElement('option');o.value=p.program;o.textContent=p.program+' ('+p.level+')';ps.appendChild(o);});
}
function onProgChange(){
  const fv=document.getElementById('pg-fac').value,pv=document.getElementById('pg-name-sel').value;
  if(!fv||!pv)return;const g=PG_DATA.find(x=>x.faculty===fv);if(!g)return;const p=g.programs.find(x=>x.program===pv);if(!p)return;
  const lvlSel=document.getElementById('pg-level');for(let o of lvlSel.options){if(o.value===p.level){o.selected=true;break;}}
  const setV=(id,v)=>{document.getElementById(id).value=v;};
  setV('pg-q',p.Q);setV('pg-st',Math.round(p.st));setV('pg-own',Math.round(p.own));setV('pg-tr',Math.round(p.TR));setV('pg-tfc',Math.round(p.TFC));setV('pg-tvc',Math.round(p.TVC));
  document.getElementById('pg-autofill-badge').style.display='';
  const note=document.getElementById('pg-ref-note');
  if(p.Q>0){const cmIn=p.Rin-p.AVC,cmEx=p.Rex-p.AVC;note.style.display='';
    note.innerHTML=`<b style="color:var(--navy2)">${p.program}</b> · ${p.level} · ${fv}<br>AVC = <b>${fmtB(p.AVC)}</b> บ./คน | นิสิตจริง <b>${fmtN(p.Q)}</b> คน<br>
      <span style="color:var(--navy2)">● รวมแผ่นดิน:</span> R=<b>${fmtB(p.Rin)}</b> · CM=<b>${fmtB(cmIn)}</b> · <b>Q*=${p.Qin?fmtN(p.Qin)+' คน':'—'}</b> ${p.Qin?(p.Q>=p.Qin?'<span style="color:var(--green);font-weight:700">✓ คุ้ม</span>':'<span style="color:var(--red);font-weight:700">⚠ ขาด '+fmtN(p.Qin-p.Q)+'</span>'):''}<br>
      <span style="color:var(--gold)">● ไม่รวมแผ่นดิน:</span> R=<b>${fmtB(p.Rex)}</b> · CM=<b>${fmtB(cmEx)}</b> · <b>Q*=${p.Qex?fmtN(p.Qex)+' คน':'ไม่มี (CM≤0)'}</b> ${p.Qex?(p.Q>=p.Qex?'<span style="color:var(--green);font-weight:700">✓ คุ้ม</span>':'<span style="color:var(--red);font-weight:700">⚠ ขาด '+fmtN(p.Qex-p.Q)+'</span>'):''}`;}
}
function calcPg(){
  const num=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const isNew=document.getElementById('pg-type').value==='new';
  const name=isNew?(document.getElementById('pg-name-new').value||'หลักสูตรใหม่'):(document.getElementById('pg-name-sel').value||'ไม่ระบุ');
  const fac=isNew?(document.getElementById('pg-fac-new').value||''):(document.getElementById('pg-fac').value||'');
  const level=document.getElementById('pg-level').value||'';
  const Q=num('pg-q'),ST=num('pg-st'),OWN=num('pg-own'),TR=ST+OWN,TFC=num('pg-tfc'),TVC=num('pg-tvc'),TC=TFC+TVC,AVC=Q>0?TVC/Q:0;
  if(Q<=0||TR<=0||TC<=0){alert('กรุณากรอก จำนวนนิสิต, งบประมาณ (แผ่นดิน/รายได้) และต้นทุน (TFC/TVC) ให้ครบก่อนคำนวณ');return;}
  const calc=rev=>{const R=Q>0?rev/Q:0,CM=R-AVC;const Qs=CM>0?CEILq(TFC/CM):(R>0?CEILq(TC/R):null);const profit=rev-TC;return {R,CM,Qs,full:CM<=0,profit,pp:TC>0?profit/TC*100:0,isOk:Qs?Q>=Qs:false};};
  const A=calc(TR),B=calc(OWN),cur=BM==='in'?A:B;
  pgHist.unshift({name,fac,level,type:isNew?'new':'old',Q,ST,OWN,TR,TFC,TVC,TC,AVC,A,B,time:new Date().toLocaleTimeString('th-TH')});
  renderPgHist();document.getElementById('pg-result').style.display='block';
  const pdfBtn=document.getElementById('btn-pdf-report');
  pdfBtn.disabled=false;pdfBtn.style.cssText='display:flex;align-items:center;gap:7px;padding:9px 20px;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--navy2);color:#fff;letter-spacing:.02em;box-shadow:0 4px 12px rgba(109,76,255,.3)';pdfBtn.title='เปิดรายงาน PDF';
  const ss=[['รายได้รวม (TR)','var(--navy2)',MM(TR,3)+' ล.'],['ต้นทุนรวม (TC)','var(--text)',MM(TC,3)+' ล.'],['ต้นทุนคงที่ (TFC)','var(--navy2)',MM(TFC,3)+' ล.'],['ต้นทุนผันแปร (TVC)','var(--gold)',MM(TVC,3)+' ล.'],['AVC ต่อหน่วย','var(--gold)',fmtB(AVC)+' บ./คน'],['นิสิตจริง (Q)','var(--text2)',fmtN(Q)+' คน']];
  const card=(t,c,m)=>`<div style="border:1.5px solid ${c};border-radius:10px;padding:13px 15px;background:${m.isOk?'var(--green3)':'var(--red3)'}">
    <div style="font-size:10px;font-weight:800;color:${c};text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">${t}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:11.5px;margin-bottom:8px">
      <div>R/หัว: <b>${fmtB(m.R)}</b> บ.</div><div>CM/หัว: <b style="color:${m.CM>0?'var(--green)':'var(--red)'}">${fmtB(m.CM)}</b> บ.</div>
      <div>Q*: <b style="color:var(--red);font-size:13px">${m.Qs?fmtN(m.Qs)+' คน':'—'}</b>${m.full?' <span style="font-size:8px;font-weight:800;padding:1px 4px;border-radius:6px;background:var(--gold4);color:var(--gold)">TC/R</span>':''}</div>
      <div>กำไร: <b style="color:${m.profit>=0?'var(--green)':'var(--red)'}">${m.pp>=0?'+':''}${m.pp.toFixed(1)}%</b></div></div>
    <div style="font-size:11px;font-weight:700;color:${m.isOk?'var(--green)':'var(--red)'}">${!m.Qs?'⚠ คำนวณไม่ได้':(m.full?'⚠ CM≤0 · ใช้ TC/R · ':'')+(m.isOk?'✓ เกินจุดคุ้มทุน +'+fmtN(Q-m.Qs)+' คน':'⚠ ต้องเพิ่มอีก '+fmtN(m.Qs-Q)+' คน')}</div></div>`;
  document.getElementById('pg-result-card').innerHTML=`<div class="card-head"><div><div class="card-title"><span class="dot" style="background:var(--navy2)"></span>${name}</div><div class="card-sub">${fac||'—'} · ${level||'—'} · ${isNew?'หลักสูตรใหม่':'หลักสูตรเดิม'}</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px">${ss.map(([l,c,v])=>`<div class="stat-box" style="padding:9px 12px"><div class="stat-lbl" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${l}">${l}</div><div class="stat-val" style="color:${c};font-size:12px">${v}</div></div>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:9px">${card('กรณีรวมเงินแผ่นดิน','var(--navy2)',A)}${card('กรณีไม่รวมเงินแผ่นดิน','var(--gold)',B)}</div>`;
  pgLine(Q,TFC,AVC,cur.R,cur.Qs);
}
function pgLine(Q,TFC,AVC,R_ph,qsSum){
  let mQ=Math.max(Q*1.5,30);if(qsSum&&qsSum>0&&isFinite(qsSum))mQ=Math.max(mQ,qsSum*1.4);mQ=Math.min(mQ,2e5);
  const sp=Math.max(1,Math.ceil(mQ/40)),pts=[],trA=[],tcA=[],tfA=[];
  for(let q=0;q<=mQ;q+=sp){pts.push(q);trA.push(q*R_ph/1e6);tcA.push((TFC+AVC*q)/1e6);tfA.push(TFC/1e6);}
  const ds=[{label:'TR',data:trA,borderColor:C.navy,borderWidth:2.5,pointRadius:0,fill:false},
    {label:'TC',data:tcA,borderColor:C.red,borderWidth:2.5,pointRadius:0,fill:false},
    {label:'TFC',data:tfA,borderColor:C.gold,borderWidth:1.5,pointRadius:0,borderDash:[6,4],fill:false}];
  const nearest=target=>{let bi=0,bd=Infinity;pts.forEach((q,k)=>{const dd=Math.abs(q-target);if(dd<bd){bd=dd;bi=k;}});return bi;};
  if(qsSum&&qsSum>0&&qsSum<=mQ){const a=pts.map(()=>null);a[nearest(qsSum)]=qsSum*R_ph/1e6;ds.push({label:'Q*',data:a,borderColor:C.red,backgroundColor:'#fff',pointRadius:6,pointBorderWidth:2.5,showLine:false});}
  if(Q>0&&Q<=mQ){const a=pts.map(()=>null);a[nearest(Q)]=Q*R_ph/1e6;ds.push({label:'นิสิตจริง',data:a,borderColor:C.gold,backgroundColor:'#fff',pointRadius:6,pointBorderWidth:2.5,pointStyle:'rectRot',showLine:false});}
  mk('pg-chart',{type:'line',data:{labels:pts,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>'นิสิต '+fmtN(Number(i[0].label))+' คน',label:c=>c.parsed.y===null?null:c.dataset.label+': '+MM(c.parsed.y*1e6,3)+' ล.'}}},
    scales:{x:{grid:{color:C.grid},title:{display:true,text:'จำนวนนิสิต (คน)'},ticks:{maxTicksLimit:9,callback:function(v){return fmtN(Number(this.getLabelForValue(v)));}}},
      y:{grid:{color:C.grid},beginAtZero:true,title:{display:true,text:'ล้านบาท'},ticks:{callback:v=>MM(v*1e6,1)+'ล.'}}}}});
}
function renderPgHist(){

function printPdfReport(){
  const doc=reportDocHtml();
  if(!doc){alert('ไม่มีข้อมูลรายงาน กรุณาคำนวณก่อน');return;}
  const w=window.open('','_blank','width=880,height=900,scrollbars=yes');
  if(!w){alert('เบราว์เซอร์บล็อก Pop-up — กรุณาอนุญาต หรือใช้ปุ่ม "ดาวน์โหลดไฟล์" แทน');return;}
  w.document.write(doc);w.document.close();
}
function _reportFilename(ext){
  const h=pgHist[0]||{};
  const safe=String(h.name||'รายงาน').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,60);
  return 'รายงานจุดคุ้มทุน_'+safe+'.'+ext;
}
function downloadReportHtml(){
  const doc=reportDocHtml();if(!doc){alert('ไม่มีข้อมูลรายงาน กรุณาคำนวณก่อน');return;}
  const blob=new Blob(['﻿'+doc],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=_reportFilename('html');document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}
async function downloadReport(){
  const rep=document.getElementById('pdf-report');
  if(!rep||!rep.innerHTML.trim()){alert('ไม่มีข้อมูลรายงาน กรุณาคำนวณก่อน');return;}
  const jsPDFctor=window.jspdf&&window.jspdf.jsPDF;
  if(!jsPDFctor||typeof window.html2canvas!=='function'){
    alert('ไม่สามารถโหลดตัวสร้าง PDF ได้ (ต้องมีอินเทอร์เน็ต) — จะดาวน์โหลดเป็นไฟล์ HTML ให้แทน ซึ่งเปิดแล้วสั่งพิมพ์เป็น PDF ได้');
    return downloadReportHtml();
  }
  const btn=document.getElementById('btn-dl-pdf'),old=btn?btn.textContent:'';
  if(btn){btn.textContent='⏳ กำลังสร้าง PDF...';btn.style.opacity='.7';btn.disabled=true;}
  try{
    const pages=[...rep.querySelectorAll('.pdf-page')];
    const pdf=new jsPDFctor('p','mm','a4');
    const W=210,H=297;
    for(let i=0;i<pages.length;i++){
      const canvas=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:pages[i].scrollWidth});
      const img=canvas.toDataURL('image/jpeg',0.95);
      if(i>0)pdf.addPage();
      const ratio=Math.min(W/canvas.width,H/canvas.height);
      const w=canvas.width*ratio,h=canvas.height*ratio;
      pdf.addImage(img,'JPEG',(W-w)/2,0,w,h,undefined,'FAST');
    }
    pdf.save(_reportFilename('pdf'));
  }catch(e){
    alert('เกิดข้อผิดพลาดในการสร้าง PDF — จะดาวน์โหลดเป็นไฟล์ HTML ให้แทน');
    downloadReportHtml();
  }finally{
    if(btn){btn.textContent=old;btn.style.opacity='1';btn.disabled=false;}
  }
}

ู่</span>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"card-head\" style=\"flex-wrap:wrap;gap:10px\">\n        <div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>สัดส่วนที่มาข้อมูล รายคณะ</div>\n          <div class=\"card-sub\">คณะที่แถบเขียวสั้น = ตัวเลขพึ่งการปันส่วนมาก ต้องระวังการตีความ · เรียงตามสัดส่วนที่ปันส่วน<br><b>หมายเหตุสำหรับผู้พัฒนา</b> — mockup นี้ใช้ <code style=\"font-family:'Manrope',monospace\">tfcOffice</code> (ต้นทุนสำนักงานเลขานุการที่ปันลงหลักสูตร) เป็นตัวแทนของยอดที่ปันส่วน ระบบจริงต้องอ่านจาก <code style=\"font-family:'Manrope',monospace\">cost_allocation_line.method</code></div></div>\n      </div>\n      <div class=\"tbl-scroll\" style=\"max-height:520px;overflow:auto\">\n        <table class=\"tbl dense\" style=\"min-width:640px\">\n          <thead><tr>\n            <th>คณะ / วิทยาลัย</th><th style=\"width:150px\">ตรง / ปันส่วน</th>\n            <th class=\"num\">ตรง</th><th class=\"num\">ปันส่วน</th><th class=\"num\">ต้นทุนรวม</th><th>ความเชื่อมั่น</th>\n          </tr></thead>\n          <tbody id=\"src-tb\"></tbody>\n        </table>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:#6d4cff\"></span>ต้นทุนที่ปันส่วน แยกตามวิธี</div>\n      <div class=\"card-sub\">วิธีที่ใช้กำหนดจากกติกาผังบัญชี (W14) · วิธีที่แม่นน้อยกว่าควรมีสัดส่วนน้อยที่สุด</div></div></div>\n    <div class=\"ch\" style=\"height:230px\"><canvas id=\"m-chart\"></canvas></div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>ทำไมผู้บริหารต้องเห็นหน้านี้</h3>\n    <ul>\n      <li class=\"crit\"><b>ต้นทุนสำนักงานเลขานุการที่ปันด้วย PROGRAM_SHARE</b> ทำให้หลักสูตรที่มีนิสิตหลักหน่วยมี AVC สูงผิดปกติ — เป็นข้อจำกัดของวิธีปันส่วน ไม่ใช่หลักสูตรนั้นแพงจริง</li>\n      <li class=\"warn\">คณะที่มีสัดส่วนปันส่วนสูง ตัวเลขจุดคุ้มทุนจะ<b>อ่อนไหวต่อการเปลี่ยนกติกา</b>มากกว่าคณะอื่น</li>\n      <li class=\"ok\">ส่วนต่างตรวจยอดเป็น <b>0.00 บาท</b> แปลว่าไม่มีเงินหายระหว่างปันส่วน — แต่ไม่ได้แปลว่าข้อมูลต้นทางครบ</li>\n      <li class=\"info\">ทุกตัวเลขในหน้า W1–W5 คำนวณจาก run เดียวกันนี้ ถ้าอนุมัติ run ใหม่ ตัวเลขทุกหน้าจะเปลี่ยนพร้อมกัน</li>\n    </ul>\n  </div>\n\n</div>\n",
    init: function () {



const TOT = RAW.UNI.TC;
const bahtF = v => Number(v).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
document.getElementById('v-src').textContent = bahtF(TOT);
document.getElementById('v-alloc').textContent = bahtF(TOT);

/* สัดส่วน ตรง : ปันส่วน — คิดจาก RECON_METHODS ให้ตรงกับตารางรายคณะด้านล่าง */
const allocTot = RECON_METHODS.filter(m => m.alloc).reduce((a, m) => a + m.v, 0);
const directTot = TOT - allocTot;
document.getElementById('sp-direct').style.flex = directTot;
document.getElementById('sp-alloc').style.flex = allocTot;
document.getElementById('lb-direct').textContent =
  (directTot / TOT * 100).toFixed(0) + '% — ' + fmtM(directTot) + ' ลบ.';
document.getElementById('lb-alloc').textContent =
  (allocTot / TOT * 100).toFixed(0) + '% — ' + fmtM(allocTot) + ' ลบ.';

/* รายการวิธีปันส่วน */
document.getElementById('method-list').innerHTML = RECON_METHODS.map(m =>
  `<div style="padding:9px 0;border-bottom:1px solid var(--border)">
     <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
       <span style="font-size:11.5px;font-weight:600;color:var(--text2)">
         <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${m.c};margin-right:6px"></span>${m.l}</span>
       <span class="num" style="font-size:12.5px;font-weight:700">${fmtM(m.v)} <span style="color:var(--text3);font-size:10px">${(m.v / TOT * 100).toFixed(1)}%</span></span>
     </div>
     <div style="font-size:10.5px;color:var(--text4);line-height:1.55;margin-top:2px">${m.note}</div>
   </div>`).join('');

/* สรุปรายการค้างตรวจ — คำนวณจากชุดเดียวกับ W13 เพื่อไม่ให้ตัวเลขสองหน้าขัดกัน */
const byFlag = {};
EXCEPTIONS.forEach(e => {
  const g = byFlag[e.flag] || (byFlag[e.flag] = { flag: e.flag, cls: e.cls, label: e.label, n: 0, amt: 0, measurable: 0 });
  g.n++; g.amt += e.amount || 0; if (e.amount) g.measurable++;
});
document.getElementById('exc-sum').innerHTML = Object.values(byFlag).map(g =>
  `<tr><td><span class="flag ${g.cls}">${g.flag}</span></td>
     <td class="muted">${g.label}</td>
     <td class="num">${g.n} รายการ</td>
     <td class="num" style="font-weight:700">${g.amt ? fmtM(g.amt) + ' ลบ.' : '<span class="muted">วัดไม่ได้</span>'}</td></tr>`).join('');

const excAmt = EXCEPTIONS.reduce((a, e) => a + (e.amount || 0), 0);
document.getElementById('exc-amt').textContent = fmtM(excAmt) + ' ลบ.';
document.getElementById('exc-pct').textContent = (excAmt / TOT * 100).toFixed(2) + '%';

/* สัดส่วน direct/allocated รายคณะ — ประมาณจากสัดส่วน tfcOffice ในต้นทุนรวมของคณะ (ยิ่งสูง ยิ่งพึ่งการปันส่วน) */
const rows = RAW.FACS.map(f => {
  const alloc = F0(f.tfcOffice);
  const pct = F0(f.TC) > 0 ? alloc / F0(f.TC) * 100 : 0;
  return { name: f.name, TC: F0(f.TC), alloc, direct: F0(f.TC) - alloc, pct };
}).sort((a, b) => b.pct - a.pct);

const conf = p => p < 25 ? ['สูง', 'chip-g'] : p < 45 ? ['ปานกลาง', 'chip-o'] : ['ต่ำ', 'chip-r'];

document.getElementById('src-tb').innerHTML = rows.map(r => {
  const [cl, cc] = conf(r.pct);
  return `<tr>
    <td class="wrap"><b>${short(r.name)}</b></td>
    <td><div class="split">
        <i style="flex:${(100 - r.pct).toFixed(1)};background:#56ca00"></i>
        <i style="flex:${r.pct.toFixed(1)};background:#ffb400"></i></div></td>
    <td class="num">${fmtM(r.direct)}</td>
    <td class="num" style="color:var(--gold);font-weight:700">${fmtM(r.alloc)}</td>
    <td class="num">${fmtM(r.TC)}</td>
    <td><span class="chip ${cc}">${cl} · ปันส่วน ${r.pct.toFixed(0)}%</span></td>
  </tr>`;
}).join('');

/* กราฟวิธีปันส่วน */
mk('m-chart', {
  type: 'bar',
  data: {
    labels: RECON_METHODS.map(m => m.l),
    datasets: [{ data: RECON_METHODS.map(m => M(m.v)), backgroundColor: RECON_METHODS.map(m => m.c), borderRadius: 5, barPercentage: .6 }],
  },
  options: {
    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.x.toLocaleString('th-TH', { maximumFractionDigits: 1 }) + ' ลบ. (' + (c.parsed.x / M(TOT) * 100).toFixed(1) + '%)' } } },
    scales: { x: { grid: { color: C.grid }, title: { display: true, text: 'ล้านบาท', font: { size: 10 } } }, y: { grid: { display: false }, ticks: { font: { size: 10.5 } } } },
  },
});


    },
  },

    html: "<div class=\"page\">\n\n  <div class=\"bm-note\">\n    <span>ℹ️</span>\n    <span>รายการที่ระบบ<b>คำนวณต่อไปได้แต่ไม่มั่นใจ</b> จะถูกติดธงไว้ที่นี่แทนที่จะรวมเงียบๆ\n      · ทุกธงมีผู้รับผิดชอบและมูลค่าที่กระทบ เพื่อให้ตามแก้ได้จริง ไม่ใช่รู้ว่ามีปัญหาแต่ไม่รู้ว่าของใคร</span>\n  </div>\n\n  <div class=\"kpis\">\n    <div class=\"kpi cr\"><div class=\"kpi-label\">ยังไม่แก้</div><div class=\"kpi-val num\" style=\"color:var(--red2)\" id=\"k-open\">—</div><div class=\"kpi-unit\">รายการ</div></div>\n    <div class=\"kpi co\"><div class=\"kpi-label\">กำลังตาม</div><div class=\"kpi-val num\" style=\"color:var(--gold)\" id=\"k-prog\">—</div><div class=\"kpi-unit\">รายการ</div></div>\n    <div class=\"kpi\"><div class=\"kpi-label\">ยอมรับแล้ว</div><div class=\"kpi-val num\" id=\"k-acc\">—</div><div class=\"kpi-unit\">รายการ · รับทราบข้อจำกัด</div></div>\n    <div class=\"kpi cn\"><div class=\"kpi-label\">มูลค่าที่กระทบรวม</div><div class=\"kpi-val num\" style=\"color:var(--navy2)\" id=\"k-amt\">—</div><div class=\"kpi-unit\" id=\"k-amt-s\">ล้านบาท</div></div>\n  </div>\n\n  <div class=\"caveat\">\n    <span>⚠️</span>\n    <span><b>รายการที่ร้ายแรงที่สุดไม่ได้วัดเป็นบาทได้</b> — ค่าเสื่อมราคาอาคารยังไม่มีข้อมูลเลยแม้แต่แถวเดียว\n      ทำให้ TFC และ TC ต่ำกว่าความจริงทั้งระบบ <span id=\"sur\">—</span>\n      และ Q* ทุกระดับ<b>ต่ำกว่าที่ควรเป็น</b> — ต้องกำกับข้อจำกัดนี้ทุกครั้งที่นำเสนอตัวเลขชุดปี 2568</span>\n  </div>\n\n  <div class=\"toolbar\">\n    <div class=\"seg\" id=\"f-flag\">\n      <button class=\"on\" data-f=\"all\">ทั้งหมด</button>\n      <button data-f=\"MISSING_SOURCE\">ไม่มีข้อมูลต้นทาง</button>\n      <button data-f=\"UNCLASSIFIED\">ยังไม่จำแนก</button>\n      <button data-f=\"MISSING_DRIVER\">ไม่มีตัวขับ</button>\n      <button data-f=\"NO_FEE\">ไม่มีค่าธรรมเนียม</button>\n      <button data-f=\"Q_ZERO\">Q = 0</button>\n    </div>\n    <span class=\"grow\"></span>\n    <span class=\"pill\" id=\"count\">—</span>\n    <button class=\"btn\">⬇ ส่งออกเป็น Excel</button>\n  </div>\n\n  <div class=\"card\" style=\"padding:0;overflow:hidden\">\n    <div style=\"max-height:640px;overflow:auto\">\n      <table class=\"tbl dense\">\n        <thead><tr>\n          <th style=\"width:132px\">ธง</th><th>รายการ</th><th style=\"width:130px\">หน่วยงาน</th>\n          <th class=\"num\" style=\"width:110px\">มูลค่าที่กระทบ</th>\n          <th style=\"width:170px\">ผู้รับผิดชอบ</th><th style=\"width:96px\">สถานะ</th><th style=\"width:92px\"></th>\n        </tr></thead>\n        <tbody id=\"exc-tb\"></tbody>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"grid g-2e\" style=\"margin-top:16px\">\n    <div class=\"card\">\n      <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ธงแต่ละประเภทหมายความว่าอะไร</div>\n        <div class=\"card-sub\">ระบบทำอะไรต่อกับรายการที่ติดธงนั้น</div></div></div>\n      <table class=\"tbl dense\">\n        <tbody>\n          <tr><td style=\"width:132px\"><span class=\"flag flag-unc\">MISSING_SOURCE</span></td>\n            <td class=\"wrap\">ไม่มีข้อมูลจากระบบต้นทางเลย — ระบบ<b>คำนวณโดยไม่มีตัวเลขนี้</b> ผลลัพธ์จึงต่ำกว่าความจริง</td></tr>\n          <tr><td><span class=\"flag flag-unc\">UNCLASSIFIED</span></td>\n            <td class=\"wrap\">มีเงินแต่ยังไม่รู้ว่าเป็น TFC หรือ TVC — <b>พักไว้ที่หน่วยงาน ไม่ปันลงหลักสูตร</b></td></tr>\n          <tr><td><span class=\"flag flag-drv\">MISSING_DRIVER</span></td>\n            <td class=\"wrap\">กติกาสั่งให้ปันตามการใช้จริง แต่ไม่มีข้อมูลการใช้ — <b>ตกไปใช้วิธีสำรอง</b> และติดธง ESTIMATED</td></tr>\n          <tr><td><span class=\"flag flag-fee\">NO_FEE</span></td>\n            <td class=\"wrap\">ยังไม่มีอัตราค่าธรรมเนียมที่อนุมัติ — <b>TR คำนวณไม่ได้ กันหลักสูตรออกจากยอดรวม</b></td></tr>\n          <tr><td><span class=\"flag flag-q0\">Q_ZERO</span></td>\n            <td class=\"wrap\">หลักสูตรเปิดแต่ไม่มีนิสิต — <b>R และ AVC เป็น null</b> หา Q* ไม่ได้ แต่ต้นทุนยังเกิดขึ้นจริง</td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--gold2)\"></span>สัดส่วนเทียบต้นทุนรวม</div>\n        <div class=\"card-sub\">ประเมินว่าปัญหาคุณภาพข้อมูลใหญ่แค่ไหนเมื่อเทียบกับตัวเลขทั้งหมด</div></div></div>\n\n      <div class=\"mini-stats\" style=\"margin-bottom:16px\">\n        <div class=\"mini-stat\"><div class=\"l\">มูลค่าที่ติดธง</div><div class=\"v\" style=\"color:var(--gold)\" id=\"m1\">—</div><div class=\"s\">ล้านบาท</div></div>\n        <div class=\"mini-stat\"><div class=\"l\">คิดเป็นสัดส่วน</div><div class=\"v\" style=\"color:var(--gold)\" id=\"m2\">—</div><div class=\"s\" id=\"m2s\">ของต้นทุนรวม</div></div>\n        <div class=\"mini-stat\"><div class=\"l\">เกณฑ์ที่ยอมรับ</div><div class=\"v\" style=\"color:var(--green2)\">≤ 1.0%</div><div class=\"s\">ตั้งไว้ในนโยบายคุณภาพข้อมูล</div></div>\n      </div>\n\n      <div class=\"split\" style=\"height:16px;margin-bottom:8px\">\n        <i id=\"bar-flag\" style=\"background:linear-gradient(135deg,#ffb400,#ffd166)\"></i>\n        <i id=\"bar-ok\" style=\"background:linear-gradient(135deg,#56ca00,#78d533)\"></i>\n      </div>\n      <div class=\"split-lbl\" style=\"font-size:11px\">\n        <span><b style=\"color:var(--gold)\">ติดธง</b> <span id=\"lbl-flag\"></span></span>\n        <span><b style=\"color:var(--green)\">ผ่านโดยไม่มีข้อสังเกต</b> <span id=\"lbl-ok\"></span></span>\n      </div>\n\n      <div class=\"bm-note\" style=\"margin-top:16px\">\n        <span>⚠️</span>\n        <span>ตัวเลข <b id=\"note-pct\">—</b> ดูน้อย แต่<b>ไม่ได้นับค่าเสื่อมราคาอาคารที่หายไปทั้งก้อน</b>\n          เพราะวัดเป็นบาทไม่ได้จนกว่าจะมีข้อมูล — สัดส่วนที่แท้จริงจึงสูงกว่านี้</span>\n      </div>\n    </div>\n  </div>\n\n</div>\n",
    init: function () {



let fFlag = 'all';

const cntState = s => EXCEPTIONS.filter(e => e.state === s).length;
document.getElementById('k-open').textContent = cntState('OPEN');
document.getElementById('k-prog').textContent = cntState('IN_PROGRESS');
document.getElementById('k-acc').textContent = cntState('ACCEPTED');

document.getElementById('sur').innerHTML = surplusCaveatTxt();

const totalAmt = EXCEPTIONS.reduce((s, e) => s + (e.amount || 0), 0);
document.getElementById('k-amt').textContent = fmtM(totalAmt);
document.getElementById('k-amt-s').textContent =
  'ล้านบาท · ' + (totalAmt / RAW.UNI.TC * 100).toFixed(2) + '% ของต้นทุนรวม';

document.getElementById('m1').textContent = fmtM(totalAmt);
const pct = totalAmt / RAW.UNI.TC * 100;
document.getElementById('m2').textContent = pct.toFixed(2) + '%';
document.getElementById('bar-flag').style.flex = Math.max(pct, 1.2);
document.getElementById('bar-ok').style.flex = 100 - pct;
document.getElementById('lbl-flag').textContent = fmtM(totalAmt) + ' ลบ. (' + pct.toFixed(2) + '%)';
document.getElementById('lbl-ok').textContent = fmtM(RAW.UNI.TC - totalAmt) + ' ลบ.';
document.getElementById('note-pct').textContent = pct.toFixed(2) + '%';
document.getElementById('m2s').textContent = 'ของต้นทุนรวม ' + fmtM(RAW.UNI.TC) + ' ลบ.';

function render() {
  const rows = EXCEPTIONS.filter(e => fFlag === 'all' || e.flag === fFlag);
  document.getElementById('exc-tb').innerHTML = rows.map(e => {
    const s = EXC_STATE[e.state];
    return `<tr>
      <td><span class="flag ${e.cls}">${e.flag}</span></td>
      <td class="wrap"><b>${e.item}</b><div class="muted" style="margin-top:2px">${e.note}</div></td>
      <td class="muted">${e.org}</td>
      <td class="num" style="font-weight:700">${e.amount ? fmtM(e.amount) : '<span class="muted">วัดไม่ได้</span>'}</td>
      <td class="wrap"><div style="font-size:11.5px">${e.owner}</div><div class="muted">ตั้งแต่ ${e.since}</div></td>
      <td><span class="st ${s.c}"><span class="st-dot"></span>${s.l}</span></td>
      <td style="text-align:right"><button class="btn btn-sm">มอบหมาย</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text4);padding:28px">— ไม่มีรายการในธงนี้ —</td></tr>`;
  document.getElementById('count').textContent = `${rows.length} จาก ${EXCEPTIONS.length} รายการ`;
}

document.querySelectorAll('#f-flag button').forEach(b => b.onclick = () => {
  fFlag = b.dataset.f;
  document.querySelectorAll('#f-flag button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

render();


    },
  },

  'W16-programs': {

    caveat: false,
    html: "<div class=\"page\">\n\n  <div class=\"bm-note\">\n    <span>ℹ️</span>\n    <span><b>ปรับปรุงหลักสูตร = สร้างรุ่นใหม่ ไม่ใช่แก้ทับของเดิม</b> —\n      ทุกตารางในระบบอ้าง <code style=\"font-family:'Manrope',monospace\">program_version_id</code> ไม่ใช่\n      <code style=\"font-family:'Manrope',monospace\">program_id</code>\n      ถ้าแก้ทับ ตัวเลขจุดคุ้มทุนของปีเก่าจะเปลี่ยนตามไปด้วยโดยไม่มีใครรู้</span>\n  </div>\n\n  <div class=\"kpis\">\n    <div class=\"kpi cg\"><div class=\"kpi-label\">หลักสูตรที่เปิดสอน</div><div class=\"kpi-val num\" style=\"color:var(--green2)\" id=\"k-active\">—</div><div class=\"kpi-unit\">เข้าสู่การคำนวณจุดคุ้มทุน</div></div>\n    <div class=\"kpi co\"><div class=\"kpi-label\">รออนุมัติ / ร่างข้อเสนอ</div><div class=\"kpi-val num\" style=\"color:var(--gold)\" id=\"k-pend\">—</div><div class=\"kpi-unit\">ยังไม่เข้าสู่การคำนวณ</div></div>\n    <div class=\"kpi cn\"><div class=\"kpi-label\">กำลังปรับปรุงรอบ มคอ.</div><div class=\"kpi-val num\" style=\"color:var(--navy2)\" id=\"k-rev\">—</div><div class=\"kpi-unit\">มีรุ่นใหม่รอมีผล</div></div>\n    <div class=\"kpi cr\"><div class=\"kpi-label\">งดรับ / ปิดหลักสูตร</div><div class=\"kpi-val num\" style=\"color:var(--red2)\" id=\"k-off\">—</div><div class=\"kpi-unit\">ยังเก็บไว้เทียบข้ามปี</div></div>\n  </div>\n\n  <div class=\"card\" style=\"margin-bottom:16px;background:var(--bg2)\">\n    <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>วงจรชีวิตหลักสูตรในระบบ</div>\n      <div class=\"card-sub\">สถานะกำหนดว่าหลักสูตรนั้นเข้าสู่การคำนวณจุดคุ้มทุนหรือไม่</div></div></div>\n    <div class=\"flow\" id=\"flow\"></div>\n    <div class=\"sub-note\" style=\"margin:12px 0 0\">\n      หลักสูตรที่ยังไม่ถึงสถานะ <b>เปิดสอน</b> จะยังไม่มีนิสิตและไม่มีต้นทุนจริง จึงประเมินได้เฉพาะแบบจำลองที่\n      <a href=\"W7-scenario-program.html\" style=\"color:var(--navy2)\">W7 คำนวณจุดคุ้มทุนรายหลักสูตร</a>\n      — ตัวเลขจากที่นั่นเป็น <code style=\"font-family:'Manrope',monospace\">scenario_plan</code> ไม่ปนกับผลจริง\n    </div>\n  </div>\n\n  <div class=\"toolbar\">\n    <div class=\"seg\" id=\"f-state\">\n      <button class=\"on\" data-f=\"all\">ทั้งหมด</button>\n      <button data-f=\"ACTIVE\">เปิดสอน</button>\n      <button data-f=\"PENDING_APPROVAL\">รออนุมัติ</button>\n      <button data-f=\"DRAFT\">ร่าง</button>\n      <button data-f=\"REVISING\">ปรับปรุง</button>\n      <button data-f=\"SUSPENDED\">งดรับ</button>\n      <button data-f=\"CLOSED\">ปิด</button>\n    </div>\n    <div class=\"be-search-wrap\" style=\"max-width:260px\">\n      <span class=\"be-search-ic\">🔍</span>\n      <input type=\"text\" id=\"f-q\" class=\"be-search\" placeholder=\"ค้นหารหัส / ชื่อหลักสูตร / คณะ...\">\n    </div>\n    <span class=\"grow\"></span>\n    <span class=\"pill\" id=\"cnt\">—</span>\n    <button class=\"btn\">⬆ นำเข้าจากระบบทะเบียน</button>\n    <button class=\"btn primary\" id=\"btn-new\">+ เปิดหลักสูตรใหม่</button>\n  </div>\n\n  <div class=\"grid\" style=\"grid-template-columns:1.65fr 1fr\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n        <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ทะเบียนหลักสูตร</div>\n        <div class=\"card-sub\">คลิกแถวเพื่อดูรุ่นหลักสูตรและการดำเนินการ · ตาราง\n          <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">program</code></div>\n      </div>\n      <div style=\"max-height:560px;overflow:auto\">\n        <table class=\"tbl dense\">\n          <thead><tr>\n            <th style=\"width:104px\">รหัสหลักสูตร</th><th>ชื่อหลักสูตร / คณะ</th>\n            <th style=\"width:82px\">ระดับ</th>\n            <th class=\"num\" style=\"width:74px\">นิสิต (Q)</th>\n            <th class=\"num\" style=\"width:64px\">รุ่น มคอ.</th>\n            <th style=\"width:96px\">สถานะ</th><th style=\"width:60px\">คำนวณ</th>\n          </tr></thead>\n          <tbody id=\"prog-tb\"></tbody>\n        </table>\n      </div>\n    </div>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div class=\"card\" id=\"detail\"></div>\n      <div class=\"card\" id=\"versions\"></div>\n    </div>\n  </div>\n\n  <div class=\"grid g-2e\" style=\"margin-top:16px\">\n    <div class=\"card\">\n      <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--red2)\"></span>ตรวจก่อนเปลี่ยนสถานะเป็น \"เปิดสอน\"</div>\n        <div class=\"card-sub\">หลักสูตรจะเข้าสู่การคำนวณได้ก็ต่อเมื่อข้อมูลที่จำเป็นครบ</div></div></div>\n      <div id=\"ready\"></div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--gold2)\"></span>บันทึกการเปลี่ยนแปลงทะเบียน</div>\n        <div class=\"card-sub\">ตาราง <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">audit_event</code></div></div></div>\n      <div class=\"log\" id=\"prog-log\"></div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>จุดที่ต้องระวังในหน้านี้</h3>\n    <ul>\n      <li class=\"crit\"><b>ห้ามแก้ชื่อ/คณะของหลักสูตรที่คำนวณไปแล้วโดยไม่สร้างรุ่นใหม่</b> — รายงานปีเก่าจะเปลี่ยนตาม และตอบไม่ได้ว่าตัวเลขที่เคยเสนอผู้บริหารมาจากอะไร</li>\n      <li class=\"warn\"><b>งดรับนิสิต ≠ ปิดหลักสูตร</b> — หลักสูตรที่งดรับยังมีนิสิตคงค้างและยังมีต้นทุน ต้องคำนวณต่อ ถ้าตัดออกจากยอดรวมจะทำให้ต้นทุนหายไปทั้งก้อน</li>\n      <li class=\"warn\"><b>หลักสูตรเปิดใหม่ที่ยังไม่มีค่าธรรมเนียมอนุมัติ</b> จะติดธง <code style=\"font-family:'Manrope',monospace\">NO_FEE</code> ที่ <a href=\"W13-exceptions.html\">W13</a> และถูกกันออกจากยอดรวม ไม่ใช่คำนวณด้วยค่า 0</li>\n      <li class=\"info\"><b>รหัสหลักสูตรต้องมาจากระบบทะเบียน</b> (<code style=\"font-family:'Manrope',monospace\">program_code</code> เป็น UNIQUE) ห้ามตั้งเองด้วยชื่อไทย ไม่งั้นจับคู่ข้ามระบบไม่ได้</li>\n      <li class=\"ok\">การประเมินว่าหลักสูตรใหม่ควรเปิดหรือไม่ ทำที่ <a href=\"W7-scenario-program.html\">W7</a> แล้วแนบผลมากับข้อเสนอ — หน้านี้เก็บเฉพาะทะเบียน ไม่คำนวณเอง</li>\n    </ul>\n  </div>\n\n</div>\n",
    init: function () {



let fState = 'all', fQ = '', sel = 0;

/* จับคู่กับข้อมูลจริงใน RAW.PROGS เพื่อดึง Q · TR · Q* ของหลักสูตรที่เปิดสอนอยู่ */
function actualOf(p) {
  return RAW.PROGS.find(x => x.prog === p.prog && x.fac === p.fac && x.lvl === p.lvl) || null;
}
/* รุ่นที่มีผลอยู่ (ไม่ใช่ร่าง) */
const liveVer = p => [...p.vers].reverse().find(v => !v.draft) || p.vers[0];
const draftVer = p => p.vers.find(v => v.draft) || null;

/* ---- วงจรชีวิต ---- */
document.getElementById('flow').innerHTML = PROG_FLOW.map((s, i) =>
  (i ? '<span class="flow-arrow">→</span>' : '') +
  `<span class="flow-step ${s.k === 'ACTIVE' ? 'now' : ''}" title="${s.d}">
     ${PROG_STATE[s.k].calc ? '📈' : '○'} ${s.l}</span>`).join('');

/* ---- KPI ---- */
const cnt = f => PROGRAM_REG.filter(f).length;
document.getElementById('k-active').textContent = cnt(p => p.state === 'ACTIVE');
document.getElementById('k-pend').textContent = cnt(p => p.state === 'PENDING_APPROVAL' || p.state === 'DRAFT');
document.getElementById('k-rev').textContent = cnt(p => p.state === 'REVISING');
document.getElementById('k-off').textContent = cnt(p => p.state === 'SUSPENDED' || p.state === 'CLOSED');

/* ---- ตาราง ---- */
function visible() {
  return PROGRAM_REG.map((p, i) => ({ p, i }))
    .filter(x => fState === 'all' || x.p.state === fState)
    .filter(x => !fQ || (x.p.code + x.p.prog + x.p.fac + x.p.deg).toLowerCase().includes(fQ));
}

function renderTable() {
  const rows = visible();
  document.getElementById('prog-tb').innerHTML = rows.map(({ p, i }) => {
    const st = PROG_STATE[p.state], a = actualOf(p), v = liveVer(p), d = draftVer(p);
    return `<tr data-i="${i}" class="${i === sel ? 'sel' : ''}" style="cursor:pointer">
      <td><code style="font-family:'Manrope',monospace;font-size:10.5px;color:var(--navy)">${p.code}</code></td>
      <td class="wrap"><b>${p.prog}</b>${p.intl ? ' <span class="chip chip-n" style="font-size:9px">นานาชาติ</span>' : ''}
        <div class="muted">${p.fac}</div></td>
      <td class="muted">${p.lvl}</td>
      <td class="num">${a ? fmtN(a.Q) : (p.proposedQ ? `<span class="muted">~${fmtN(p.proposedQ)}*</span>` : '<span class="muted">—</span>')}</td>
      <td class="num"><code style="font-family:'Manrope',monospace;font-size:10.5px">${v.v}</code>${d ? `<div class="muted" style="font-size:9.5px">+${d.v} ร่าง</div>` : ''}</td>
      <td><span class="st ${st.c}"><span class="st-dot"></span>${st.l}</span></td>
      <td style="text-align:center">${st.calc
        ? '<span title="เข้าสู่การคำนวณ" style="color:var(--green2);font-weight:700">✓</span>'
        : '<span title="ไม่เข้าสู่การคำนวณ" style="color:var(--text4)">−</span>'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text4);padding:26px">— ไม่พบหลักสูตรที่ตรงกับตัวกรอง —</td></tr>`;

  document.getElementById('cnt').textContent = `${rows.length} จาก ${PROGRAM_REG.length} หลักสูตร`;
  document.querySelectorAll('#prog-tb tr[data-i]').forEach(tr => {
    tr.onclick = () => { sel = +tr.dataset.i; renderTable(); renderDetail(); renderVersions(); renderReady(); };
  });
}

/* ---- รายละเอียดหลักสูตรที่เลือก ---- */

  const canSubmit = p.state === 'DRAFT';
  const canApprove = p.state === 'PENDING_APPROVAL';

  document.getElementById('detail').innerHTML = `
    <div class="card-head"><div>
      <div class="card-title"><span class="dot" style="background:var(--navy2)"></span>${p.prog}</div>

    </div><span class="st ${st.c}"><span class="st-dot"></span>${st.l}</span></div>

    <div class="sub-note" style="margin:0 0 14px;background:${st.calc ? 'var(--green3)' : 'var(--bg3)'};
        color:${st.calc ? 'var(--green)' : 'var(--text3)'};padding:9px 13px;border-radius:8px">
      ${st.calc ? '📈' : '○'} ${st.why}

    <div class="mini-stats" style="margin-bottom:14px">

        <div class="v" style="color:var(--navy)">${a ? fmtN(a.Q) : (p.proposedQ ? '~' + fmtN(p.proposedQ) : '—')}</div>
        <div class="s">${a ? 'คน · จากระบบทะเบียน' : (p.proposedQ ? 'คน · ประมาณการในข้อเสนอ' : 'ยังไม่มีข้อมูล')}</div></div>
      <div class="mini-stat"><div class="l">จุดคุ้มทุน Q*</div>
        <div class="v" style="color:var(--gold)">${a && Qs(a) ? fmtN(Qs(a)) : '—'}</div>
        <div class="s">${a ? (Qs(a) ? 'คน · จากรอบคำนวณ #' + RUN.id : 'R ≤ AVC') : 'ยังคำนวณไม่ได้'}</div></div>
      <div class="mini-stat"><div class="l">ชื่อปริญญา</div>
        <div class="v" style="font-size:12px;line-height:1.4">${p.deg}</div><div class="s">degree_name</div></div>
    </div>

    <div class="rule-row"><div><div class="rule-name">รหัสจากระบบทะเบียน</div>
      <div class="rule-desc"><code style="font-family:'Manrope',monospace">program_code</code> เป็น UNIQUE — ใช้จับคู่ข้ามระบบ</div></div>
      <code style="font-family:'Manrope',monospace;font-size:11px;font-weight:700;color:var(--navy)">${p.code}</code></div>
    <div class="rule-row"><div><div class="rule-name">หน่วยงานที่สังกัด</div>
      <div class="rule-desc">ผูกที่ระดับ <code style="font-family:'Manrope',monospace">EDUCATION_LEVEL</code> ไม่ใช่ระดับคณะ เพราะต้นทุนสำนักงานปันแยกตรี/บัณฑิต</div></div>
      <span class="chip chip-n">${p.lvl === 'ปริญญาตรี' ? 'ปริญญาตรี' : 'บัณฑิตศึกษา'}</span></div>
    <div class="rule-row"><div><div class="rule-name">หลักสูตรนานาชาติ</div>
      <div class="rule-desc">กระทบอัตราค่าธรรมเนียมและประเภทนิสิตที่ใช้คำนวณ</div></div>
      <span class="chip ${p.intl ? 'chip-g' : 'chip-n'}">${p.intl ? 'ใช่' : 'ไม่ใช่'}</span></div>

    <div class="toolbar" style="margin:16px 0 0;padding-top:14px;border-top:1px solid var(--border)">
      <button class="btn">✎ แก้ไขข้อมูลทะเบียน</button>
      ${revising
        ? `<button class="btn primary" title="รุ่นใหม่ยังเป็นร่าง — เสนอสภาวิชาการเพื่อให้มีผล">📤 เสนออนุมัติรุ่น ${draftVer(p) ? draftVer(p).v : ''}</button>`
        : `<button class="btn ${canRevise ? '' : 'off'}" ${canRevise ? '' : 'disabled'}
             title="${canRevise ? 'สร้าง program_version ใหม่ ไม่ทับรุ่นเดิม' : 'สร้างรุ่นใหม่ได้เมื่อหลักสูตรเปิดสอนหรืองดรับแล้วเท่านั้น'}">🔄 ปรับปรุงหลักสูตร (สร้างรุ่นใหม่)</button>`}

}

/* ---- รุ่นหลักสูตร (program_version) ---- */
function renderVersions() {
  const p = PROGRAM_REG[sel];
  document.getElementById('versions').innerHTML = `
    <div class="card-head"><div>
      <div class="card-title"><span class="dot" style="background:var(--gold2)"></span>รุ่นหลักสูตร (รอบ มคอ.)</div>
      <div class="card-sub">ตาราง <code style="font-family:'Manrope',monospace;font-size:10.5px">program_version</code>
        · ทุกตัวเลขในระบบผูกกับรุ่น ไม่ใช่ผูกกับหลักสูตร</div>
    </div></div>
    ${p.vers.map(v => {
      const live = !v.draft && (v.to === null);
      return `<div style="display:grid;grid-template-columns:8px 1fr;gap:12px;padding:11px 0;
          border-bottom:1px solid var(--border);${v.draft ? 'opacity:.75' : ''}">
        <div style="width:8px;border-radius:4px;background:${live ? 'var(--navy2)' : v.draft ? 'var(--gold2)' : 'var(--border2)'}"></div>

          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

            ${live ? '<span class="st st-appr" style="font-size:9px">รุ่นที่ใช้คำนวณ</span>' : ''}
            ${v.draft ? '<span class="st st-valid" style="font-size:9px">ร่าง · ยังไม่มีผล</span>' : ''}

          <div class="rule-desc">${v.note || 'ไม่มีหมายเหตุ'}</div>
        </div>
      </div>`;
    }).join('')}
    <div class="sub-note" style="margin:12px 0 0">
      ${p.vers.length > 1

        : 'หลักสูตรนี้ยังมีรุ่นเดียว — ยังไม่เคยผ่านการปรับปรุงรอบ มคอ. ในระบบ'}

}

/* ---- ตรวจความพร้อมก่อนเปิดสอน ---- */
function renderReady() {
  const p = PROGRAM_REG[sel], a = actualOf(p);
  const fee = FEES.find(f => f.prog === p.prog && f.lvl === p.lvl);
  const checks = [
    { ok: !!p.code, l: 'มีรหัสหลักสูตรจากระบบทะเบียน', d: `program_code = ${p.code}`, go: null },
    { ok: true, l: 'ผูกหน่วยงานระดับการศึกษาแล้ว', d: `${p.fac} — ${p.lvl}`, go: 'W17-master-data.html' },
    { ok: !!liveVer(p), l: 'มีรุ่นหลักสูตรที่มีผล', d: `รุ่น ${liveVer(p).v} · มีผล ${liveVer(p).from}`, go: null },
    { ok: !!(fee && fee.status === 'APPROVED'),
      l: 'มีอัตราค่าธรรมเนียมที่อนุมัติแล้ว',
      d: fee ? (fee.status === 'APPROVED' ? `${fmtN(fee.rate)} บาท/ปี` : `มีอยู่แต่สถานะ ${FEE_STATUS[fee.status].l}`) : 'ยังไม่มีรายการค่าธรรมเนียม',
      go: 'W8-tuition.html' },
    { ok: !!(a && a.Q > 0), l: 'มีจำนวนนิสิตจากระบบทะเบียน',
      d: a ? (a.Q > 0 ? `${fmtN(a.Q)} คน ณ วันตัดยอด` : 'Q = 0 — คำนวณ R และ AVC ไม่ได้') : 'ยังไม่มีนิสิตลงทะเบียน',
      go: 'W9-cost-data.html' },
  ];
  const pass = checks.filter(c => c.ok).length;

  document.getElementById('ready').innerHTML =
    `<div class="sub-note" style="margin:0 0 10px">
       <b>${p.prog}</b> (${p.lvl}) — ผ่าน <b class="num" style="color:${pass === checks.length ? 'var(--green)' : 'var(--gold)'}">${pass}/${checks.length}</b> ข้อ
     </div>` +
    checks.map(c => `<div style="display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:start;
        padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;color:${c.ok ? 'var(--green2)' : 'var(--red2)'}">${c.ok ? '✓' : '✕'}</div>
      <div><div style="font-size:12px;font-weight:600;color:${c.ok ? 'var(--text)' : 'var(--red)'}">${c.l}</div>
        <div class="rule-desc">${c.d}</div></div>
      ${!c.ok && c.go ? `<a class="btn btn-sm" href="${c.go}">ไปแก้ →</a>` : ''}
    </div>`).join('');
}

};

    html: "<div class=\"page\">\n\n  <div class=\"bm-note\">\n    <span>ℹ️</span>\n    <span>ข้อมูลหลักที่เหลืออีก 3 ชุด — <b>โครงสร้างหน่วยงาน</b> · <b>งวดปีงบประมาณ</b> · <b>ประเภทนิสิต</b>\n      ทั้งสามชุดถูกอ้างโดยทุกตารางที่เก็บตัวเลข ถ้าตั้งผิดหรือเปลี่ยนย้อนหลัง ตัวเลขทั้งระบบจะเปลี่ยนตาม\n      · ส่วนหลักสูตรอยู่ที่ <a href=\"W16-programs.html\" style=\"color:var(--navy)\">W16</a></span>\n  </div>\n\n  <div class=\"toolbar\">\n    <div class=\"seg\" id=\"tabs\">\n      <button class=\"on\" data-t=\"org\">🏛 โครงสร้างหน่วยงาน</button>\n      <button data-t=\"period\">📅 งวดปีงบประมาณ</button>\n      <button data-t=\"stype\">👥 ประเภทนิสิต</button>\n    </div>\n    <span class=\"grow\"></span>\n    <button class=\"btn primary\" id=\"btn-add\">+ เพิ่มรายการ</button>\n  </div>\n\n  <!-- ══════════ หน่วยงาน ══════════ -->\n  <div id=\"t-org\">\n    <div class=\"kpis\">\n      <div class=\"kpi cn\"><div class=\"kpi-label\">หน่วยงานทั้งหมด</div><div class=\"kpi-val num\" style=\"color:var(--navy2)\" id=\"o-all\">—</div><div class=\"kpi-unit\">รายการในทะเบียน</div></div>\n      <div class=\"kpi cg\"><div class=\"kpi-label\">หน่วยที่ผลิตบัณฑิต</div><div class=\"kpi-val num\" style=\"color:var(--green2)\" id=\"o-aca\">—</div><div class=\"kpi-unit\">is_academic = true</div></div>\n      <div class=\"kpi co\"><div class=\"kpi-label\">หน่วยสนับสนุน</div><div class=\"kpi-val num\" style=\"color:var(--gold)\" id=\"o-sup\">—</div><div class=\"kpi-unit\">ต้องปันส่วนต้นทุนออกทั้งหมด</div></div>\n      <div class=\"kpi cr\"><div class=\"kpi-label\">ยังไม่ผูกรหัส ERP</div><div class=\"kpi-val num\" style=\"color:var(--red2)\" id=\"o-noerp\">—</div><div class=\"kpi-unit\">รับต้นทุนจากระบบต้นทางไม่ได้</div></div>\n    </div>\n\n    <div class=\"grid\" style=\"grid-template-columns:1.6fr 1fr\">\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n          <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ทะเบียนหน่วยงาน 3 ระดับ</div>\n          <div class=\"card-sub\">ตาราง <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">org_unit</code>\n            + <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">org_unit_map</code>\n            · ตัวอย่าง 10 รายการจากทั้งหมด 58 รายการ</div>\n        </div>\n        <table class=\"tbl dense\">\n          <thead><tr>\n            <th style=\"width:88px\">รหัส</th><th>ชื่อหน่วยงาน</th><th style=\"width:120px\">ระดับ</th>\n            <th style=\"width:90px\">รหัส ERP</th><th style=\"width:96px\">ประเภท</th><th style=\"width:78px\">สถานะ</th>\n          </tr></thead>\n          <tbody id=\"org-tb\"></tbody>\n        </table>\n      </div>\n\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--gold2)\"></span>ทำไมโครงสร้างต้องมี 3 ระดับ</div>\n          <div class=\"card-sub\">มหาวิทยาลัย → คณะ → ระดับการศึกษา</div></div></div>\n        <div class=\"sub-note\" style=\"margin:0 0 12px\">\n          ชุดข้อมูลต้นฉบับ<b>ไม่มีคอลัมน์ภาควิชา</b> ระบบจึงใช้ <b>ระดับการศึกษา</b> (ปริญญาตรี / บัณฑิตศึกษา)\n          เป็นชั้นกลางแทน ซึ่งตรงกับวิธีที่ Excel ปันส่วนต้นทุนสำนักงานเลขานุการอยู่แล้ว\n          — ถ้าภายหลังมีตารางจับคู่หลักสูตร → ภาควิชาจริง สลับชั้นกลางได้ทันทีโดยไม่ต้องแก้สูตร\n        </div>\n        <div class=\"rule-row\"><div><div class=\"rule-name\">หลักสูตรผูกที่ระดับการศึกษา</div>\n          <div class=\"rule-desc\"><code style=\"font-family:'Manrope',monospace\">program.org_unit_id</code> ชี้ที่ <code style=\"font-family:'Manrope',monospace\">EDUCATION_LEVEL</code> ไม่ใช่ระดับคณะ</div></div>\n          <span class=\"chip chip-n\">บังคับ</span></div>\n        <div class=\"rule-row\"><div><div class=\"rule-name\">หน่วยสนับสนุนต้องปันออกให้หมด</div>\n          <div class=\"rule-desc\">สำนักงานเลขานุการและสถาบันวิจัยไม่มีนิสิต เป็น cost pool ที่ต้องกระจายลงหลักสูตร ไม่งั้นต้นทุนจะค้าง</div></div>\n          <span class=\"chip chip-o\">is_academic = false</span></div>\n        <div class=\"rule-row\"><div><div class=\"rule-name\">การจับคู่รหัส ERP มีช่วงเวลา</div>\n          <div class=\"rule-desc\">รหัส ERP เดียวกันเปลี่ยนหน่วยงานปลายทางตามปีได้ ระบบกันช่วงเวลาคาบเกี่ยวไว้แล้ว</div></div>\n          <span class=\"chip chip-g\">ตรวจอัตโนมัติ</span></div>\n        <div class=\"caveat\" style=\"margin:14px 0 0\">\n          <span>⚠️</span>\n          <span><b>วิทยาลัยนวัตกรรมดิจิทัล</b> ตั้งใหม่ปี 2570 แต่ยังไม่ผูกรหัส ERP —\n            ต้นทุนที่ส่งมาจากระบบต้นทางจะจับคู่ไม่ได้ และไปโผล่เป็นธง\n            <code>MISSING_DRIVER</code> ที่ <a href=\"W13-exceptions.html\">W13</a></span>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ══════════ งวด ══════════ -->\n  <div id=\"t-period\" style=\"display:none\">\n    <div class=\"grid\" style=\"grid-template-columns:1.5fr 1fr\">\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n          <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>งวดปีงบประมาณ</div>\n          <div class=\"card-sub\">ตาราง <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">dim_period</code>\n            · ทุกตัวเลขในระบบผูกกับ <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">period_id</code></div>\n        </div>\n        <div class=\"tbl-scroll\">\n          <table class=\"tbl dense\">\n            <thead><tr>\n              <th style=\"width:74px\">ปีงบ</th><th style=\"width:82px\">ปีการศึกษา</th><th>ช่วงงวด</th>\n              <th style=\"width:104px\">วันตัดยอดนิสิต</th><th>สถานะนิสิตที่นับ</th><th style=\"width:86px\">สถานะ</th>\n            </tr></thead>\n            <tbody id=\"per-tb\"></tbody>\n          </table>\n        </div>\n      </div>\n\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--red2)\"></span>สองอย่างที่ต้องกำหนดให้ชัด</div>\n          <div class=\"card-sub\">ถ้าไม่ตั้ง จะได้ตัวเลขที่เทียบข้ามปีไม่ได้</div></div></div>\n\n        <div style=\"border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:11px\">\n          <div style=\"font-size:12.5px;font-weight:700;margin-bottom:5px\">1. ปีงบประมาณ ไม่เท่ากับ ปีการศึกษา</div>\n          <div style=\"font-size:11.5px;color:var(--text2);line-height:1.7\">\n            ต้นทุนมาเป็น<b>ปีงบประมาณ</b> (ต.ค.–ก.ย.) แต่จำนวนนิสิตและค่าธรรมเนียมเป็น<b>ปีการศึกษา</b>\n            ระบบจึงบังคับให้ทุกงวดระบุทั้งสองค่า — ถ้าปล่อยว่าง กติกาที่ผูกกับปีการศึกษา\n            (W14, W15) จะหาปีไม่เจอแบบเงียบๆ\n          </div>\n        </div>\n\n        <div style=\"border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:11px\">\n          <div style=\"font-size:12.5px;font-weight:700;margin-bottom:5px\">2. วันตัดยอดนิสิต และสถานะที่นับเป็น Q</div>\n          <div style=\"font-size:11.5px;color:var(--text2);line-height:1.7\">\n            Q เป็นตัวหารของทั้ง R และ AVC — ตัดยอดคนละวันหรือนับนิสิตลาพักต่างกัน\n            ทำให้ Q\\* เปลี่ยนทั้งระบบ · ค่าที่ตั้งไว้จะถูกล็อกติดไปกับรอบคำนวณ\n            (<a href=\"W11-allocation-run.html\" style=\"color:var(--navy2)\">W11</a>) เพื่อให้คำนวณซ้ำได้ผลเดิม\n          </div>\n        </div>\n\n        <div class=\"caveat\" style=\"margin:0\">\n          <span>⚠️</span>\n          <span>ยังค้างอยู่ใน <code>MAPPING.md</code> — ไฟล์ต้นฉบับใช้ <b>งบประมาณ 2568</b>\n            คู่กับ <b>ค่าเสื่อมราคารวม 2567</b> ซึ่งเป็นคนละปี\n            ต้องยืนยันว่างวด 2568 ใช้ค่าเสื่อมของปีไหน ก่อนปิดงวด</span>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ══════════ ประเภทนิสิต ══════════ -->\n  <div id=\"t-stype\" style=\"display:none\">\n    <div class=\"grid\" style=\"grid-template-columns:1.3fr 1fr\">\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div style=\"padding:16px 18px;border-bottom:1px solid var(--border)\">\n          <div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ประเภทนิสิต</div>\n          <div class=\"card-sub\">ตาราง <code style=\"font-family:'Manrope',monospace;font-size:10.5px\">student_type</code>\n            · ค่าธรรมเนียมและเงินสมทบคิดแยกตามประเภท (FR-11)</div>\n        </div>\n        <table class=\"tbl dense\">\n          <thead><tr>\n            <th style=\"width:96px\">รหัส</th><th style=\"width:96px\">ภาค</th><th style=\"width:88px\">สัญชาติ</th>\n            <th class=\"num\" style=\"width:96px\">นิสิต 2568</th><th>หมายเหตุ</th>\n          </tr></thead>\n          <tbody id=\"st-tb\"></tbody>\n          <tfoot><tr><td colspan=\"3\">รวม</td><td class=\"num\" id=\"st-sum\">—</td><td class=\"muted\" id=\"st-chk\"></td></tr></tfoot>\n        </table>\n      </div>\n\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--gold2)\"></span>ประเภทนิสิตกระทบอะไรบ้าง</div></div></div>\n        <div class=\"rule-row\"><div><div class=\"rule-name\">อัตราค่าธรรมเนียม (W8)</div>\n          <div class=\"rule-desc\">หลักสูตรเดียวกันมีได้หลายอัตรา — ธุรกิจระหว่างประเทศ (นานาชาติ) คิดนิสิตไทย 90,000 และต่างชาติ 110,000 บาท/ปี</div></div>\n          <span class=\"chip chip-n\">TR</span></div>\n        <div class=\"rule-row\"><div><div class=\"rule-name\">เงินสมทบรายการหลัก (FR-11)</div>\n          <div class=\"rule-desc\">หักตาม master ค่าธรรมเนียม × จำนวนนิสิตแยกตามประเภท ไม่ใช่ยอดรวม</div></div>\n          <span class=\"chip chip-o\">TVC</span></div>\n        <div class=\"rule-row\"><div><div class=\"rule-name\">เงินสมทบมหาวิทยาลัย (FR-12)</div>\n          <div class=\"rule-desc\">2,235 บาท/คน/เทอม · อัตราเปลี่ยนได้ทุกปี จึงเก็บเป็นค่าตั้งรายปีไม่ใช่ค่าคงที่ในโค้ด</div></div>\n          <span class=\"chip chip-o\">TVC</span></div>\n        <div class=\"sub-note\" style=\"margin:14px 0 0\">\n          <b>ห้ามเพิ่มประเภทนิสิตย้อนหลังในงวดที่ปิดแล้ว</b> — ยอดรวมนิสิตของงวดจะไม่ตรงกับที่เคยคำนวณ\n          และตรวจยอดกลับต้นทางที่ <a href=\"W12-reconciliation.html\" style=\"color:var(--navy2)\">W12</a> จะไม่ผ่าน\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"ins\">\n    <h3>ทำไมข้อมูลหลักต้องมีช่วงเวลามีผล ไม่ใช่แก้ทับ</h3>\n    <ul>\n      <li class=\"crit\">คณะเปลี่ยนชื่อ ควบรวม หรือแยกออก เกิดขึ้นจริงทุกไม่กี่ปี — ถ้าแก้ทับ รายงานปีเก่าจะแสดงชื่อใหม่ทั้งที่ตอนนั้นยังไม่มีหน่วยงานนี้</li>\n      <li class=\"warn\">รหัส ERP เดียวกันถูกย้ายไปหน่วยงานอื่นได้ ระบบจึงกันช่วงเวลาคาบเกี่ยวไว้ที่ระดับฐานข้อมูล ไม่ใช่แค่เตือนบนหน้าจอ</li>\n      <li class=\"info\">ทุกตารางที่เก็บตัวเลขอ้าง <code style=\"font-family:'Manrope',monospace\">period_id</code> · <code style=\"font-family:'Manrope',monospace\">org_unit_id</code> · <code style=\"font-family:'Manrope',monospace\">program_version_id</code> ครบทั้งสามเสมอ</li>\n      <li class=\"ok\">ผลที่ได้คือตอบได้ว่า \"ตัวเลขปี 2567 คำนวณด้วยโครงสร้างหน่วยงานแบบไหน กติกาเวอร์ชันใด และนับนิสิต ณ วันไหน\"</li>\n    </ul>\n  </div>\n\n</div>\n",
    init: function () {



/* ---- แท็บ ---- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['org', 'period', 'stype'].forEach(t =>
    document.getElementById('t-' + t).style.display = t === b.dataset.t ? '' : 'none');
});

/* ---- หน่วยงาน ---- */
document.getElementById('o-all').textContent = ORG_UNITS.length;
document.getElementById('o-aca').textContent = ORG_UNITS.filter(o => o.academic).length;
document.getElementById('o-sup').textContent = ORG_UNITS.filter(o => !o.academic).length;
document.getElementById('o-noerp').textContent = ORG_UNITS.filter(o => !o.erp).length;

const INDENT = { UNIVERSITY: 0, FACULTY: 1, EDUCATION_LEVEL: 2 };
document.getElementById('org-tb').innerHTML = ORG_UNITS.map(o => `
  <tr>
    <td><code style="font-family:'Manrope',monospace;font-size:10.5px;color:var(--navy)">${o.code}</code></td>
    <td class="wrap" style="padding-left:${10 + INDENT[o.level] * 16}px">
      <b>${o.name}</b>${o.note ? `<div class="muted">${o.note}</div>` : ''}</td>
    <td class="muted">${ORG_LEVEL_LABEL[o.level]}</td>
    <td>${o.erp
      ? `<code style="font-family:'Manrope',monospace;font-size:10.5px">${o.erp}</code>`
      : '<span class="flag flag-drv">ยังไม่ผูก</span>'}</td>
    <td><span class="chip ${o.academic ? 'chip-g' : 'chip-o'}">${o.academic ? 'ผลิตบัณฑิต' : 'หน่วยสนับสนุน'}</span></td>
    <td><span class="st ${o.status === 'APPROVED' ? 'st-appr' : 'st-draft'}"><span class="st-dot"></span>${o.status === 'APPROVED' ? 'อนุมัติ' : 'ร่าง'}</span></td>
  </tr>`).join('');

/* ---- งวด ---- */
document.getElementById('per-tb').innerHTML = PERIODS.map(p => `
  <tr>
    <td class="num" style="font-weight:700;color:var(--navy)">${p.fy}</td>
    <td class="num">${p.ay}</td>
    <td class="muted">${p.start} – ${p.end}</td>
    <td class="muted">${p.snap || '<span style="color:var(--red)">ยังไม่กำหนด</span>'}</td>
    <td class="wrap muted">${p.rule}</td>
    <td><span class="st ${p.state === 'ปิดงวดแล้ว' ? 'st-appr' : 'st-run'}"><span class="st-dot"></span>${p.state}</span></td>
  </tr>`).join('');

/* ---- ประเภทนิสิต ---- */
document.getElementById('st-tb').innerHTML = STUDENT_TYPES.map(s => `
  <tr>
    <td><code style="font-family:'Manrope',monospace;font-size:10.5px;color:var(--navy)">${s.code}</code></td>
    <td>${s.grp}</td>
    <td><span class="chip ${s.nat === 'ไทย' ? 'chip-n' : 'chip-g'}">${s.nat}</span></td>
    <td class="num" style="font-weight:700">${fmtN(s.n)}</td>
    <td class="wrap muted">${s.note || '—'}</td>
  </tr>`).join('');

const stSum = STUDENT_TYPES.reduce((a, s) => a + s.n, 0);
document.getElementById('st-sum').textContent = fmtN(stSum);
document.getElementById('st-chk').innerHTML = stSum === RAW.UNI.Q
  ? `<span style="color:var(--green)">✓ ตรงกับยอดนิสิตรวมของงวด (${fmtN(RAW.UNI.Q)} คน)</span>`
  : `<span style="color:var(--red)">✕ ต่างจากยอดนิสิตรวมของงวด ${fmtN(Math.abs(stSum - RAW.UNI.Q))} คน — ตรวจยอดจะไม่ผ่าน</span>`;

document.getElementById('btn-add').onclick = () => {
  const on = document.querySelector('#tabs button.on').textContent.trim();
  alert('Mockup — ปุ่มนี้จะเปิดฟอร์มเพิ่ม' + on.replace(/^[^\s]+\s/, ''));
};


    },
  },

  'W19-erp-accounts': {
    w: "W19",
    title: "ผังบัญชี 4 ระดับ",
