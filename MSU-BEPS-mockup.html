<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSU-BEPS | ระบบวิเคราะห์จุดคุ้มทุน — ต้นแบบหน้าจอ W0–W19</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* ══ ธีม: MSU Starter Kit (Materio MUI) ══════════════════════════════
     ค่าทั้งหมดยกมาจาก src/@core/theme ของ starter kit
     ชื่อตัวแปรคงเดิมทุกตัว หน้าจอทั้ง 20 หน้าจึงเปลี่ยนธีมตามโดยไม่ต้องแก้ทีละหน้า

     สีหลักของธีม  primary #6D4CFF — ตรงกับ --navy2 เดิมพอดี
     สีฐานข้อความ/เส้น  rgb(46 38 61) = #2E263D (mainColorChannels.light)
     ════════════════════════════════════════════════════════════════════ */

  /* พื้นหลัง — background.default · chatBg · defaultBg(trackBg) · paper */
  --bg:#f4f5fa;--bg2:#f7f6fa;--bg3:#f0eff0;--card:#ffffff;

  /* primary — dark · main · light · พื้นอ่อน (lighterOpacity 8%) */
  --navy:#5938e0;--navy2:#6d4cff;--navy3:#8b6fff;--navy4:rgba(109,76,255,.10);

  /* warning/success/error — ค่า text (--gold/--green/--red) ใช้เฉดเข้มกว่า main ของธีม
     เพราะธีมตั้งใจให้ตัวอักษรใช้สี main บนพื้นโปร่ง 8-16% ซึ่ง contrast ต่ำกว่าเกณฑ์ WCAG
     เฉดที่ใช้คงโทนสีเดิมของธีมไว้ แต่เข้มพอให้อ่านออกจริง */
  --gold:#8f6400;--gold2:#ffb400;--gold3:#ffc333;--gold4:rgba(255,180,0,.16);

  /* success */
  --green:#337a00;--green2:#56ca00;--green3:rgba(86,202,0,.16);

  /* error */
  --red:#b83236;--red2:#ff4c51;--red3:rgba(255,76,81,.16);

  /* ข้อความ — ไล่ความทึบจากสีฐานเดียวกัน (.9 / .7 / .55 / .4) */
  --text:rgba(46,38,61,.9);--text2:rgba(46,38,61,.7);
  --text3:rgba(46,38,61,.63);--text4:rgba(46,38,61,.4);

  /* เส้นขอบ — divider 12% */
  --border:rgba(46,38,61,.12);--border2:rgba(46,38,61,.22);

  /* เงา — customShadows.xs และ .md */
  --shadow:0 2px 4px rgba(46,38,61,.16);
  --shadow2:0 4px 10px rgba(46,38,61,.20);

  /* shape.borderRadius = 6 */
  --sidebar:250px;--radius:6px;--radius2:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun','IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.num{font-family:'Manrope','Sarabun',sans-serif;font-variant-numeric:tabular-nums}
/* Sidebar — light theme (matches reference) */
#sidebar{width:var(--sidebar);min-height:100vh;background:linear-gradient(180deg,#ffffff,#fbfcfe);border-right:1px solid rgba(46,38,61,0.08);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;box-shadow:1px 0 0 rgba(46,38,61,0.04),2px 0 12px rgba(46,38,61,0.04);overflow-y:auto}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(46,38,61,0.08);display:flex;align-items:center;gap:10px}
.sb-logo-img{width:46px;height:46px;border-radius:8px;object-fit:contain;background:#fff;padding:3px;flex-shrink:0}
.sb-logo-tag{font-size:9.5px;letter-spacing:.14em;color:var(--navy2);text-transform:uppercase;font-weight:700;margin-bottom:3px}
.sb-logo-title{font-size:17px;font-weight:800;font-family:'Manrope','IBM Plex Sans Thai',sans-serif;color:var(--text);letter-spacing:-.02em}
.sb-logo-sub{font-size:10.5px;color:var(--text3);margin-top:3px;line-height:1.5}
.sb-nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:1px}
.sb-grp{margin-bottom:2px}
.sb-group{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.08em;color:var(--navy2);text-transform:uppercase;font-weight:800;padding:9px 12px;margin-top:2px;cursor:pointer;border-radius:8px;transition:background .15s;user-select:none}
.sb-group:hover{background:var(--navy4)}
.sb-caret{display:inline-block;font-size:9px;transition:transform .22s ease;flex-shrink:0;opacity:.75}
.sb-grp.open .sb-caret{transform:rotate(90deg)}
.sb-count{margin-left:auto;font-size:9px;font-weight:700;background:var(--bg3);color:var(--text3);padding:1px 6px;border-radius:9px;min-width:16px;text-align:center;letter-spacing:0}
.sb-grp.open .sb-count{background:var(--navy4);color:var(--navy2)}
.sb-grp.has-active .sb-group{color:var(--navy2)}
.sb-grp.has-active:not(.open) .sb-count{background:var(--navy2);color:#fff}
.sb-sub{overflow:hidden;max-height:0;transition:max-height .26s ease;display:flex;flex-direction:column;gap:2px}
.sb-grp.open .sb-sub{max-height:340px}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 12px 9px 18px;border-radius:var(--radius2);cursor:pointer;transition:all .18s;font-size:13.5px;color:var(--text3);font-weight:500;border:1px solid transparent;position:relative}
.sb-item:hover{background:#f3f5fa;color:var(--text)}
.sb-item.active{background:linear-gradient(90deg,var(--navy4),rgba(237,233,254,0.4));color:var(--navy2);border-color:rgba(109,76,255,0.20)}
.sb-item.active::before{content:'';position:absolute;left:-1px;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:var(--navy2)}
.sb-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#f3f5fa}
.sb-item.active .sb-icon{background:var(--navy4)}
.sb-footer{padding:12px 14px;border-top:1px solid rgba(46,38,61,0.08)}
.sb-footer p{font-size:9px;color:var(--text3);line-height:1.7}
.sb-ver{font-size:9px;color:var(--navy2);margin-top:4px;opacity:.8;font-weight:600}
.credit-section{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border2)}
.credit-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text4);font-weight:700;margin-bottom:6px}
.credit-item{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.credit-avatar{width:24px;height:24px;border-radius:50%;background:var(--navy4);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.credit-name{font-size:10px;font-weight:700;color:var(--text2)}
.credit-role{font-size:8.5px;color:var(--text4)}
/* Main */
#main{margin-left:var(--sidebar);min-height:100vh}
#topbar{position:sticky;top:0;background:rgba(245,247,251,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:16px;z-index:10;flex-wrap:wrap}
.tb-page{font-size:17px;font-weight:700;color:var(--text)}
.tb-spacer{flex:1}
.bm-wrap{display:flex;align-items:center;gap:8px}
.bm-lbl{font-size:11px;color:var(--text3);font-weight:600}
.bm-toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:3px}
.bm-opt{border:none;background:none;padding:6px 13px;border-radius:7px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--text3);cursor:pointer;transition:.15s}
.bm-opt.on{background:var(--card);color:var(--navy);box-shadow:var(--shadow)}
.badge{padding:6px 13px;border-radius:8px;font-size:12px;font-weight:700}
.badge-navy{background:var(--navy4);color:var(--navy)}
.badge-gold{background:var(--gold4);color:var(--gold)}
.page{display:none;padding:22px 26px 60px}
.page.active{display:block}
.bm-note{font-size:11px;color:var(--text3);background:var(--navy4);border:1px solid rgba(55,48,163,.14);border-radius:8px;padding:8px 13px;margin-bottom:16px;display:flex;gap:8px;align-items:center}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi-label{font-size:10.5px;color:var(--text3);font-weight:600;margin-bottom:6px}
.kpi-val{font-size:23px;font-weight:700;font-family:'Manrope','Sarabun';color:var(--text);letter-spacing:-.5px}
.kpi-unit{font-size:9.5px;color:var(--text4);margin-top:2px;font-weight:500}
.kpi.cg{border-top:3px solid var(--green2)}.kpi.co{border-top:3px solid var(--gold2)}
.kpi.cr{border-top:3px solid var(--red2)}.kpi.cn{border-top:3px solid var(--navy2)}
/* Card & grid */
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-2{grid-template-columns:1.5fr 1fr}.g-2e{grid-template-columns:1fr 1fr}
@media(max-width:1050px){.g-2,.g-2e{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title .dot{width:9px;height:9px;border-radius:50%}
.card-sub{font-size:10.5px;color:var(--text3);margin-top:2px;font-weight:500}
.chip{padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.chip-n{background:var(--navy4);color:var(--navy)}.chip-g{background:var(--green3);color:var(--green)}.chip-r{background:var(--red3);color:var(--red)}.chip-o{background:var(--gold4);color:var(--gold)}
.ch{position:relative;width:100%}
.leg-row{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);font-weight:500}
.leg-sq{width:11px;height:11px;border-radius:3px;display:inline-block}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600;border-bottom:2px solid var(--border2);position:sticky;top:0;background:var(--card)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl tbody tr:hover{background:var(--bg2)}
.tbl .num{text-align:right;font-family:'Manrope','Sarabun'}
/* Drill-down tree */
.tree-row{display:grid;grid-template-columns:minmax(240px,2.4fr) repeat(6,1fr) 88px;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;transition:.12s}
.tree-head{grid-template-columns:minmax(240px,2.4fr) repeat(6,1fr) 88px;display:grid;gap:6px;padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:700;border-bottom:2px solid var(--border2);position:sticky;top:0;background:var(--card);z-index:2}
.tree-row .num{text-align:right;font-family:'Manrope','Sarabun';font-variant-numeric:tabular-nums}
.tree-row.lvl-fac{background:var(--bg2);cursor:pointer;font-weight:700}
.tree-row.lvl-fac:hover{background:var(--navy4)}
.tree-row.lvl-dep{cursor:pointer;background:#fbfcfe}
.tree-row.lvl-dep:hover{background:var(--bg3)}
.tree-row.lvl-prog{background:var(--card)}
.tree-row.lvl-prog:hover{background:var(--bg2)}
.tw-name{display:flex;align-items:center;gap:8px;overflow:hidden}
.tw-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{width:16px;height:16px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:var(--text3);transition:transform .15s;font-size:10px}
.caret.open{transform:rotate(90deg)}
.pad-1{padding-left:10px}.pad-2{padding-left:30px}
.st-badge{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:6px;text-align:center;justify-self:end;white-space:nowrap}
.st-ok{background:var(--green3);color:var(--green)}
.st-loss{background:var(--red3);color:var(--red)}
.st-no{background:#f1f3f5;color:var(--text3)}
.pos{color:var(--green)}.neg{color:var(--red)}
/* breakeven search */
.be-search-wrap{position:relative;flex:1;min-width:240px;max-width:440px}
.be-search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6;pointer-events:none}
.be-search{width:100%;font-family:inherit;font-size:12.5px;padding:9px 32px 9px 34px;border:1px solid var(--border2);border-radius:9px;background:var(--card);color:var(--text);font-weight:500;transition:.15s}
.be-search:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--navy4)}
.be-search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text4);cursor:pointer;display:none;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px}
.be-search-clear:hover{background:var(--bg3);color:var(--text2)}
.be-search-wrap.has-val .be-search-clear{display:block}
.be-qbtn{font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:16px;border:1px solid var(--border2);background:var(--card);color:var(--text2);cursor:pointer;transition:.15s}
.be-qbtn:hover{background:var(--navy4);border-color:var(--navy2);color:var(--navy)}
.be-qbtn.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.tree-row mark{background:#fff3bf;color:var(--text);padding:0 1px;border-radius:2px;font-weight:700}
.be-empty{padding:40px 20px;text-align:center;color:var(--text4);font-size:13px}
.mini{height:6px;border-radius:4px;background:var(--bg3);overflow:hidden;margin-top:4px}
.mini > i{display:block;height:100%;border-radius:4px}
/* insight */
.ins{background:linear-gradient(180deg,#fff,#fbfcff);border:1px solid var(--border);border-left:4px solid var(--navy2);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.ins h3{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--navy)}
.ins ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.ins li{font-size:12px;color:var(--text2);padding-left:18px;position:relative;line-height:1.55}
.ins li:before{content:'▸';position:absolute;left:0;color:var(--navy2);font-weight:700}
.ins b{color:var(--text);font-weight:700}
.method p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px}
.method h3{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--navy)}
.formula{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 18px;font-family:'Manrope',monospace;font-size:14px;color:var(--navy);margin:10px 0;text-align:center;font-weight:600}
.tag{display:inline-block;background:var(--navy4);color:var(--navy);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;font-family:'Manrope'}
.selrow{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
select{font-family:inherit;font-size:12.5px;padding:8px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text);font-weight:500;cursor:pointer;max-width:100%}
#ch-fac{max-width:340px}#ch-prog{max-width:440px}#ch-lvl{min-width:120px}
#ch-fac,#ch-prog{text-overflow:ellipsis}
.pill{font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--bg3);color:var(--text2)}
/* per-head bar list */
.bar-item{margin-bottom:9px}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.bar-name{font-size:11px;color:var(--text2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.bar-val{font-weight:700;font-family:'Manrope','Sarabun'}
.bar-track{height:7px;border-radius:4px;background:var(--bg3);overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:10px;font-weight:700;background:var(--bg3);color:var(--text3);font-family:'Manrope'}
.rank.r1{background:#fef3c7;color:#a67500}.rank.r2{background:#e2e8f0;color:#5a5169}.rank.r3{background:#fce7d6;color:#c2410c}
/* heatmap */
.hm-wrap{overflow-x:auto}
.hm-table{border-collapse:separate;border-spacing:3px;width:100%;min-width:880px}
.hm-table th{font-size:9.5px;color:var(--text3);font-weight:700;text-align:center;padding:4px;line-height:1.3}
.hm-table th.col-name{text-align:left;min-width:150px}
.hm-table td{text-align:center;border-radius:7px;padding:0}
.hm-table td.col-name{background:var(--bg2)!important;text-align:left;padding:6px 8px}
.hm-cell{padding:8px 4px}
.hm-val{font-size:11px;font-weight:700;font-family:'Manrope','Sarabun'}
/* metric buttons */
.metric-btn{border:1px solid var(--border2);background:var(--card);color:var(--text3);padding:5px 11px;border-radius:7px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.metric-btn:hover{background:var(--bg3)}
.metric-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scatter-wrap{position:relative;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1050px){.g2{grid-template-columns:1fr}}
.sec-title{font-size:15px;font-weight:700;margin-bottom:14px}
/* insight variants */
.ins li.crit:before{content:'⚠';color:var(--red)}
.ins li.warn:before{content:'▸';color:var(--gold)}
.ins li.ok:before{content:'✓';color:var(--green)}
.ins li.info:before{content:'▸';color:var(--navy2)}
/* formula/method */
.fm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.fm-card h4{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.fm-eq{background:var(--navy);color:#fff;border-radius:8px;padding:12px 16px;font-family:'Manrope',monospace;font-size:15px;text-align:center;font-weight:600;margin:8px 0;letter-spacing:.3px}
.fm-eq.gold{background:linear-gradient(135deg,#a67500,#ffb400)}
.fm-card p{font-size:12px;color:var(--text2);line-height:1.65;margin-bottom:4px}
.fm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.fm-grid2{grid-template-columns:1fr}}
.vartbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.vartbl th{background:var(--navy4);color:var(--navy);text-align:left;padding:8px 10px;font-weight:700;font-size:10.5px}
.vartbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.vartbl td:first-child{font-family:'Manrope';font-weight:700;color:var(--navy);white-space:nowrap}
.refs{font-size:11px;color:var(--text2);line-height:1.7}
.refs div{padding:5px 0;border-bottom:1px dashed var(--border)}
.classbox{border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.classbox .tag{margin:2px 3px 2px 0}
/* self-calc forms */
.inp{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13px;color:var(--text);background:var(--bg2);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(37,87,167,.12)}
.inp-label{font-size:11px;font-weight:700;color:var(--navy2);display:block;margin-bottom:4px}
.btn-primary{width:100%;padding:11px;background:var(--navy2);border:none;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.04em;transition:background .15s}
.btn-primary:hover{background:var(--navy3);box-shadow:0 4px 12px rgba(109,76,255,.30)}
.btn-add-row{width:100%;padding:7px;border:1px dashed var(--border2);background:transparent;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:12px;color:var(--navy2);cursor:pointer;margin-top:6px}
.btn-del{width:24px;height:24px;border:none;background:var(--red3);color:var(--red2);border-radius:6px;cursor:pointer;font-size:16px;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center}
.cost-sel{flex:1.6;min-width:0;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:12.5px;color:var(--text);background:var(--bg2);outline:none;cursor:pointer;max-width:none}
.cost-sel:hover{border-color:var(--navy2)}
.cost-custom{display:none;flex:1.6;min-width:0;padding:8px 10px;border:1px solid var(--navy2);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:12.5px;color:var(--text);background:#fff;outline:none}
.cost-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.cost-row:last-child{border-bottom:none}
.cost-amt{flex:0 0 140px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-family:'Manrope','Sarabun',sans-serif;font-size:12.5px;color:var(--navy);font-weight:600;background:var(--navy4);text-align:right;outline:none;max-width:none}
.cost-amt:focus{border-color:var(--navy2);background:#fff}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-lbl{font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-weight:700}
.stat-val{font-size:13px;font-weight:700;font-family:'Manrope','Sarabun',sans-serif}
/* PDF overlay */
#pdf-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:flex-start;justify-content:center;padding:20px 20px 90px;overflow-y:auto}
.pdf-print-btn{border:none;border-radius:10px;padding:11px 26px;font-family:'Sarabun',sans-serif;font-size:13.5px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(109,76,255,.4);letter-spacing:.04em}
@media print{#sidebar,#topbar{display:none!important}}
/* report page styles (preview + capture) */
#pdf-report{display:flex;flex-direction:column;align-items:center;gap:22px;margin:auto}
.pdf-page{width:794px;min-height:1123px;padding:40px 48px;box-sizing:border-box;position:relative;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.15);border-radius:4px;color:#2e263d;font-family:'Sarabun','IBM Plex Sans Thai',sans-serif}
.pdf-header{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:3.5px solid #5938e0;margin-bottom:18px}
.pdf-logo{width:52px;height:52px;border-radius:8px;object-fit:contain;background:#f0f4fa;padding:3px;flex-shrink:0}
.pdf-header-text h1{font-size:13.5px;font-weight:800;color:#5938e0;font-family:'Manrope','IBM Plex Sans Thai',sans-serif;margin:0 0 2px}
.pdf-header-text p{font-size:9.5px;color:#6f6880;margin:0}
.pdf-title{font-size:18px;font-weight:800;color:#5938e0;margin:0 0 4px;font-family:'Manrope','IBM Plex Sans Thai',sans-serif}
.pdf-subtitle{font-size:11px;color:#6f6880;margin:0 0 16px}
.pdf-sec{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6d4cff;margin:16px 0 7px;display:flex;align-items:center;gap:7px}
.pdf-sec::before{content:'';display:block;width:3px;height:11px;background:#6d4cff;border-radius:2px;flex-shrink:0}
.pdf-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.pdf-info-box{background:#f8fafd;border:1px solid #e2e8f2;border-radius:7px;padding:9px 13px}
.pdf-info-label{font-size:8px;font-weight:700;color:#9b95a6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.pdf-info-val{font-size:12.5px;font-weight:700;color:#2e263d}
.pdf-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.pdf-kpi{background:#f8fafd;border-radius:7px;padding:9px 11px;text-align:center;border:1px solid #e2e8f2}
.pdf-kpi-label{font-size:7.5px;font-weight:700;color:#9b95a6;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.pdf-kpi-val{font-size:15px;font-weight:800;font-family:'Manrope','Sarabun',sans-serif}
.pdf-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
.pdf-table th{background:#5938e0;color:#fff;padding:7px 11px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.07em}
.pdf-table th:last-child,.pdf-table td:last-child{text-align:right}
.pdf-table td{padding:7px 11px;border-bottom:1px solid #e2e8f2}
.pdf-table tr:nth-child(even) td{background:#f8fafd}
.pdf-table .bold{font-weight:700;color:#2e263d}
.pdf-table .navy{color:#5938e0;font-weight:700}.pdf-table .gold{color:#b8860b;font-weight:700}
.pdf-table .green{color:#3a8c00;font-weight:700}.pdf-table .red{color:#c2383c;font-weight:700}
.pdf-result-box{border-radius:9px;padding:12px 16px;margin-bottom:14px;border:2px solid}
.pdf-result-ok{background:#e6f8d9;border-color:#56ca00}
.pdf-result-warn{background:#fff3d6;border-color:#ffb400}
.pdf-formula-box{background:#f0ecff;border:1px solid rgba(109,76,255,.25);border-radius:7px;padding:10px 14px;margin-bottom:10px;font-size:11.5px;color:#5938e0;line-height:1.8}
.pdf-sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.pdf-sig-box{text-align:center;padding-top:45px;border-top:1px solid #334155;font-size:10px;color:#5a5169}
.pdf-sig-box .sig-title{font-weight:700;color:#2e263d;font-size:10.5px}
.pdf-footer-line{position:absolute;bottom:24px;left:48px;right:48px;border-top:1px solid #e2e8f2;padding-top:7px;font-size:8px;color:#9b95a6;display:flex;justify-content:space-between}

/* ==========================================================================
   MSU-BEPS — extra.css
   ส่วนต่อขยายจาก beps.css (ชุดเดิมของ prototype v8-1)
   1) ปรับเปลือกหน้าจอให้ทำงานแบบ "หนึ่งไฟล์ = หนึ่งหน้า"
   2) คอมโพเนนต์ใหม่สำหรับหน้าจอที่ prototype ยังไม่มี (W0, W8, W9, W11–W15)
   ========================================================================== */

/* ---------- 1) เปลือกหน้าจอ ---------- */

/* เดิม .page ถูกซ่อนไว้เพราะทุกหน้าอยู่ในไฟล์เดียว — ตอนนี้แยกไฟล์แล้วจึงแสดงเสมอ */
.page { display: block; }

.sb-item { text-decoration: none; }
.sb-w {
  margin-left: auto; font-family: 'Manrope', sans-serif; font-size: 9px; font-weight: 700;
  color: var(--text4); background: var(--bg3); padding: 1px 5px; border-radius: 5px; letter-spacing: 0;
}
.sb-item.active .sb-w { background: var(--navy2); color: #fff; }
.sb-role { font-size: 10px; opacity: .5; }
.sb-links { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.sb-back {
  display: block; font-size: 10px; color: var(--navy2);
  text-decoration: none; font-weight: 600;
}
.sb-back:hover { text-decoration: underline; }

.tb-wid {
  font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 800; margin-left: 9px;
  color: var(--navy2); background: var(--navy4); padding: 2px 7px; border-radius: 6px;
  vertical-align: middle;
}
.tb-year { font-size: 11.5px; padding: 6px 10px; font-weight: 600; }
.tb-run {
  display: flex; align-items: center; gap: 8px; text-decoration: none;
  background: var(--card); border: 1px solid var(--border2); border-radius: 9px;
  padding: 5px 11px; transition: .15s;
}
.tb-run:hover { border-color: var(--navy2); background: var(--navy4); }
.tb-run-id { font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 800; color: var(--navy); }
.tb-run-meta { font-size: 9.5px; color: var(--text3); line-height: 1.35; max-width: 190px; }
.tb-user {
  display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--text2);
  line-height: 1.45; text-decoration: none; padding: 4px 8px; border-radius: 9px;
  border: 1px solid transparent; transition: .15s;
}
.tb-user:hover { background: var(--card); border-color: var(--border2); }
.tb-user b { font-size: 11px; color: var(--text); }
.tb-role { color: var(--text4); }
.tb-avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--navy4); color: var(--navy);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
}

/* แถบเตือนข้อจำกัดของข้อมูล */
.caveat {
  display: flex; gap: 9px; align-items: flex-start; font-size: 11.5px; line-height: 1.65;
  color: var(--gold); background: var(--gold4); border: 1px solid rgba(180, 83, 9, .2);
  border-left: 4px solid var(--gold2); border-radius: var(--radius2);
  padding: 10px 14px; margin-bottom: 16px;
}
.caveat b { color: #8a6100; }
.caveat a { color: var(--gold); font-weight: 700; }
.caveat code {
  font-family: 'Manrope', monospace; background: rgba(180, 83, 9, .12);
  padding: 0 4px; border-radius: 3px; font-size: 11px;
}

/* ---------- 2) คอมโพเนนต์ที่ใช้ร่วมในหน้าจอใหม่ ---------- */

/* หัวข้อย่อยในหน้า */
.sub-note { font-size: 11.5px; color: var(--text3); line-height: 1.7; margin-bottom: 14px; }
.sub-note b { color: var(--text2); }

/* แถวปุ่ม / เครื่องมือเหนือการ์ด */
.toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .grow { flex: 1; }

.btn {
  font-family: inherit; font-size: 12px; font-weight: 600; padding: 8px 14px;
  border-radius: 8px; border: 1px solid var(--border2); background: var(--card);
  color: var(--text2); cursor: pointer; transition: .15s; display: inline-flex;
  align-items: center; gap: 6px; text-decoration: none;
}
.btn:hover { background: var(--bg3); border-color: var(--text4); }
.btn.primary { background: var(--navy2); border-color: var(--navy2); color: #fff; }
.btn.primary:hover { background: var(--navy3); box-shadow: 0 4px 12px rgba(109, 76, 255, .3); }
.btn.ok { background: var(--green2); border-color: var(--green2); color: #fff; }
.btn.ok:hover { background: var(--green); }
.btn.danger { background: var(--red3); border-color: var(--red3); color: var(--red); }
.btn.ghost { background: transparent; }
.btn[disabled], .btn.off {
  background: var(--bg3); border-color: var(--border); color: var(--text4);
  cursor: not-allowed; box-shadow: none;
}
.btn-sm { font-size: 10.5px; padding: 5px 10px; }

/* ป้ายสถานะ */
.st {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700;
  padding: 3px 9px; border-radius: 6px; white-space: nowrap; letter-spacing: .01em;
}
.st-draft   { background: #f1f3f5; color: var(--text3); }
.st-run     { background: var(--navy4); color: var(--navy); }
.st-calc    { background: #e0f2fe; color: #0369a1; }
.st-valid   { background: var(--gold4); color: var(--gold); }
.st-appr    { background: var(--green3); color: var(--green); }
.st-fail    { background: var(--red3); color: var(--red); }
.st-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* ตารางข้อมูล — ต่อยอดจาก .tbl เดิม */
.tbl.dense td { padding: 7px 10px; }
.tbl td.wrap { white-space: normal; line-height: 1.5; }
.tbl .muted { color: var(--text3); font-size: 11px; }
.tbl-scroll { overflow-x: auto; }
.tbl-scroll table { min-width: 780px; }
.tbl tr.sel { background: var(--navy4) !important; }
.tbl tfoot td {
  background: var(--bg2); font-weight: 700; border-top: 2px solid var(--border2);
  border-bottom: none;
}

/* แถบสัดส่วน direct เทียบ allocated */
.split { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: var(--bg3); }
.split i { display: block; height: 100%; }
.split-lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); margin-top: 4px; }

/* ไทม์ไลน์สถานะ (W11) */
.flow { display: flex; align-items: center; gap: 0; flex-wrap: wrap; margin: 4px 0 2px; }
.flow-step {
  display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600;
  color: var(--text4); padding: 7px 13px; border-radius: 8px; background: var(--bg3);
}
.flow-step.done { background: var(--green3); color: var(--green); }
.flow-step.now { background: var(--navy2); color: #fff; box-shadow: 0 3px 10px rgba(109, 76, 255, .3); }
.flow-arrow { color: var(--text4); font-size: 12px; padding: 0 7px; }

/* กล่องบันทึกเหตุการณ์ / audit log */
.log { display: flex; flex-direction: column; gap: 0; }
.log-item {
  display: grid; grid-template-columns: 106px 26px 1fr; gap: 10px; align-items: start;
  padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 11.5px;
}
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text4); font-size: 10px; font-family: 'Manrope', sans-serif; line-height: 1.6; }
.log-ic {
  width: 24px; height: 24px; border-radius: 7px; background: var(--bg3);
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.log-body { color: var(--text2); line-height: 1.65; }
.log-body b { color: var(--text); }

/* ฟอร์ม 2 คอลัมน์ */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 13px; }
.field label { font-size: 11px; font-weight: 700; color: var(--navy2); display: block; margin-bottom: 4px; }
.field .hint { font-size: 10px; color: var(--text4); margin-top: 4px; line-height: 1.5; }

/* กล่องกฎ / นโยบาย (W14, W15) */
.rule-row {
  display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.rule-row:last-child { border-bottom: none; }
.rule-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
.rule-key {
  font-family: 'Manrope', monospace; font-size: 10.5px; color: var(--text3);
  background: var(--bg3); padding: 1px 6px; border-radius: 4px; margin-left: 7px;
}
.rule-desc { font-size: 11px; color: var(--text3); margin-top: 3px; line-height: 1.6; }

/* กลุ่มปุ่มเลือกประเภทต้นทุน */
.seg { display: inline-flex; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button {
  border: none; background: none; font-family: inherit; font-size: 10.5px; font-weight: 700;
  padding: 5px 11px; border-radius: 6px; color: var(--text3); cursor: pointer; transition: .15s;
}
.seg button.on { background: var(--card); box-shadow: var(--shadow); }
.seg button.on[data-v="FIXED"] { color: var(--navy); }
.seg button.on[data-v="VARIABLE"] { color: var(--gold); }
.seg button.on[data-v="MIXED"] { color: var(--green); }
.seg button.on[data-v="UNCLASSIFIED"] { color: var(--red); }

/* สวิตช์เปิด/ปิด */
.sw { position: relative; width: 38px; height: 21px; flex-shrink: 0; cursor: pointer; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw span {
  position: absolute; inset: 0; background: var(--border2); border-radius: 21px; transition: .2s;
}
.sw span::before {
  content: ''; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .2s; box-shadow: var(--shadow);
}
.sw input:checked + span { background: var(--navy2); }
.sw input:checked + span::before { transform: translateX(17px); }

/* การ์ดตัวเลขแบบกะทัดรัด */
.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.mini-stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
.mini-stat .l { font-size: 9.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; }
.mini-stat .v { font-size: 17px; font-weight: 700; font-family: 'Manrope', 'Sarabun', sans-serif; margin-top: 4px; letter-spacing: -.4px; }
.mini-stat .s { font-size: 10px; color: var(--text4); margin-top: 2px; }

/* แถบผลตรวจยอด (W12) */
.recon-row {
  display: grid; grid-template-columns: 1fr 130px 130px 110px 92px; gap: 12px; align-items: center;
  padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 12px;
}
.recon-row.head {
  font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--text3);
  font-weight: 700; border-bottom: 2px solid var(--border2); background: var(--card);
  position: sticky; top: 0; z-index: 2;
}
.recon-row .num { text-align: right; font-family: 'Manrope', 'Sarabun', sans-serif; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .recon-row { grid-template-columns: 1fr 1fr; } }

/* หน้าเข้าสู่ระบบ (W0) */
.login-wrap {
  min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
  background: linear-gradient(135deg, #f5f7fb, #eef1f8);
}
@media (max-width: 900px) { .login-wrap { grid-template-columns: 1fr; } }
.login-brand {
  background: linear-gradient(160deg, #5938e0, #6d4cff 60%, #8b6fff);
  color: #fff; padding: 52px 48px; display: flex; flex-direction: column; justify-content: center; gap: 22px;
}
.login-brand h1 { font-size: 30px; font-weight: 800; font-family: 'Manrope', 'Sarabun', sans-serif; letter-spacing: -.02em; }
.login-brand p { font-size: 13px; line-height: 1.85; color: rgba(255, 255, 255, .8); max-width: 430px; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
.login-card {
  width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 30px 28px; box-shadow: var(--shadow2);
}

/* ตารางสิทธิ์ role → สิ่งที่เห็น (W0) */
.rbac { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rbac th {
  background: var(--navy4); color: var(--navy); padding: 8px 10px; text-align: left;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
}
.rbac th:not(:first-child), .rbac td:not(:first-child) { text-align: center; width: 52px; }
.rbac th { line-height: 1.35; }
.rbac td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.rbac .y { color: var(--green2); font-weight: 700; }
.rbac .n { color: var(--text4); }
.rbac .p { color: var(--gold2); font-weight: 700; }

/* ป้ายธงคุณภาพข้อมูล (W13) */
.flag {
  display: inline-flex; align-items: center; gap: 5px; font-family: 'Manrope', monospace;
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 5px;
}
.flag-unc { background: var(--red3); color: var(--red); }
.flag-drv { background: var(--gold4); color: var(--gold); }
.flag-fee { background: var(--navy4); color: var(--navy); }
.flag-q0 { background: #f1f3f5; color: var(--text3); }

/* กล่อง diff ค่าเดิม → ค่าใหม่ (W15) */
.diff { display: inline-flex; align-items: center; gap: 8px; font-family: 'Manrope', sans-serif; font-size: 11.5px; }
.diff .from { color: var(--text4); text-decoration: line-through; }
.diff .to { color: var(--navy); font-weight: 700; }

/* หน้าสารบัญ (index.html) */
.hub { max-width: 1180px; margin: 0 auto; padding: 36px 26px 70px; }
.hub-h { font-size: 26px; font-weight: 800; font-family: 'Manrope', 'Sarabun', sans-serif; letter-spacing: -.02em; }
.hub-sub { font-size: 13px; color: var(--text3); margin-top: 6px; line-height: 1.75; max-width: 780px; }
.hub-grp { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--navy2); margin: 30px 0 12px; }
.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 13px; }
.hub-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 17px; box-shadow: var(--shadow); text-decoration: none; color: inherit;
  display: flex; gap: 12px; transition: .16s; border-left: 3px solid var(--navy2);
}
.hub-card:hover { box-shadow: var(--shadow2); transform: translateY(-2px); border-left-color: var(--gold2); }
.hub-card.isnew { border-left-color: var(--green2); }
.hub-ic { font-size: 21px; flex-shrink: 0; }
.hub-w { font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 800; color: var(--navy2); }
.hub-t { font-size: 13.5px; font-weight: 700; margin: 2px 0 4px; }
.hub-d { font-size: 11px; color: var(--text3); line-height: 1.6; }
.hub-tag {
  display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 6px;
  border-radius: 4px; margin-top: 7px;
}
.hub-tag.proto { background: var(--navy4); color: var(--navy); }
.hub-tag.brandnew { background: var(--green3); color: var(--green); }

@media print {
  #sidebar, #topbar, .sb-back { display: none !important; }
  #main { margin-left: 0 !important; }
}

/* ── เฉพาะฉบับไฟล์เดียว ── */
#page-host > .page { display: block; }
#page-host > .login-wrap, #page-host > .hub { animation: none; }
body.full-page #sidebar, body.full-page #topbar { display: none !important; }
body.full-page #main { margin-left: 0 !important; }
</style>

const STUDENT_TYPES = (() => {
  const defs = [
    { code: 'REG-TH', grp: 'ภาคปกติ', nat: 'ไทย', share: 0.9078, note: 'ประเภทหลัก' },
    { code: 'REG-INT', grp: 'ภาคปกติ', nat: 'ต่างชาติ', share: 0.0126, note: 'ค่าธรรมเนียมคนละอัตรากับนิสิตไทย' },
    { code: 'SPC-TH', grp: 'ภาคพิเศษ', nat: 'ไทย', share: 0.078, note: 'ส่วนใหญ่เป็นบัณฑิตศึกษา' },
    { code: 'SPC-INT', grp: 'ภาคพิเศษ', nat: 'ต่างชาติ', share: 0.0016, note: '' },
  ];
  const total = RAW.UNI.Q;
  const raw = defs.map(d => ({ ...d, exact: total * d.share }));
  raw.forEach(d => (d.n = Math.floor(d.exact)));
  let left = total - raw.reduce((a, d) => a + d.n, 0);
  [...raw]
    .sort((a, b) => b.exact - b.n - (a.exact - a.n))
    .forEach(d => {
      if (left-- > 0) d.n++;
    });
  return raw;
})();

/* ============ เปลือกหน้าจอ ============
   buildShell({ w, title, bm, run })
     w     — รหัสหน้าจอ เช่น 'W1' (ใช้ไฮไลต์เมนู)
     title — ชื่อหน้าบน topbar
     bm    — true = แสดงปุ่มสลับฐานรายได้ (หน้าวิเคราะห์ W1–W5)
     run   — true = แสดงแถบรอบคำนวณ + ปีงบประมาณ
   หน้าที่ต้อง re-render เมื่อสลับฐานรายได้ ให้ประกาศ window.renderPage
   ================================================================ */
function buildShell(opt) {
  const cur = opt.f || location.pathname.split('/').pop();

  const nav = NAV.map(grp => {
    const hasActive = grp.items.some(i => i.f === cur);
    const items = grp.items
      .map(
        i => `<a class="sb-item${i.f === cur ? ' active' : ''}" href="${i.f}">
        <div class="sb-icon">${i.ic}</div><span>${i.t}</span><span class="sb-w">${i.w}</span></a>`
      )
      .join('');
    return `<div class="sb-grp open${hasActive ? ' has-active' : ''}">
      <div class="sb-group"><span class="sb-caret">▸</span><span>${grp.g}</span>
        ${grp.role ? `<span class="sb-role" title="เห็นเฉพาะ role: ${grp.role}">🔒</span>` : ''}
        <span class="sb-count">${grp.items.length}</span></div>
      <div class="sb-sub">${items}</div></div>`;
  }).join('');

  const sidebar = `<nav id="sidebar">
    <div class="sb-logo">
      <img src="${MSU_LOGO}" class="sb-logo-img" alt="ตราสัญลักษณ์มหาวิทยาลัยมหาสารคาม">
      <div>
        <div class="sb-logo-tag">Mahasarakham University</div>
        <div class="sb-logo-title">MSU-BEPS</div>
        <div class="sb-logo-sub">Break-Even Point System<br>ระบบวิเคราะห์จุดคุ้มทุน</div>
      </div>
    </div>
    <div class="sb-nav">${nav}</div>
    <div class="sb-footer">
      <p id="sb-stats">นิสิต ${fmtN(RAW.UNI.Q)} คน · 20 คณะ/วิทยาลัย · 230 หลักสูตร</p>
      <div class="sb-ver">ข้อมูลอัพเดท 20260711 · รอบคำนวณ #${RUN.id}</div>
      <div class="sb-links">
        <a class="sb-back" href="screens.html">☰ สารบัญหน้าจอทั้งหมด</a>
        <a class="sb-back" href="W0-login.html">🔐 หน้าเข้าสู่ระบบ (W0)</a>
      </div>
      <div class="credit-section">
        <div class="credit-label">ผู้พัฒนาระบบ</div>
        <div class="credit-item"><div class="credit-avatar">👩</div><div>
          <div class="credit-name">นางสาวสิริมา ศรีสุภาพ</div><div class="credit-role">กระบวนการ</div></div></div>
        <div class="credit-item"><div class="credit-avatar">👨</div><div>
          <div class="credit-name">นายอัครินทร์ บุพผา</div><div class="credit-role">ระบบ</div></div></div>
      </div>
    </div>
  </nav>`;

  const runBar = opt.run === false ? '' : `
    <select class="tb-year" id="tb-year" title="ปีงบประมาณ">
      <option value="2568" selected>ปีงบประมาณ 2568</option>
      <option value="2567">ปีงบประมาณ 2567</option>
      <option value="2566">ปีงบประมาณ 2566</option>
    </select>
    <a class="tb-run" href="W11-allocation-run.html" title="ผลชุดนี้มาจากรอบคำนวณไหน — กดเพื่อดูคอนโซล Run">
      <span class="tb-run-id">Run #${RUN.id}</span>
      <span class="tb-run-meta">คำนวณ ${RUN.calcAt} · กติกา ${RUN.ruleVer} · ฐาน ${RUN.basis}</span>
      <span class="chip chip-g">อนุมัติแล้ว</span>
    </a>`;

  const bmBar = opt.bm === false ? '' : `
    <div class="bm-wrap">
      <span class="bm-lbl">ฐานรายได้:</span>
      <div class="bm-toggle">
        <button class="bm-opt on" id="bm-in" data-bm="in" title="R = (เงินแผ่นดิน + เงินรายได้) / จำนวนนิสิต">รวมเงินแผ่นดิน</button>
        <button class="bm-opt" id="bm-ex" data-bm="ex" title="R = เงินรายได้ / จำนวนนิสิต">ไม่รวมเงินแผ่นดิน</button>
      </div>
    </div>
    <div class="badge badge-navy num" id="tb-q">—</div>
    <div class="badge badge-gold" id="tb-status">—</div>`;

  const topbar = `<div id="topbar">
    <div class="tb-page">${opt.title}<span class="tb-wid">${opt.w}</span></div>
    <div class="tb-spacer"></div>
    ${runBar}${bmBar}
    <a class="tb-user" href="W0-login.html"
       title="ผู้ใช้ที่เข้าสู่ระบบ · สิทธิ์กำหนดว่าเห็นเมนูใดบ้าง — กดเพื่อไปหน้าเข้าสู่ระบบ (W0)">
      <span class="tb-avatar">ผ</span>
      <span><b>ผศ.ดร.ปิยภัทร บุษบาบดินทร์</b><br><span class="tb-role">ผู้ดูข้อมูล · เปลี่ยนผู้ใช้</span></span>
    </a>
  </div>`;

  document.body.insertAdjacentHTML('afterbegin', sidebar);
  const main = document.getElementById('main');
  main.insertAdjacentHTML('afterbegin', topbar);

  /* ถ้ากำลังใช้ชุดข้อมูลตัวอย่าง ต้องบอกให้ชัดว่าตัวเลขไม่ใช่ของจริง */
  if (RAW.__sample) {
    const page = document.querySelector('.page');
    if (page) page.insertAdjacentHTML('afterbegin', sampleBanner());
  }

  document.querySelectorAll('.sb-group').forEach(g => {
    g.onclick = () => g.parentElement.classList.toggle('open');
  });
  document.querySelectorAll('.bm-opt[data-bm]').forEach(b => {
    b.onclick = () => {
      BM = b.dataset.bm;
      document.getElementById('bm-in').classList.toggle('on', BM === 'in');
      document.getElementById('bm-ex').classList.toggle('on', BM === 'ex');
      refreshTopbar();
      if (window.renderPage) window.renderPage();
    };
  });
  refreshTopbar();
}

function refreshTopbar() {
  const U = RAW.UNI;
  const q = document.getElementById('tb-q');
  if (!q) return;
  q.textContent = fmtN(U.Q) + ' นิสิต';
  const p = profit(U);
  const s = document.getElementById('tb-status');
  s.textContent = (p >= 0 ? 'ส่วนเกิน ' : 'ขาดทุน ') + fmtM(Math.abs(p)) + ' ลบ.';
  s.className = 'badge';
  s.style.background = p >= 0 ? 'var(--green3)' : 'var(--red3)';
  s.style.color = p >= 0 ? 'var(--green)' : 'var(--red)';
}

/* แถบเตือนว่ากำลังดูชุดข้อมูลตัวอย่าง ไม่ใช่ตัวเลขจริงของมหาวิทยาลัย */
function sampleBanner() {
  return `<div class="caveat" style="background:var(--red3);border-color:rgba(194,24,91,.25);
      border-left-color:var(--red2);color:var(--red)">
    <span>🔢</span><span><b>ตัวเลขในหน้านี้เป็นข้อมูลตัวอย่าง ไม่ใช่ของจริง</b> —
    repo นี้ไม่เก็บข้อมูลการเงินของมหาวิทยาลัย (ดูเหตุผลใน <code>.gitignore</code>)
    จึงโหลด <code>assets/data.sample.js</code> ที่ตัวเลขถูกสุ่มรบกวนแล้ว
    ความสัมพันธ์ทุกสูตรยังถูกต้อง แต่<b>ห้ามนำตัวเลขไปอ้างอิง</b>
    · ถ้ามี <code>assets/data.js</code> ในเครื่อง หน้าจอจะแสดงตัวเลขจริงเองโดยอัตโนมัติ</span></div>`;
}

/* แถบเตือนข้อจำกัดของข้อมูล — ค่าเสื่อมราคาอาคารยังไม่ครบ
   ต้องติดไว้ทุกหน้าที่แสดงส่วนเกิน/Q* ไม่ให้ผู้บริหารอ่านเป็นตัวเลขสุดท้าย */
/* ต้นทุนที่ขาดไปทำให้ผลลัพธ์ "ดูดีเกินจริง" เสมอ — ถ้ากำไรก็สูงเกินจริง ถ้าขาดทุนก็ขาดทุนน้อยกว่าจริง */
function surplusCaveatTxt() {
  const p = profit(RAW.UNI);
  return p >= 0
    ? `ส่วนเกิน +${fmtM(p)} ลบ. ที่รายงานอยู่จึง<b>สูงเกินจริง</b>`
    : `ตัวเลขขาดทุน ${fmtM(Math.abs(p))} ลบ. ที่รายงานอยู่จึง<b>น้อยกว่าความจริง</b>`;
}

function dataCaveat() {
  return `<div class="caveat"><span>⚠️</span><span><b>ข้อจำกัดของข้อมูลชุดนี้</b> — ค่าเสื่อมราคาอาคารยังไม่ครบ
    (ฟิลด์ <code>dep</code> รวม ${fmtM(RAW.UNI.dep)} ลบ. มีเฉพาะครุภัณฑ์) TFC และ TC จึงต่ำกว่าความจริง
    ${surplusCaveatTxt()} และ Q* ทุกระดับ<b>ต่ำกว่าที่ควรเป็น</b>
    — ดูรายการค้างที่ <a href="W13-exceptions.html">รายการค้างตรวจ</a></span></div>`;
}

function renderPerhead(){
  const F=RAW.FACS, U=RAW.UNI;

  const G=D.filter(d=>d.Q>=OUTLIER_MIN_Q);
  const nEx=D.length-G.length;
  const Ru=R(U),ATCu=ATC(U),diff=Ru-ATCu,nOk=D.filter(d=>d.diff>=0).length;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  document.getElementById('ph-note').innerHTML=`<b>ATC (ต้นทุนรวม/หัว) และ AVC ไม่เปลี่ยนตามโหมด</b> — เปลี่ยนเฉพาะ <b>R</b> · โหมด: <b>${BM==='in'?'รวมเงินแผ่นดิน':'ไม่รวมเงินแผ่นดิน'}</b> → R เฉลี่ย ${fmtB(Ru)} เทียบ ATC ${fmtB(ATCu)} บ./คน`;
  set('ph-k1',fmtB(Ru));set('ph-k2',fmtB(ATCu));
  set('ph-k3',(diff>=0?'+':'−')+fmtB(Math.abs(diff)));

/* ==========================================================================

/* ============ BREAKEVEN DRILL ============ */
let expanded={fac:{},dep:{}};
let beSearch='',beFilter='all';
const beNorm=s=>(s||'').toString().toLowerCase();
function beProgHit(p){
  const t=beSearch;
  const txt=!t||beNorm(p.prog).includes(t)||beNorm(p.deg).includes(t)||beNorm(p.fac).includes(t)||beNorm(p.lvl).includes(t)||beNorm(p.grp).includes(t);
  const st=beFilter==='all'||status(p)===beFilter;
  return txt&&st;
}
function beFacText(name){ // does the faculty/level name itself match the text term
  return beSearch && beNorm(name).includes(beSearch);
}
function hl(s){
  if(!beSearch)return s;
  const i=beNorm(s).indexOf(beSearch);
  if(i<0)return s;
  return s.slice(0,i)+'<mark>'+s.slice(i,i+beSearch.length)+'</mark>'+s.slice(i+beSearch.length);
}
function renderBreakeven(){
  document.getElementById('be-note').textContent=noteTxt();
  const P=RAW.PROGS;
  const ok=P.filter(x=>status(x)==='ok').length;
  const no=P.filter(x=>status(x)==='no').length;
  const loss=P.filter(x=>status(x)==='loss').length;
  const sur=P.reduce((s,x)=>s+profit(x),0);
  document.getElementById('be-ok').textContent=fmtN(ok);
  document.getElementById('be-loss').textContent=fmtN(loss+no);
  document.getElementById('be-no').textContent=fmtN(no);
  document.getElementById('be-sur').textContent=(sur>=0?'+':'−')+fmtM(Math.abs(sur));
  document.getElementById('be-sur').className='kpi-val num '+(sur>=0?'pos':'neg');
  buildTree();

  const byLoss=[...P].filter(x=>status(x)!=='ok').sort((a,b)=>profit(a)-profit(b)).slice(0,3);
  const gap=[...P].filter(x=>status(x)==='loss').sort((a,b)=>(Qs(b)-b.Q)-(Qs(a)-a.Q)).slice(0,1)[0];
  document.getElementById('be-ins').innerHTML=[
    `จาก 230 หลักสูตร มี <b>${fmtN(ok)}</b> หลักสูตรที่คุ้มทุนแล้ว, <b>${fmtN(loss)}</b> ยังไม่ถึงจุดคุ้มทุน และ <b>${fmtN(no)}</b> หลักสูตรที่ R ≤ AVC (ไม่มีจุดคุ้มทุน ณ ราคาปัจจุบัน)`,
    gap?`หลักสูตรที่ต้องเพิ่มนิสิตมากสุดเพื่อคุ้มทุน: <b>${gap.prog}</b> (${short(gap.fac)}) ปัจจุบัน ${fmtN(gap.Q)} คน ต้องการ ${fmtN(Qs(gap))} คน — ขาดอีก ${fmtN(Qs(gap)-gap.Q)} คน`:'',
    byLoss.length?`หลักสูตรขาดทุนสูงสุด: `+byLoss.map(x=>`<b>${x.prog}</b> (${fmtM(profit(x))} ลบ.)`).join(', '):''
  ].filter(Boolean).map(t=>`<li>${t}</li>`).join('');

function cellsFor(o){
  const s=status(o), sur=profit(o);

function buildTree(){
  const host=document.getElementById('be-tree');
  const F=RAW.FACS, D=RAW.DEPTS, P=RAW.PROGS;
  const filtering=!!beSearch||beFilter!=='all';
  let html='',shownProgs=0,shownFacs=0;
  F.forEach((f,fi)=>{
    const facProgs=P.filter(p=>p.fac===f.name);
    const hitProgs=filtering?facProgs.filter(beProgHit):facProgs;
    if(filtering && hitProgs.length===0) return;      // hide faculties with no match
    shownFacs++;
    const open=filtering?true:expanded.fac[f.name];    // auto-expand while filtering
    html+=`<div class="tree-row lvl-fac" data-fac="${fi}"><div class="tw-name"><span class="caret ${open?'open':''}">▶</span><span class="nm" title="${f.name}">${hl(f.name)}</span></div>${cellsFor(f)}</div>`;
    if(open){
      D.filter(d=>d.fac===f.name).forEach(d=>{
        const key=f.name+'||'+d.grp;
        const depProgs=facProgs.filter(p=>p.grp===d.grp);
        const depHits=filtering?depProgs.filter(beProgHit):depProgs;
        if(filtering && depHits.length===0) return;
        const dopen=filtering?true:expanded.dep[key];
        html+=`<div class="tree-row lvl-dep" data-dep="${key}"><div class="tw-name pad-1"><span class="caret ${dopen?'open':''}">▶</span><span class="nm">📚 ${hl(d.grp)} <span style="color:var(--text4);font-weight:400;font-size:10px">(${filtering?depHits.length+' / ':''}${d.n} หลักสูตร)</span></span></div>${cellsFor(d)}</div>`;
        if(dopen){
          depHits.forEach(p=>{
            shownProgs++;
            html+=`<div class="tree-row lvl-prog"><div class="tw-name pad-2"><span style="width:16px"></span><span class="nm" title="${p.prog} · ${p.deg||''}">${hl(p.prog)} <span style="color:var(--text4);font-size:10px">· ${hl(p.lvl)}</span></span></div>${cellsFor(p)}</div>`;
          });
        } else { shownProgs+=depHits.length; }
      });
    } else { shownProgs+=hitProgs.length; }
  });
  if(filtering && shownProgs===0)
    html=`<div class="be-empty">🔍 ไม่พบข้อมูลที่ตรงกับ "<b>${beSearch}</b>"${beFilter!=='all'?' ในตัวกรองที่เลือก':''} — ลองคำอื่นหรือกดล้างคำค้นหา</div>`;
  host.innerHTML=html;
  host.querySelectorAll('.lvl-fac').forEach(r=>r.onclick=()=>{if(filtering)return;const n=RAW.FACS[+r.dataset.fac].name;expanded.fac[n]=!expanded.fac[n];buildTree();});
  host.querySelectorAll('.lvl-dep').forEach(r=>r.onclick=e=>{e.stopPropagation();if(filtering)return;const k=r.dataset.dep;expanded.dep[k]=!expanded.dep[k];buildTree();});
  // count label
  const cnt=document.getElementById('be-count');

/* ── page-chart.js ── */
/* ==========================================================================
   MSU-BEPS — W3 กราฟจุดคุ้มทุน

/* ============ BE CHART ============ */
const LVL_ORDER=['ปริญญาตรี','ประกาศนียบัตร','ป.บัณฑิต','ปริญญาโท','ปริญญาเอก'];
const _li=x=>{const i=LVL_ORDER.indexOf(x);return i<0?99:i;};
function jsAgg(rows){
  const s=k=>rows.reduce((a,p)=>a+F0(p[k]),0);
  const Q=s('Q'),own=s('own'),TR=s('TR'),TFC=s('TFC'),TVC=s('TVC');
  const Rin=Q?TR/Q:0,Rex=Q?own/Q:0,AVC=Q?TVC/Q:0,CMi=Rin-AVC,CMe=Rex-AVC;
  return {Q,st:s('st'),own,TR,TFC,TVC,TC:TFC+TVC,Rin,Rex,AVC,
    Qin:CMi>0?Math.ceil(TFC/CMi-1e-9):null,Qex:CMe>0?Math.ceil(TFC/CMe-1e-9):null,
    tfcProg:s('tfcProg'),tfcOffice:s('tfcOffice'),dep:s('dep'),n:rows.length};
}
/* const el(...) ย้ายไปอยู่ใน core.js แล้ว */
function facLevels(fac){return [...new Set(RAW.PROGS.filter(p=>p.fac===fac).map(p=>p.lvl))].sort((a,b)=>_li(a)-_li(b));}
function progIdxOf(fac,lvl){return RAW.PROGS.map((p,i)=>[p,i]).filter(([p])=>p.fac===fac&&p.lvl===lvl);}
function chEntities(){
  const mode=el('ch-level').value, fSel=el('ch-fac'), lSel=el('ch-lvl'), pSel=el('ch-prog');
  fSel.style.display=(mode==='fac'||mode==='dep'||mode==='prog')?'':'none';
  lSel.style.display=(mode==='dep'||mode==='prog')?'':'none';
  pSel.style.display=(mode==='prog')?'':'none';
  // faculties
  if(!fSel.options.length) fSel.innerHTML=RAW.FACS.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');
  const fac=RAW.FACS[+fSel.value||0].name;
  // levels for this faculty
  if(mode==='dep'||mode==='prog'){
    const lvls=facLevels(fac), keep=lSel.value;
    lSel.innerHTML=lvls.map(l=>`<option value="${l}">${l}</option>`).join('');
    if(lvls.includes(keep)) lSel.value=keep;
  }
  // programs for this faculty+level
  if(mode==='prog'){
    const lvl=lSel.value||facLevels(fac)[0];
    const list=progIdxOf(fac,lvl), keep=pSel.value;
    pSel.innerHTML=list.map(([p,i])=>`<option value="${i}">${p.prog}</option>`).join('');
    if(list.some(([,i])=>String(i)===keep)) pSel.value=keep;
  }
}
el('ch-level').onchange=()=>{chEntities();renderChart();};
el('ch-fac').onchange=()=>{chEntities();renderChart();};
el('ch-lvl').onchange=()=>{chEntities();renderChart();};
el('ch-prog').onchange=renderChart;
function curEntity(){
  const mode=el('ch-level').value;
  if(mode==='uni')return {o:RAW.UNI,name:'มหาวิทยาลัยมหาสารคาม (รวมทุกคณะ)'};
  const fac=RAW.FACS[+el('ch-fac').value||0];
  if(mode==='fac')return {o:fac,name:fac.name};
  const lvl=el('ch-lvl').value||facLevels(fac.name)[0];
  if(mode==='dep'){const rows=RAW.PROGS.filter(p=>p.fac===fac.name&&p.lvl===lvl);return {o:jsAgg(rows),name:fac.name+' — '+lvl+' (รวม '+rows.length+' หลักสูตร)'};}
  const o=RAW.PROGS[+el('ch-prog').value||0];
  return {o,name:fac.name+' — '+o.prog+' ('+o.lvl+')'};
}
function renderChart(){
  if(!document.getElementById('ch-fac').options.length)chEntities();
  const {o,name}=curEntity();
  const tfc=F0(o.TFC),avc=AVC(o),r=R(o),q=F0(o.Q),qs=Qs(o);
  const xmax=Math.max(q,qs||0)*1.35||100;
  const pts=n=>[{x:0,y:tfc/1e6},{x:xmax,y:(tfc+avc*xmax)/1e6}];
  const trpts=[{x:0,y:0},{x:xmax,y:r*xmax/1e6}];
  const beX=qs||null;
  mk('ch-be',{type:'line',data:{datasets:[
    {label:'TR',data:trpts,borderColor:C.navy,backgroundColor:'rgba(109,76,255,.06)',borderWidth:2.5,pointRadius:0,fill:false,tension:0},
    {label:'TC',data:[{x:0,y:tfc/1e6},{x:xmax,y:(tfc+avc*xmax)/1e6}],borderColor:C.red,borderWidth:2.5,pointRadius:0,fill:false},
    {label:'TFC',data:[{x:0,y:tfc/1e6},{x:xmax,y:tfc/1e6}],borderColor:C.gold,borderWidth:1.5,borderDash:[6,4],pointRadius:0}
  ]},options:{responsive:true,maintainAspectRatio:false,parsing:false,interaction:{mode:'nearest',intersect:false},
    plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>'นิสิต '+fmtN(c[0].parsed.x)+' คน',label:c=>c.dataset.label+': '+c.parsed.y.toLocaleString('th-TH',{maximumFractionDigits:1})+' ลบ.'}},
      annotation:false},
    scales:{x:{type:'linear',min:0,max:xmax,title:{display:true,text:'จำนวนนิสิต (คน)'},grid:{color:C.grid}},
      y:{title:{display:true,text:'มูลค่า (ล้านบาท)'},grid:{color:C.grid}}}}});
  // draw BE + actual markers via after render overlay using a simple plugin-less approach: add points datasets
  if(beX){
    const ch=charts['ch-be'];
    ch.data.datasets.push({label:'จุดคุ้มทุน',data:[{x:beX,y:r*beX/1e6}],borderColor:C.green,backgroundColor:C.green,pointRadius:6,pointStyle:'rectRot',showLine:false});
    ch.data.datasets.push({label:'ปัจจุบัน',data:[{x:q,y:r*q/1e6}],borderColor:C.navyD,backgroundColor:'#fff',pointRadius:6,pointBorderWidth:2,showLine:false});
    ch.update();
  }
  // kpis
  const s=status(o),sur=profit(o);
  document.getElementById('ch-kpis').innerHTML=[
    ['นิสิตปัจจุบัน (Q)',fmtN(o.Q)+' คน','cn'],
    ['จุดคุ้มทุน (Q*)',qs?fmtN(qs)+' คน':'ไม่มี','cr'],
    ['รายได้/หัว (R)',fmtB(r)+' บาท','co'],
    ['ต้นทุนผันแปร/หัว (AVC)',fmtB(avc)+' บาท','co'],
    ['กำไรส่วนเกิน/หัว (R−AVC)',fmtB(r-avc)+' บาท','cg'],
    ['ส่วนเกิน/ขาดทุน',(sur>=0?'+':'−')+fmtM(Math.abs(sur))+' ลบ.',sur>=0?'cg':'cr']
  ].map(k=>`<div class="kpi ${k[2]}"><div class="kpi-label">${k[0]}</div><div class="kpi-val num" style="font-size:19px">${k[1]}</div></div>`).join('');
  // summary
  const need=qs&&o.Q<qs?qs-o.Q:0;
  document.getElementById('ch-summary').innerHTML=`
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">${name}</div>
    <div style="font-size:12px;color:var(--text2);line-height:1.8">
    หน่วยนี้มีนิสิต <b>${fmtN(o.Q)}</b> คน ต้นทุนคงที่ (TFC) <b>${fmtM(o.TFC)}</b> ลบ. ต้นทุนผันแปรต่อหัว (AVC) <b>${fmtB(avc)}</b> บาท และรายได้ต่อหัว (R) <b>${fmtB(r)}</b> บาท<br><br>
    ${s==='no'?`<span class="st-badge st-no" style="display:inline-block">R ≤ AVC</span> รายรับต่อหัวต่ำกว่าต้นทุนผันแปรต่อหัว จึงไม่มีจุดคุ้มทุน ณ ระดับราคาปัจจุบัน ต้องปรับค่าธรรมเนียมหรือลดต้นทุนผันแปร`:
      s==='ok'?`<span class="st-badge st-ok" style="display:inline-block">คุ้มทุนแล้ว</span> จำนวนนิสิตปัจจุบัน (${fmtN(o.Q)}) มากกว่าจุดคุ้มทุน (${fmtN(qs)}) อยู่ <b>${fmtN(o.Q-qs)}</b> คน สร้างส่วนเกิน <b class="pos">${fmtM(sur)}</b> ลบ.`:
      `<span class="st-badge st-loss" style="display:inline-block">ยังไม่คุ้มทุน</span> ต้องเพิ่มนิสิตอีก <b>${fmtN(need)}</b> คน (จาก ${fmtN(o.Q)} เป็น ${fmtN(qs)}) หรือลดต้นทุน/เพิ่มค่าธรรมเนียม จึงจะถึงจุดคุ้มทุน`}
    </div>`;
  chRecommend(o,name,r,avc,qs,sur,s);
}
function chRecommend(o,name,r,avc,qs,sur,s){
  const ATCe=o.Q?F0(o.TC)/o.Q:0, UNIatc=RAW.UNI.TC/RAW.UNI.Q, CM=r-avc;
  const rex=F0(o.Rex), qex=o.Qex, exNoBE=rex<=avc, exOk=(rex>avc)&&qex&&o.Q>=qex;
  const stateShare=(F0(o.st)+F0(o.own))?F0(o.st)/(F0(o.st)+F0(o.own)):0;
  const fcr=r>0?Math.ceil(F0(o.TC)/r):0;
  const mos=qs&&o.Q>qs?o.Q-qs:0;
  // ---- program administrators (tactical) ----
  const P=[];
  if(s==='no'){
    P.push({t:'crit',h:`ราคาต่อหัว (R <b>${fmtB(r)}</b>) ต่ำกว่าต้นทุนผันแปรต่อหัว (AVC <b>${fmtB(avc)}</b>) — <b>รับนิสิตเพิ่มยิ่งขาดทุน</b> ควรชะลอการขยายจนกว่าจะปรับโครงสร้างราคา/ต้นทุน`});
    P.push({t:'warn',h:`ตั้งเป้าให้ <b>R > AVC</b>: ทบทวนอัตราค่าธรรมเนียม หรือลดต้นทุนผันแปรต่อหัว (ค่าตอบแทนผู้สอน · ค่าวัสดุ · สาธารณูปโภค) ให้ต่ำกว่า ${fmtB(r)} บ./คน`});
    P.push({t:'info',h:`แนวทาง Full-Cost Recovery: ต้องมีนิสิตราว <b>${fmtN(fcr)} คน</b> ค่าเทอมรวมจึงครอบคลุมต้นทุน (ปัจจุบัน ${fmtN(o.Q)} คน) — พิจารณา<b>ควบรวม/ร่วมสอน</b>กับหลักสูตรใกล้เคียงเพื่อเฉลี่ยต้นทุนคงที่`});
  }else if(s==='loss'){
    P.push({t:'warn',h:`เพิ่มการรับเข้าอีก <b>${fmtN(qs-o.Q)} คน</b> (เป็น ${fmtN(qs)} คน) เพื่อถึงจุดคุ้มทุน — นิสิตแต่ละคนสมทบกำไรส่วนเกิน <b>${fmtB(CM)}</b> บ. เข้าไปชดเชยต้นทุนคงที่`});
    P.push({t:'info',h:`หรือเพิ่ม <b>CM ต่อหัว</b> ด้วยการขึ้นค่าธรรมเนียม/เพิ่มรายได้เสริม หรือลด AVC และ<b>ลดต้นทุนคงที่</b> (TFC ${fmtM(o.TFC)} ลบ.) โดยใช้ห้องเรียน/อาจารย์/ครุภัณฑ์ร่วมกับหลักสูตรอื่น`});
    P.push({t:'info',h:`เร่งการตลาดเชิงรุกในกลุ่มเป้าหมาย และรักษาอัตราคงอยู่ (retention) ไม่ให้จำนวนนิสิตหลุดต่ำลงไปอีก`});
  }else{
    P.push({t:'ok',h:`คุ้มทุนแล้ว มี <b>Margin of Safety ${fmtN(mos)} คน</b> (${o.Q?((mos/o.Q)*100).toFixed(0):0}% ของนิสิตปัจจุบัน) — ยังรองรับความเสี่ยงจำนวนนิสิตลดได้ระดับหนึ่ง`});
    P.push({t:'info',h:`นำส่วนเกิน <b>${fmtM(sur)} ลบ.</b> ไปพัฒนาคุณภาพหลักสูตร งานวิจัย หรือทุนนิสิต เพื่อรักษาความสามารถในการแข่งขันและดึงดูดผู้เรียน`});
    P.push({t:'warn',h:`ระวังการเพิ่มต้นทุนคงที่ (อัตรากำลัง/ครุภัณฑ์) ที่จะดันจุดคุ้มทุนสูงขึ้น — ประเมินความคุ้มค่าก่อนลงทุนเพิ่ม`});
  }
  if(BM==='in' && (exNoBE || !exOk))
    P.push({t:'crit',h:`โหมด "ไม่รวมเงินแผ่นดิน": หน่วยนี้${exNoBE?'<b>ยังไม่มีจุดคุ้มทุน</b>':'ต้องการ <b>'+fmtN(qex)+' คน</b>'} — สะท้อนการ<b>พึ่งพางบแผ่นดินสูง</b> ควรวางแผนเพิ่มรายได้ค่าธรรมเนียม/แหล่งทุนภายนอก`});
  // ---- faculty / university administrators (strategic) ----
  const E=[];
  E.push({t:stateShare>=0.4?'warn':'info',h:`พึ่งพางบประมาณเงินแผ่นดิน <b>${(stateShare*100).toFixed(0)}%</b> ของรายได้ — ${stateShare>=0.5?'สัดส่วนสูงมาก ควรเร่งกระจายความเสี่ยงด้านรายได้':stateShare>=0.4?'สัดส่วนค่อนข้างสูง ควรติดตามใกล้ชิด':'อยู่ในระดับบริหารจัดการได้'}`});
  if(s==='ok'&&sur>0)
    E.push({t:'ok',h:`เป็นหน่วยที่<b>สร้างส่วนเกิน (+${fmtM(sur)} ลบ.)</b> — พิจารณาให้ช่วยอุ้มหลักสูตรเชิงยุทธศาสตร์ที่จำเป็นแต่ยังไม่คุ้มทุน (<b>cross-subsidy</b>) โดยกำหนดเพดานและตัวชี้วัดชัดเจน`});
  else

    shell: true,
    caveat: false,
    html: "<div class=\"page method\" id=\"p-method\">\n    <div class=\"sec-title\">📐 สูตรและหลักวิชาการจุดคุ้มทุน (Break-Even Analysis)</div>\n    <div class=\"fm-grid2\">\n      <div class=\"fm-card\"><h4>📌 สูตรที่ 1 — จุดคุ้มทุน</h4>\n        <div class=\"fm-eq\">Q* = TFC / ( R − AVC )</div>\n        <p>จุดคุ้มทุน (BEP) คือจำนวนนิสิตขั้นต่ำ Q* ที่ทำให้ TR = TC พอดี (π = 0) ส่วนต่าง (R − AVC) คือ <b>Contribution Margin (CM)</b> — รายได้ส่วนที่นำไปชดเชย TFC ยิ่ง CM สูง จุดคุ้มทุนยิ่งต่ำ</p>\n      </div>\n      <div class=\"fm-card\"><h4>📌 สูตรที่ 2 — ต้นทุนรวม</h4>\n        <div class=\"fm-eq\">TC = TFC + ( AVC × Q )</div>\n        <p>ต้นทุนรวมมี 2 ส่วน คือ TFC (ไม่เปลี่ยนตาม Q) และ TVC = AVC × Q (แปรผันตาม Q) มมส. มีสัดส่วน TFC สูงถึง <b>61.6%</b> ทำให้ ATC ลดลงเมื่อ Q เพิ่ม (<b>Economies of Scale</b>)</p>\n      </div>\n      <div class=\"fm-card\"><h4>📌 สูตรที่ 3 — กำไร / ขาดทุน</h4>\n        <div class=\"fm-eq\">π = TR − TC = (R − AVC) × Q − TFC</div>\n        <p>ส่วนเกิน/ขาดทุน (π): เมื่อ Q &gt; Q* กำไรเพิ่มในอัตรา CM ต่อหน่วย · เมื่อ Q &lt; Q* จะขาดทุน</p>\n      </div>\n      <div class=\"fm-card\"><h4>📌 สูตรที่ 4 — รายได้ ณ จุดคุ้มทุน</h4>\n        <div class=\"fm-eq\">BE Revenue = Q* × R</div>\n        <p>รายได้ขั้นต่ำเพื่อไม่ขาดทุน ใช้วางแผนงบประมาณและกำหนดเป้ารับนิสิต · <b>Margin of Safety</b> = TR จริง − BE Rev — ยิ่งกว้างยิ่งมั่นคง</p>\n      </div>\n    </div>\n    <div class=\"fm-card\"><h4>📌 สูตรที่ 5 — ฐานรายได้ 2 กรณี (ตามไฟล์ต้นฉบับ)</h4>\n      <div class=\"fm-grid2\">\n        <div class=\"fm-eq\">R รวมแผ่นดิน = (งบแผ่นดิน + งบเงินรายได้) / Q</div>\n        <div class=\"fm-eq gold\">R ไม่รวมแผ่นดิน = งบเงินรายได้ / Q</div>\n      </div>\n      <p style=\"margin-top:8px\">แยกวิเคราะห์ 2 กรณีเพราะงบประมาณเงินแผ่นดินเป็น<b>เงินอุดหนุนจากรัฐ</b> ไม่ใช่รายได้ที่มหาวิทยาลัยหามาเอง</p>\n      <p><b>รวมเงินแผ่นดิน</b> — สะท้อนสถานะการเงินตามจริง (งบที่ได้รับทั้งหมด) &nbsp;·&nbsp; <b>ไม่รวมเงินแผ่นดิน</b> — สะท้อนความสามารถพึ่งพาตนเอง หากถูกตัดงบอุดหนุนจะอยู่รอดหรือไม่</p>\n      <p>ต้นทุน (TFC, TVC, AVC) เท่ากันทั้ง 2 กรณี — เปลี่ยนเฉพาะฝั่งรายได้ ทำให้ CM และ Q* ต่างกัน</p>\n    </div>\n    <div class=\"fm-grid2\">\n      <div class=\"fm-card\"><h4>📌 สูตรที่ 6 — จุดคุ้มทุนระดับคณะ (2 วิธี)</h4>\n        <div class=\"fm-eq\">วิธีหลัก: Q*คณะ = Σ Q*หลักสูตร i</div>\n        <p><b>วิธีผลรวมรายหลักสูตร (ค่าหลัก)</b> — หา Q* ของแต่ละหลักสูตรก่อน แล้วนำมาบวกกัน แต่ละหลักสูตรต้องคุ้มต้นทุนคงที่ของตัวเอง ชดเชยข้ามหลักสูตรไม่ได้ → เข้มงวดและตรงกับการบริหารจริง</p>\n        <p style=\"color:var(--text3)\"><b>วิธีเทียบ</b> Q* = TFCคณะ / (R − AVC) ใช้ยอดรวมทั้งคณะ ยอมให้หลักสูตรกำไรอุ้มหลักสูตรขาดทุน → ได้ Q* ต่ำกว่าจริง</p>\n      </div>\n      <div class=\"fm-card\"><h4>📌 สูตรที่ 7 — กรณี CM ≤ 0</h4>\n        <div class=\"fm-eq gold\">ถ้า (R − AVC) ≤ 0 → Q* = TC / R</div>\n        <p>เมื่อ AVC &gt; R (ต้นทุนผันแปรต่อหัวสูงกว่าค่าเทอมต่อหัว) ตัวส่วนของสูตรมาตรฐานจะติดลบ ได้ Q* ติดลบซึ่งไม่มีความหมาย จึงใช้หลัก <b>Full-Cost Recovery</b> — หาว่าต้องรับนิสิตกี่คนค่าเทอมรวมจึงครอบคลุมต้นทุนทั้งหมด</p>\n        <p><b>ตัวอย่าง</b> — เคมี (คณะวิทยาศาสตร์): TC ≈ 2.16 ล้านบาท · ค่าเทอม ≈ 93,000 บ./คน → Q* = 2,163,604 / 93,311 ≈ <b>23 คน</b></p>\n        <p style=\"color:var(--red)\">⚠ ค่าที่ได้เป็นเป้าหมายขั้นต่ำ ไม่ใช่จุดคุ้มทุนจริง — ทางแก้ที่ยั่งยืนคือลด AVC หรือขึ้นค่าธรรมเนียม</p>\n      </div>\n    </div>\n    <div class=\"fm-card\"><h4>📖 คำนิยามตัวแปรในสูตร</h4>\n      <table class=\"vartbl\"><thead><tr><th>สัญลักษณ์</th><th>ชื่อและความหมาย</th><th>หน่วย</th><th>มมส. (ข้อมูลอัพเดท)</th></tr></thead><tbody>\n        <tr><td>Q / Q*</td><td>จำนวนนิสิตจริง / ณ จุดคุ้มทุน · Q = ลงทะเบียนจริง, Q* = TFC / (R − AVC)</td><td>คน</td><td class=\"uq\">—</td></tr>\n        <tr><td>TR</td><td>รายได้รวม (Total Revenue = R × Q) · งบแผ่นดิน + งบเงินรายได้ (ค่าธรรมเนียม)</td><td>บาท</td><td class=\"utr\">—</td></tr>\n        <tr><td>TC</td><td>ต้นทุนรวม (Total Cost = TFC + TVC) · ต้นทุนทางตรงและทางอ้อมที่ปันส่วนมา</td><td>บาท</td><td class=\"utc\">—</td></tr>\n        <tr><td>TFC</td><td>ต้นทุนคงที่รวม · เงินเดือน ค่าเสื่อมราคา ปันส่วนสำนักงานเลขานุการ</td><td>บาท</td><td class=\"utfc\">—</td></tr>\n        <tr><td>TVC / AVC</td><td>ต้นทุนผันแปร / ต่อหน่วย · AVC = TVC / Q</td><td>บาท / บาท/คน</td><td class=\"utvc\">—</td></tr>\n        <tr><td>R</td><td>รายได้ต่อหน่วย (Revenue per Student = TR / Q)</td><td>บาท/คน</td><td class=\"ur\">—</td></tr>\n        <tr><td>π</td><td>กำไร/ขาดทุน · π &gt; 0 = ส่วนเกิน, π = 0 = BEP, π &lt; 0 = ขาดทุน</td><td>บาท</td><td class=\"upi\">—</td></tr>\n      </tbody></table>\n    </div>\n    <div class=\"fm-card\"><h4>🗂️ การจำแนกประเภทต้นทุน (Cost Classification)</h4>\n      <p style=\"margin-bottom:10px\">ตามหมวดรายจ่ายในไฟล์ต้นฉบับ · สัดส่วนจริง TFC : TVC = <b>61.6 : 38.4</b></p>\n      <div class=\"fm-grid2\">\n        <div class=\"classbox\"><div style=\"font-weight:700;color:var(--navy);font-size:12px;margin-bottom:8px\">ต้นทุนคงที่ (TFC) — ไม่แปรผันตามนิสิต</div>\n          <span class=\"tag\">100 เงินเดือน</span><span class=\"tag\">210 ค่าจ้างประจำ</span><span class=\"tag\">220 ค่าจ้างชั่วคราว</span><span class=\"tag\">230 ค่าตอบแทน พรก.</span><span class=\"tag\">300 ค่าตอบแทน</span><span class=\"tag\">400 ค่าใช้สอย</span><span class=\"tag\">500 ค่าวัสดุ</span><span class=\"tag\">600 ค่าครุภัณฑ์</span><span class=\"tag\">800 เงินอุดหนุน</span><span class=\"tag\">900 รายจ่ายอื่น</span><span class=\"tag\">+ ค่าเสื่อมราคา</span></div>\n        <div class=\"classbox\"><div style=\"font-weight:700;color:var(--gold);font-size:12px;margin-bottom:8px\">ต้นทุนผันแปร (TVC) — แปรผันตามนิสิต</div>\n          <span class=\"tag\">300 ค่าตอบแทน</span><span class=\"tag\">400 ค่าใช้สอย</span><span class=\"tag\">410 ค่าสาธารณูปโภค</span><span class=\"tag\">500 ค่าวัสดุ</span><span class=\"tag\">800 เงินอุดหนุน</span><span class=\"tag\">900 รายจ่ายอื่น</span><span class=\"tag\">×Q ศึกษาทั่วไป</span><span class=\"tag\">×Q ค่าธรรมเนียมรายการหลัก</span><span class=\"tag\">×Q หักสมทบมหาวิทยาลัย</span></div>\n      </div>\n      <div class=\"bm-note\" style=\"margin-top:12px\"><span>⚠️</span><span>TVC ในไฟล์ใหม่รวม <b>ค่าธรรมเนียมรายการหลัก</b> และ <b>หักสมทบมหาวิทยาลัย (2,235 บ./คน/เทอม)</b> ซึ่งคิดตามรายหัวนิสิต จึงทำให้สัดส่วน TVC สูงกว่าการคำนวณแบบเดิม</span></div>\n    </div>\n    <div class=\"fm-card\"><h4>📌 หมายเหตุ: ลำดับชั้นการวิเคราะห์ & \"ภาควิชา\"</h4>\n      <p>ระบบรวมข้อมูลจากล่างขึ้นบน: <b>หลักสูตร (230)</b> → <b>ระดับการศึกษาในแต่ละคณะ (ปริญญาตรี / บัณฑิตศึกษา)</b> → <b>คณะ (20)</b> → <b>มหาวิทยาลัย</b> ทุกตัวเลขระดับบนคือผลรวมของหน่วยย่อย ส่วน R, AVC, Q* คำนวณใหม่จากยอดรวมของหน่วยนั้น</p>\n      <p>ชุดข้อมูลนี้ไม่มีคอลัมน์ \"ภาควิชา\" โดยตรง ระบบจึงใช้ <b>ระดับการศึกษา</b> เป็นชั้นกลางแทน ซึ่งตรงกับวิธีที่ Excel ปันส่วนต้นทุนสำนักงานเลขานุการ (แยกระดับปริญญาตรี / บัณฑิตศึกษา) — หากมีตารางจับคู่หลักสูตร→ภาควิชาจริง สามารถสลับชั้นกลางได้ทันที</p>\n    </div>\n    <div class=\"fm-card\"><h4>📚 เอกสารอ้างอิง (APA 7th Edition)</h4>\n      <div class=\"refs\">\n        <div>[1] Horngren, C. T., Datar, S. M., &amp; Rajan, M. V. (2015). <i>Cost accounting: A managerial emphasis</i> (15th ed.). Pearson Education.</div>\n        <div>[2] Drury, C. (2018). <i>Management and cost accounting</i> (10th ed.). Cengage Learning EMEA.</div>\n        <div>[3] Garrison, R. H., Noreen, E. W., &amp; Brewer, P. C. (2021). <i>Managerial accounting</i> (17th ed.). McGraw-Hill Education.</div>\n        <div>[4] Johnes, G., &amp; Johnes, J. (Eds.). (2004). <i>International handbook on the economics of education</i>. Edward Elgar Publishing.</div>\n        <div>[5] กรมบัญชีกลาง. (2566). <i>หลักเกณฑ์การคำนวณต้นทุนต่อหน่วยผลผลิตของส่วนราชการ</i>. กระทรวงการคลัง.</div>\n        <div>[6] สำนักงานคณะกรรมการการอุดมศึกษา. (2565). <i>แนวทางการวิเคราะห์ต้นทุนและการจัดทำงบประมาณของสถาบันอุดมศึกษา</i>. กระทรวง อว.</div>\n        <div>[7] มหาวิทยาลัยมหาสารคาม. (2568). <i>รายงานต้นทุนต่อหน่วยผลผลิตและการวิเคราะห์จุดคุ้มทุน</i>. กองแผนงาน มมส.</div>\n        <div>[8] Worthington, A. C., &amp; Higgs, H. (2011). Economies of scale and scope in Australian higher education. <i>Higher Education, 61</i>(4), 387–414.</div>\n        <div>[9] Vanderbei, R. J. (2020). <i>Linear programming: Foundations and extensions</i> (5th ed.). Springer.</div>\n      </div>\n      <p style=\"color:var(--text3);font-size:11px;margin-top:14px\">แหล่งข้อมูล: ไฟล์ \"20260711_จุดคุ้มทุน update.xlsx\" — ชีต 1.รายได้ และ 2.ค่าใช้จ่าย · ปรับปรุงจากแอป breakeven_app v7</p>\n    </div>\n  </div>\n\n  <!-- SELF-CALC: FACULTY -->\n",
    init: function () {



/* ตัวเลขในตารางนิยามตัวแปรต้องมาจากชุดข้อมูลที่โหลดอยู่ ไม่ใช่พิมพ์ไว้ตายตัว */
const U = RAW.UNI, pct = (a, b) => (a / b * 100).toFixed(1) + '%';
const put = (cls, html) => document.querySelectorAll('.' + cls).forEach(e => (e.innerHTML = html));
put('uq', 'รวม ' + fmtN(U.Q) + ' คน');
put('utr', fmtM(U.TR) + ' ล้านบาท');
put('utc', fmtM(U.TC) + ' ล้านบาท');
put('utfc', fmtM(U.TFC) + ' ล้าน (' + pct(U.TFC, U.TC) + ')');
put('utvc', fmtM(U.TVC) + ' ล้าน (' + pct(U.TVC, U.TC) + ')');

const pi = U.TR - U.TC;
put('upi', (pi >= 0 ? '+' : '−') + fmtM(Math.abs(pi)) + ' ล้านบาท');


    },

  'W6-scenario-faculty': {
    w: "W6",
    title: "คำนวณจุดคุ้มทุนรายคณะ",
    bm: true,
    run: true,
    shell: true,
    caveat: false,
    html: "<div class=\"page\" id=\"p-input\">\n    <div class=\"sec-title\">✏️ คำนวณจุดคุ้มทุนรายคณะ / หน่วยงาน (กรอกเอง)</div>\n    <div class=\"card\" style=\"margin-bottom:16px\">\n      <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ขั้นตอนที่ 1 — เลือกคณะ / หน่วยงาน</div><div class=\"card-sub\">เลือกจากระบบเพื่อดึงข้อมูลอัตโนมัติ หรือกรอกเอง แล้วปรับแก้ได้</div></div><div class=\"chip chip-n\">ข้อมูลอัพเดท</div></div>\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1.15fr 1.15fr;gap:12px;align-items:end\">\n        <div><label class=\"inp-label\">📋 เลือกคณะจากระบบ</label><select id=\"inp-fac-sel\" class=\"inp\"><option value=\"\">-- เลือกคณะ --</option></select></div>\n        <div><label class=\"inp-label\">จำนวนนิสิต (Q)</label><input id=\"inp-q\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n        <div><label class=\"inp-label\">งบเงินแผ่นดิน (บาท)</label><input id=\"inp-st\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n        <div><label class=\"inp-label\">งบเงินรายได้ (บาท)</label><input id=\"inp-own\" class=\"inp\" type=\"number\" placeholder=\"0\" min=\"0\"></div>\n      </div>\n      <input id=\"inp-name\" type=\"hidden\" value=\"\"><input id=\"inp-tr\" type=\"hidden\" value=\"\">\n      <div id=\"inp-fac-badge\" style=\"display:none;margin-top:10px;padding:8px 14px;background:var(--navy4);border:1px solid rgba(109,76,255,.20);border-radius:8px;font-size:11px;color:var(--navy);font-weight:500;line-height:1.7\"></div>\n    </div>\n    <div class=\"g2\" style=\"margin-bottom:16px\">\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>ขั้นตอนที่ 2 — ต้นทุนคงที่ (TFC)</div><div class=\"card-sub\">เลือกหมวดจากรายการ หรือกรอกเอง</div></div><div class=\"chip chip-n\">TFC</div></div>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px\"><div style=\"font-size:11px;font-weight:700;color:var(--navy2)\">รายการต้นทุนคงที่</div><div style=\"font-size:12px;color:var(--text3)\">รวม TFC: <span id=\"tfc-sum\" class=\"num\" style=\"font-weight:700;color:var(--navy2)\">0</span> บาท</div></div>\n        <div id=\"tfc-items\" style=\"max-height:260px;overflow-y:auto\"></div>\n        <button class=\"btn-add-row\" onclick=\"addRow('tfc-items','TFC')\">+ เพิ่มรายการ TFC</button>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-head\"><div><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--green2)\"></span>ขั้นตอนที่ 3 — ต้นทุนผันแปร (TVC)</div><div class=\"card-sub\">เลือกหมวดจากรายการ หรือกรอกเอง</div></div><div class=\"chip chip-g\">TVC</div></div>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px\"><div style=\"font-size:11px;font-weight:700;color:var(--green2)\">รายการต้นทุนผันแปร</div><div style=\"font-size:12px;color:var(--text3)\">รวม TVC: <span id=\"tvc-sum\" class=\"num\" style=\"font-weight:700;color:var(--green2)\">0</span> บาท</div></div>\n        <div id=\"tvc-items\" style=\"max-height:260px;overflow-y:auto\"></div>\n        <button class=\"btn-add-row\" style=\"border-color:rgba(12,166,120,.35);color:var(--green2)\" onclick=\"addRow('tvc-items','TVC')\">+ เพิ่มรายการ TVC</button>\n      </div>\n    </div>\n    <div class=\"g2\" style=\"margin-bottom:16px\">\n      <div class=\"card\" style=\"background:var(--bg2)\">\n        <div class=\"card-head\"><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--text3)\"></span>สรุปตัวเลขก่อนคำนวณ</div></div>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px\">\n          <div class=\"stat-box\"><div class=\"stat-lbl\">Q (นิสิต)</div><div class=\"stat-val\" id=\"pre-q\" style=\"color:var(--navy2)\">—</div></div>\n          <div class=\"stat-box\"><div class=\"stat-lbl\">TR รวม</div><div class=\"stat-val\" id=\"pre-tr\" style=\"color:var(--navy2);font-size:11px\">—</div></div>\n          <div class=\"stat-box\"><div class=\"stat-lbl\">TC รวม</div><div class=\"stat-val\" id=\"pre-tc\" style=\"font-size:11px\">—</div></div>\n          <div class=\"stat-box\"><div class=\"stat-lbl\">TFC</div><div class=\"stat-val\" id=\"pre-tfc\" style=\"color:var(--navy2);font-size:11px\">—</div></div>\n          <div class=\"stat-box\"><div class=\"stat-lbl\">TVC</div><div class=\"stat-val\" id=\"pre-tvc\" style=\"color:var(--gold);font-size:11px\">—</div></div>\n          <div class=\"stat-box\"><div class=\"stat-lbl\">AVC/หัว</div><div class=\"stat-val\" id=\"pre-avc\" style=\"color:var(--gold);font-size:11px\">—</div></div>\n        </div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px\">\n          <div class=\"stat-box\" style=\"background:var(--navy4)\"><div class=\"stat-lbl\" style=\"color:var(--navy2)\">R/หัว — รวมแผ่นดิน</div><div class=\"stat-val\" id=\"pre-rin\" style=\"color:var(--navy2);font-size:12px\">—</div></div>\n          <div class=\"stat-box\" style=\"background:var(--gold4)\"><div class=\"stat-lbl\" style=\"color:var(--gold)\">R/หัว — ไม่รวมแผ่นดิน</div><div class=\"stat-val\" id=\"pre-rex\" style=\"color:var(--gold);font-size:12px\">—</div></div>\n        </div>\n        <button class=\"btn-primary\" onclick=\"calcInp()\">▶ คำนวณจุดคุ้มทุน</button>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-head\"><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--red2)\"></span>ผลการคำนวณ</div></div>\n        <div id=\"inp-result\"><div style=\"padding:20px;text-align:center;color:var(--text4);font-size:13px\">กรอกข้อมูลครบแล้วกดคำนวณ</div></div>\n        <button id=\"btn-save\" class=\"btn-primary\" style=\"display:none;margin-top:8px;background:var(--green2)\" onclick=\"saveInp()\">+ บันทึกลงรายการ</button>\n      </div>\n    </div>\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\"><span class=\"dot\" style=\"background:var(--navy2)\"></span>รายการที่บันทึก</div><button onclick=\"inpList=[];renderInpList()\" style=\"font-size:10px;padding:4px 12px;border:1px solid var(--red3);background:var(--red3);color:var(--red2);border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600\">ล้างทั้งหมด</button></div>\n      <div id=\"inp-saved\"><div style=\"padding:16px;text-align:center;color:var(--text4);font-size:12px\">ยังไม่มีรายการ</div></div>\n    </div>\n  </div>\n\n  <!-- SELF-CALC: PROGRAM -->\n",
